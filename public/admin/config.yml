backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "public/image"
public_folder: "/image"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Description", name: "description", widget: "string", required: true }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", required: true }
      - { label: "Updated Date", name: "updated", widget: "datetime", required: false }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Badge", name: "badge", widget: "string", required: false, hint: "Set to 'Pin' to pin this post" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
