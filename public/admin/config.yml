# ============================================
# Decap CMS Configuration - Ngopidulur Blog
# ============================================
# LOCAL MODE: jalankan `npx decap-server` untuk edit dari localhost
# Auto deploy: git push → GitHub Actions → cPanel

site_url: https://ngopidulur.my.id
display_url: https://ngopidulur.my.id
logo_url: /logo.png

local_backend: true

backend:
  name: git-gateway
  branch: main

# --- Media ---
media_folder: "public/image"
public_folder: "/image"

# --- Editorial Workflow ---
publish_mode: editorial_workflow

# --- Slug ---
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# --- Collections ---
collections:
  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "/blog/{{slug}}"
    sortable_fields:
      - title
      - pubDate
      - categories
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Description", name: "description", widget: "text", required: true }
      - { label: "Publish Date", name: "pubDate", widget: "datetime", required: true }
      - { label: "Updated Date", name: "updated", widget: "datetime", required: false }
      - label: "Cover Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Badge"
        name: "badge"
        widget: "select"
        required: false
        options:
          - { label: "None", value: "" }
          - { label: "Pin", value: "Pin" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Teknologi"
          - "Tulisan-Random"
          - "Documentation"
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
      - { label: "Body", name: "body", widget: "markdown" }
