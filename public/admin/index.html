<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Ngopidulur CMS</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      #token-form {
        display: none;
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.85); z-index: 99999;
        justify-content: center; align-items: center;
      }
      #token-form.show { display: flex; }
      #token-form .box {
        background: #161b22; border: 1px solid #30363d;
        border-radius: 12px; padding: 36px; max-width: 460px; width: 90%;
        text-align: center; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #token-form h2 { color: #58a6ff; font-size: 1.3rem; margin: 0 0 8px; }
      #token-form .sub { color: #8b949e; font-size: 0.88rem; margin-bottom: 16px; line-height:1.5; }
      #token-form a { color: #58a6ff; }
      #token-form input {
        width: 100%; padding: 12px; border-radius: 8px; box-sizing: border-box;
        border: 1px solid #30363d; background: #0d1117; color: #c9d1d9;
        font-family: monospace; font-size: 0.9rem; margin-bottom: 16px;
      }
      #token-form button {
        padding: 10px 24px; border-radius: 8px; border: none;
        cursor: pointer; font-size: 0.95rem; font-weight: 500;
      }
      .btn-save { background: #238636; color: #fff; }
      .btn-save:hover { background: #2ea043; }
    </style>
  </head>
  <body>
    <!-- Token Input -->
    <div id="token-form" class="show">
      <div class="box">
        <h2>🔑 Ngopidulur CMS</h2>
        <p class="sub">
          Masukkan <b>GitHub Personal Access Token</b><br>
          <a href="https://github.com/settings/tokens/new?scopes=repo&description=DecapCMS" target="_blank">
          🪄 Buat token otomatis (scope: repo) →
          </a>
        </p>
        <input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxx" />
        <button class="btn-save" onclick="saveAndGo()">💾 Simpan & Masuk Dashboard</button>
      </div>
    </div>

    <!-- Decap CMS -->
    <script src="/admin/decap-cms.js"></script>

    <script>
      var SAVED = localStorage.getItem('decap-github-token');

      function saveAndGo() {
        var t = document.getElementById('token-input').value.trim();
        if (!t) return alert('Masukkan token!');
        localStorage.setItem('decap-github-token', t);
        document.getElementById('token-form').classList.remove('show');
        location.reload();
      }

      if (SAVED) {
        document.getElementById('token-form').classList.remove('show');

        // === Override backend GitHub Decap CMS ===
        // Tunggu CMS ready, lalu override authenticate()
        var checkInterval = setInterval(function() {
          if (window.CMS && window.CMS.getBackend) {
            clearInterval(checkInterval);
            setupTokenInjection();
          }
        }, 200);

        // Timeout: kalau CMS gak muncul dalam 10 detik, coba manual
        setTimeout(function() {
          if (window.CMS && !window.__tokenInjected) setupTokenInjection();
        }, 10000);
      }

      function setupTokenInjection() {
        if (window.__tokenInjected) return;
        window.__tokenInjected = true;

        var token = SAVED;

        // Cara 1: Override CMS.getBackend / registerBackend
        try {
          // Register custom backend yang selalu return token
          CMS.registerBackend('github', function(config) {
            var origBackend = new (CMS.getBackend('github').constructor)(config);
            // Override getToken
            origBackend.getToken = function() { return Promise.resolve(token); };
            // Override authenticate
            origBackend.authenticate = function() { return Promise.resolve({ token: token, provider: 'github' }); };
            // Override restoreUser
            origBackend.restoreUser = function() { 
              return Promise.resolve({ name: 'Admin', login: 'rifkyawalulhuda', avatar_url: '', token: token });
            };
            return origBackend;
          });
          console.log('✅ Backend GitHub di-override dengan token');
        } catch(e) {
          console.log('⚠️ registerBackend gagal:', e.message);
        }

        // Cara 2: Intercept fetch (fallback)
        var origFetch = window.fetch;
        window.fetch = function(url, opts) {
          if (typeof url === 'string' && (url.includes('api.github.com') || url.includes('workers.dev'))) {
            opts = opts || {};
            opts.headers = opts.headers || {};
            if (opts.headers instanceof Headers) {
              opts.headers.set('Authorization', 'Bearer ' + token);
            } else if (!opts.headers.Authorization) {
              opts.headers['Authorization'] = 'Bearer ' + token;
            }
          }
          return origFetch.call(this, url, opts);
        };
        console.log('✅ Fetch interceptor aktif');
      }
    </script>
  </body>
</html>
