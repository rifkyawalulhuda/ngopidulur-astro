<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Auth Callback</title>
</head>
<body>
<script>
(function() {
  // Baca token dari URL hash: #token=gho_xxx
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var token = params.get('token');
  var provider = params.get('provider') || 'github';

  if (token && window.opener && window.opener !== window) {
    // Kirim token ke Decap CMS (same origin, pasti diterima!)
    window.opener.postMessage(
      { token: token, provider: provider },
      window.location.origin
    );
    // Tutup popup setelah dikit
    setTimeout(function() { window.close(); }, 200);
  } else {
    document.body.innerHTML = '<div style="text-align:center;padding:40px;font-family:sans-serif;">'
      + (token ? '<h2 style="color:#2ea44f;">✅ Login sukses!</h2><p>Tutup jendela ini.</p>' 
              : '<h2 style="color:#cf222e;">❌ Tidak ada token</h2><p>Coba login lagi dari halaman admin.</p>')
      + '</div>';
  }
})();
</script>
</body>
</html>
