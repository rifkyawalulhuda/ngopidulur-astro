<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Preattentive Attributes</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Diproses otak dalam &lt;250ms, sebelum perhatian sadar (Colin Ware)</text>
  <!-- 3 stages -->
  <rect x="50" y="85" width="260" height="90" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="180" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Stage 1</text>
  <text x="180" y="132" font-size="11" text-anchor="middle" fill="#d5e8f5">Extract basic characteristics</text>
  <text x="180" y="152" font-size="10" text-anchor="middle" fill="#ffffff">&lt; 250ms, otomatis</text>
  <rect x="320" y="85" width="260" height="90" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="450" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Stage 2</text>
  <text x="450" y="132" font-size="11" text-anchor="middle" fill="#d5f5e3">Process patterns</text>
  <text x="450" y="152" font-size="10" text-anchor="middle" fill="#ffffff">Secara sadar</text>
  <rect x="590" y="85" width="260" height="90" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="720" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Stage 3</text>
  <text x="720" y="132" font-size="11" text-anchor="middle" fill="#e8daef">Highest perception</text>
  <text x="720" y="152" font-size="10" text-anchor="middle" fill="#ffffff">Jawaban pertanyaan visual</text>
  <!-- Arrows -->
  <text x="300" y="132" font-size="20" text-anchor="middle" fill="#7f8c8d">→</text>
  <text x="570" y="132" font-size="20" text-anchor="middle" fill="#7f8c8d">→</text>
  <!-- For Lines -->
  <rect x="50" y="195" width="390" height="180" rx="10" fill="#ecf0f1"/>
  <text x="245" y="220" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Untuk Lines</text>
  <rect x="70" y="235" width="170" height="30" rx="5" fill="#3498db"/>
  <text x="155" y="255" font-size="11" text-anchor="middle" fill="#ffffff">Shape (bentuk)</text>
  <rect x="250" y="235" width="170" height="30" rx="5" fill="#2980b9"/>
  <text x="335" y="255" font-size="11" text-anchor="middle" fill="#ffffff">Orientation (arah)</text>
  <rect x="70" y="270" width="170" height="30" rx="5" fill="#3498db"/>
  <text x="155" y="290" font-size="11" text-anchor="middle" fill="#ffffff">Line Width (ketebalan)</text>
  <rect x="250" y="270" width="170" height="30" rx="5" fill="#2980b9"/>
  <text x="335" y="290" font-size="11" text-anchor="middle" fill="#ffffff">Line Length (panjang)</text>
  <rect x="70" y="305" width="170" height="30" rx="5" fill="#3498db"/>
  <text x="155" y="325" font-size="11" text-anchor="middle" fill="#ffffff">Curvature (lengkung)</text>
  <rect x="250" y="305" width="170" height="30" rx="5" fill="#2980b9"/>
  <text x="335" y="325" font-size="11" text-anchor="middle" fill="#ffffff">Added Marks (tanda)</text>
  <!-- For Planes -->
  <rect x="460" y="195" width="390" height="180" rx="10" fill="#ecf0f1"/>
  <text x="655" y="220" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Untuk Planes</text>
  <rect x="480" y="235" width="170" height="30" rx="5" fill="#9b59b6"/>
  <text x="565" y="255" font-size="11" text-anchor="middle" fill="#ffffff">Color / Hue (warna)</text>
  <rect x="660" y="235" width="170" height="30" rx="5" fill="#8e44ad"/>
  <text x="745" y="255" font-size="11" text-anchor="middle" fill="#ffffff">Intensity (terang-gelap)</text>
  <rect x="480" y="270" width="170" height="30" rx="5" fill="#9b59b6"/>
  <text x="565" y="290" font-size="11" text-anchor="middle" fill="#ffffff">Size (ukuran)</text>
  <rect x="660" y="270" width="170" height="30" rx="5" fill="#8e44ad"/>
  <text x="745" y="290" font-size="11" text-anchor="middle" fill="#ffffff">2-D Position (posisi)</text>
  <rect x="480" y="305" width="170" height="30" rx="5" fill="#9b59b6"/>
  <text x="565" y="325" font-size="11" text-anchor="middle" fill="#ffffff">Enclosure (batas)</text>
  <rect x="660" y="305" width="170" height="30" rx="5" fill="#8e44ad"/>
  <text x="745" y="325" font-size="11" text-anchor="middle" fill="#ffffff">Numerosity (jumlah)</text>
  <!-- Key rule -->
  <rect x="150" y="395" width="600" height="75" rx="8" fill="#34495e" opacity="0.9"/>
  <text x="450" y="422" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Aturan Kunci Persepsi</text>
  <text x="450" y="445" font-size="12" text-anchor="middle" fill="#f39c12">Hanya POSISI dan PANJANG yang bisa mempersepsikan data kuantitatif secara akurat</text>
  <text x="450" y="463" font-size="10" text-anchor="middle" fill="#bdc3c7">Atribut lain (warna, ukuran) untuk data kategorikal &amp; relasional</text>
</svg>