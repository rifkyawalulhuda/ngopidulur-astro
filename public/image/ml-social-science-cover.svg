<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0f1a2e"/>
      <stop offset="100%" stop-color="#0a1620"/>
    </linearGradient>
    <linearGradient id="green1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4aa"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="pink1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fd79a8"/>
      <stop offset="100%" stop-color="#e84393"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Dot matrix -->
  <g opacity="0.04">
    <pattern id="dots" x="0" y="0" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#00d4aa"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#dots)"/>
  </g>

  <!-- Neural network visualization -->
  <g transform="translate(60, 80)" filter="url(#glow)">
    <!-- Layer 1 (input) -->
    <circle cx="0" cy="60" r="5" fill="url(#green1)" opacity="0.8"/>
    <circle cx="0" cy="140" r="5" fill="url(#green1)" opacity="0.8"/>
    <circle cx="0" cy="220" r="5" fill="url(#green1)" opacity="0.8"/>
    <circle cx="0" cy="300" r="5" fill="url(#green1)" opacity="0.8"/>
    <circle cx="0" cy="380" r="5" fill="url(#green1)" opacity="0.8"/>

    <!-- Layer 2 (hidden) -->
    <circle cx="100" cy="50" r="7" fill="url(#blue1)" opacity="0.7"/>
    <circle cx="100" cy="130" r="7" fill="url(#blue1)" opacity="0.7"/>
    <circle cx="100" cy="210" r="7" fill="url(#blue1)" opacity="0.7"/>
    <circle cx="100" cy="290" r="7" fill="url(#blue1)" opacity="0.7"/>
    <circle cx="100" cy="370" r="7" fill="url(#blue1)" opacity="0.7"/>

    <!-- Layer 3 (hidden) -->
    <circle cx="200" cy="80" r="6" fill="url(#pink1)" opacity="0.6"/>
    <circle cx="200" cy="180" r="6" fill="url(#pink1)" opacity="0.6"/>
    <circle cx="200" cy="280" r="6" fill="url(#pink1)" opacity="0.6"/>
    <circle cx="200" cy="380" r="6" fill="url(#pink1)" opacity="0.6"/>

    <!-- Layer 4 (output) -->
    <circle cx="300" cy="140" r="5" fill="url(#green1)" opacity="0.8"/>
    <circle cx="300" cy="240" r="5" fill="url(#green1)" opacity="0.8"/>
    <circle cx="300" cy="340" r="5" fill="url(#green1)" opacity="0.8"/>

    <!-- Connections -->
    <g stroke="#00d4aa" stroke-width="0.4" opacity="0.12">
      <!-- L1 to L2 -->
      <line x1="5" y1="60" x2="93" y2="50"/><line x1="5" y1="60" x2="93" y2="130"/>
      <line x1="5" y1="140" x2="93" y2="50"/><line x1="5" y1="140" x2="93" y2="130"/>
      <line x1="5" y1="220" x2="93" y2="210"/><line x1="5" y1="220" x2="93" y2="290"/>
      <line x1="5" y1="300" x2="93" y2="290"/><line x1="5" y1="300" x2="93" y2="370"/>
      <line x1="5" y1="380" x2="93" y2="370"/>
      <!-- L2 to L3 -->
      <line x1="107" y1="50" x2="194" y2="80"/><line x1="107" y1="130" x2="194" y2="80"/>
      <line x1="107" y1="210" x2="194" y2="180"/><line x1="107" y1="290" x2="194" y2="280"/>
      <line x1="107" y1="370" x2="194" y2="380"/>
      <!-- L3 to L4 -->
      <line x1="206" y1="80" x2="295" y2="140"/><line x1="206" y1="180" x2="295" y2="140"/>
      <line x1="206" y1="280" x2="295" y2="240"/><line x1="206" y1="380" x2="295" y2="340"/>
    </g>
  </g>

  <!-- Feature importance bars -->
  <g transform="translate(430, 150)">
    <rect x="0" y="0" width="180" height="8" rx="4" fill="url(#green1)" opacity="0.8"/>
    <text x="186" y="8" font-family="monospace" font-size="10" fill="#00d4aa">Feature A</text>
    <rect x="0" y="18" width="140" height="8" rx="4" fill="url(#blue1)" opacity="0.7"/>
    <text x="146" y="26" font-family="monospace" font-size="10" fill="#a29bfe">Feature B</text>
    <rect x="0" y="36" width="100" height="8" rx="4" fill="url(#pink1)" opacity="0.6"/>
    <text x="106" y="44" font-family="monospace" font-size="10" fill="#fd79a8">Feature C</text>
    <rect x="0" y="54" width="70" height="8" rx="4" fill="url(#green1)" opacity="0.5"/>
    <text x="76" y="62" font-family="monospace" font-size="10" fill="#00b894">Feature D</text>
    <rect x="0" y="72" width="45" height="8" rx="4" fill="url(#blue1)" opacity="0.4"/>
    <text x="51" y="80" font-family="monospace" font-size="10" fill="#6c5ce7">Feature E</text>
  </g>

  <!-- Decision tree nodes -->
  <g transform="translate(430, 280)">
    <rect x="0" y="0" width="80" height="30" rx="6" fill="none" stroke="url(#green1)" stroke-width="1.5" opacity="0.7"/>
    <text x="40" y="20" font-family="monospace" font-size="9" fill="#00d4aa" text-anchor="middle">X > 0.5?</text>
    <line x1="40" y1="30" x2="10" y2="50" stroke="#00d4aa" stroke-width="0.8" opacity="0.5"/>
    <line x1="40" y1="30" x2="70" y2="50" stroke="#00d4aa" stroke-width="0.8" opacity="0.5"/>
    <rect x="-30" y="50" width="80" height="26" rx="6" fill="none" stroke="url(#blue1)" stroke-width="1.2" opacity="0.5"/>
    <text x="10" y="67" font-family="monospace" font-size="8" fill="#a29bfe" text-anchor="middle">Class A</text>
    <rect x="30" y="50" width="80" height="26" rx="6" fill="none" stroke="url(#pink1)" stroke-width="1.2" opacity="0.5"/>
    <text x="70" y="67" font-family="monospace" font-size="8" fill="#fd79a8" text-anchor="middle">Class B</text>
  </g>

  <!-- Title -->
  <g transform="translate(700, 200)">
    <text x="0" y="0" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Machine
    </text>
    <text x="0" y="46" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="800" fill="url(#green1)" letter-spacing="-1" filter="url(#glow)">
      Learning
    </text>
    <text x="0" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="600" fill="#a29bfe" letter-spacing="2">
      in SOCIAL SCIENCE
    </text>
    <rect x="0" y="108" width="80" height="3" rx="1.5" fill="url(#green1)" filter="url(#glow)"/>

    <text x="0" y="145" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1">
      PREDICTION · CAUSAL INFERENCE · NLP · CGT · DML
    </text>
  </g>

  <!-- Bottom tag chips -->
  <g transform="translate(700, 470)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="#00d4aa" opacity="0.12"/>
    <text x="35" y="16" font-family="system-ui" font-size="10" fill="#00d4aa" text-anchor="middle">Supervised</text>

    <rect x="80" y="0" width="85" height="24" rx="12" fill="#6c5ce7" opacity="0.12"/>
    <text x="123" y="16" font-family="system-ui" font-size="10" fill="#a29bfe" text-anchor="middle">Unsupervised</text>

    <rect x="175" y="0" width="60" height="24" rx="12" fill="#fd79a8" opacity="0.12"/>
    <text x="205" y="16" font-family="system-ui" font-size="10" fill="#fd79a8" text-anchor="middle">Causal</text>

    <rect x="0" y="32" width="50" height="24" rx="12" fill="#00d4aa" opacity="0.12"/>
    <text x="25" y="48" font-family="system-ui" font-size="10" fill="#00d4aa" text-anchor="middle">NLP</text>

    <rect x="60" y="32" width="50" height="24" rx="12" fill="#6c5ce7" opacity="0.12"/>
    <text x="85" y="48" font-family="system-ui" font-size="10" fill="#a29bfe" text-anchor="middle">CGT</text>

    <rect x="120" y="32" width="45" height="24" rx="12" fill="#fd79a8" opacity="0.12"/>
    <text x="143" y="48" font-family="system-ui" font-size="10" fill="#fd79a8" text-anchor="middle">DML</text>
  </g>

  <!-- ngopidulur branding -->
  <text x="30" y="605" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#334155">ngopidulur.my.id</text>
  <text x="1170" y="605" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#334155" text-anchor="end">ML in Social Science Series</text>
</svg>
