<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080d18"/>
      <stop offset="100%" style="stop-color:#0f1929"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#009900"/>
      <stop offset="100%" style="stop-color:#00cc44"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#26c6da"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#green)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#green)"/>

  <!-- Left: Microservices architecture diagram -->
  <g transform="translate(50, 70)">
    <!-- API Gateway top -->
    <rect x="80" y="0" width="240" height="40" rx="8" fill="#0d2a1a" stroke="#00cc44" stroke-width="2"/>
    <text x="200" y="14" font-family="monospace" font-size="11" fill="#00cc44" text-anchor="middle" font-weight="bold">API Gateway</text>
    <text x="200" y="30" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">Auth | Rate Limit | Route</text>

    <!-- Arrows down -->
    <line x1="120" y1="40" x2="80" y2="80" stroke="#00cc44" stroke-width="1.5"/>
    <line x1="200" y1="40" x2="200" y2="80" stroke="#00cc44" stroke-width="1.5"/>
    <line x1="280" y1="40" x2="320" y2="80" stroke="#00cc44" stroke-width="1.5"/>

    <!-- Services row 1 -->
    <rect x="0" y="80" width="110" height="60" rx="8" fill="#0a1a12" stroke="#00cc44" stroke-width="1.5"/>
    <text x="55" y="100" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">User</text>
    <text x="55" y="116" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Service</text>
    <text x="55" y="132" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">[DB]</text>

    <rect x="145" y="80" width="110" height="60" rx="8" fill="#0a1a12" stroke="#00cc44" stroke-width="1.5"/>
    <text x="200" y="100" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Order</text>
    <text x="200" y="116" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Service</text>
    <text x="200" y="132" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">[DB]</text>

    <rect x="290" y="80" width="110" height="60" rx="8" fill="#0a1a12" stroke="#00cc44" stroke-width="1.5"/>
    <text x="345" y="100" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Payment</text>
    <text x="345" y="116" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Service</text>
    <text x="345" y="132" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">[DB]</text>

    <!-- Message Bus -->
    <rect x="0" y="170" width="400" height="30" rx="6" fill="#062a2a" stroke="#00bcd4" stroke-width="1.5"/>
    <text x="200" y="189" font-family="monospace" font-size="10" fill="#26c6da" text-anchor="middle">Message Bus / Event Queue</text>

    <!-- Arrows up from services to bus -->
    <line x1="55" y1="140" x2="55" y2="170" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="200" y1="140" x2="200" y2="170" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="345" y1="140" x2="345" y2="170" stroke="#00bcd4" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Services row 2 -->
    <rect x="0" y="220" width="110" height="60" rx="8" fill="#0a1a12" stroke="#00cc44" stroke-width="1.5"/>
    <text x="55" y="240" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Notif</text>
    <text x="55" y="256" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">Service</text>
    <text x="55" y="272" font-family="monospace" font-size="8" fill="#166534" text-anchor="middle">[DB]</text>

    <rect x="145" y="220" width="110" height="60" rx="8" fill="#0a1a12" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="240" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">Analytics</text>
    <text x="200" y="256" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">Service</text>
    <text x="200" y="272" font-family="monospace" font-size="8" fill="#92400e" text-anchor="middle">[DB]</text>

    <rect x="290" y="220" width="110" height="60" rx="8" fill="#0a1a12" stroke="#f87171" stroke-width="1.5"/>
    <text x="345" y="240" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">Inventory</text>
    <text x="345" y="256" font-family="monospace" font-size="10" fill="#fca5a5" text-anchor="middle">Service</text>
    <text x="345" y="272" font-family="monospace" font-size="8" fill="#7f1d1d" text-anchor="middle">[DB]</text>

    <!-- Circuit Breaker indicator -->
    <rect x="0" y="310" width="400" height="50" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
    <text x="20" y="330" font-family="monospace" font-size="10" fill="#fca5a5">Circuit Breaker:</text>
    <rect x="130" y="316" width="50" height="18" rx="4" fill="#166534"/>
    <text x="155" y="329" font-family="monospace" font-size="9" fill="#4ade80" text-anchor="middle">CLOSED</text>
    <rect x="192" y="316" width="50" height="18" rx="4" fill="#7f1d1d"/>
    <text x="217" y="329" font-family="monospace" font-size="9" fill="#fca5a5" text-anchor="middle">OPEN</text>
    <rect x="254" y="316" width="70" height="18" rx="4" fill="#451a03"/>
    <text x="289" y="329" font-family="monospace" font-size="9" fill="#fbbf24" text-anchor="middle">HALF-OPEN</text>
    <text x="20" y="351" font-family="monospace" font-size="9" fill="#6b7280">failure_threshold=5 | timeout=30s</text>

    <!-- Scale arrows -->
    <g transform="translate(0, 380)">
      <text x="0" y="16" font-family="monospace" font-size="10" fill="#6b7280">Scale independently:</text>
      <rect x="0" y="24" width="30" height="16" rx="3" fill="#0a1a12" stroke="#00cc44" stroke-width="1"/>
      <rect x="36" y="24" width="30" height="16" rx="3" fill="#0a1a12" stroke="#00cc44" stroke-width="1"/>
      <rect x="72" y="24" width="30" height="16" rx="3" fill="#0a1a12" stroke="#00cc44" stroke-width="1"/>
      <text x="55" y="34" font-family="monospace" font-size="8" fill="#4ade80" text-anchor="middle">User x3</text>
      <rect x="130" y="24" width="30" height="16" rx="3" fill="#0a1a12" stroke="#f59e0b" stroke-width="1"/>
      <text x="185" y="34" font-family="monospace" font-size="8" fill="#fbbf24" text-anchor="middle">Search x10 (scale!)</text>
      <rect x="240" y="24" width="30" height="16" rx="3" fill="#0a1a12" stroke="#4ade80" stroke-width="1"/>
      <text x="270" y="34" font-family="monospace" font-size="8" fill="#4ade80">Order x2</text>
    </g>
  </g>

  <!-- Right: Title -->
  <text x="550" y="120" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681" letter-spacing="4">SAM NEWMAN — O'REILLY 2015</text>
  <text x="550" y="180" font-family="'Segoe UI', sans-serif" font-size="38" fill="#f0f6fc" font-weight="800" letter-spacing="-1">Building</text>
  <text x="550" y="228" font-family="'Segoe UI', sans-serif" font-size="38" fill="url(#green)" font-weight="800" letter-spacing="-1">Microservices</text>
  <text x="550" y="268" font-family="'Segoe UI', sans-serif" font-size="22" fill="url(#teal)" font-weight="600">Preview Edition — NGINX</text>
  <rect x="550" y="282" width="220" height="4" rx="2" fill="url(#green)"/>

  <text x="550" y="318" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">Panduan Lengkap Bahasa Indonesia</text>
  <text x="550" y="338" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">Chapter 1, 2, dan 3 — 3 Artikel Seri</text>

  <!-- Pills -->
  <g transform="translate(550, 360)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#0a1a12"/>
    <text x="55" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">Microservices</text>
    <rect x="122" y="0" width="80" height="26" rx="13" fill="#0a1a12"/>
    <text x="162" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">REST/gRPC</text>
    <rect x="214" y="0" width="80" height="26" rx="13" fill="#1a0a12"/>
    <text x="254" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fca5a5" text-anchor="middle">Circuit Breaker</text>
    <rect x="0" y="36" width="70" height="26" rx="13" fill="#062a2a"/>
    <text x="35" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#26c6da" text-anchor="middle">CAP Theorem</text>
    <rect x="82" y="36" width="90" height="26" rx="13" fill="#1a1206"/>
    <text x="127" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Event-Driven</text>
    <rect x="184" y="36" width="110" height="26" rx="13" fill="#0a1a12"/>
    <text x="239" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">Strangler Pattern</text>
  </g>

  <!-- Series list -->
  <g transform="translate(550, 446)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.1  Definisi, Manfaat, SOA vs Microservices, Conway's Law</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.2  Integrasi: REST, RPC, Event, Versioning, Strangler</text>
    <text x="0" y="36" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.3  At Scale: Failure, Circuit Breaker, Caching, CAP, Discovery</text>
  </g>

  <text x="560" y="570" font-family="'Segoe UI', sans-serif" font-size="12" fill="#30363d">ngopidulur.my.id</text>

  <!-- Glow -->
  <circle cx="1150" cy="100" r="100" fill="#00cc44" opacity="0.04"/>
  <circle cx="1150" cy="550" r="80" fill="#00bcd4" opacity="0.04"/>
</svg>
