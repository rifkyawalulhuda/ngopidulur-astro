<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff" rx="12"/>
  <rect width="900" height="340" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Percentile Latency — Lebih Bermakna dari Rata-rata</text>
  <!-- Chart area -->
  <!-- Y axis label -->
  <text x="45" y="150" font-family="Inter,Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle" transform="rotate(-90 45 150)">latency (ms)</text>
  <!-- Grid lines -->
  <line x1="70" y1="100" x2="830" y2="100" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="160" x2="830" y2="160" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="220" x2="830" y2="220" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="70" y1="280" x2="830" y2="280" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Axis -->
  <line x1="70" y1="280" x2="830" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="70" y1="100" x2="70" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Bars -->
  <!-- Avg -->
  <rect x="110" y="250" width="100" height="30" fill="#94a3b8" rx="6"/>
  <text x="160" y="240" font-family="Inter,Arial,sans-serif" font-size="11" fill="#475569" text-anchor="middle" font-weight="700">Avg: 100ms</text>
  <text x="160" y="270" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">menyesatkan!</text>
  <!-- P50 -->
  <rect x="250" y="265" width="100" height="15" fill="#22c55e" rx="6"/>
  <text x="300" y="255" font-family="Inter,Arial,sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">P50: 80ms</text>
  <text x="300" y="295" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">50% request lebih cepat</text>
  <!-- P95 -->
  <rect x="390" y="225" width="100" height="55" fill="#f59e0b" rx="6"/>
  <text x="440" y="215" font-family="Inter,Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">P95: 200ms</text>
  <text x="440" y="255" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b45309" text-anchor="middle">95% request</text>
  <text x="440" y="268" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b45309" text-anchor="middle">lebih cepat</text>
  <!-- P99 -->
  <rect x="530" y="130" width="100" height="150" fill="#ef4444" rx="6"/>
  <text x="580" y="120" font-family="Inter,Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">P99: 800ms</text>
  <text x="580" y="165" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">99% request</text>
  <text x="580" y="178" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">lebih cepat</text>
  <!-- Callout -->
  <path d="M 630 145 L 700 105" stroke="#ef4444" stroke-width="1.5" fill="none"/>
  <rect x="660" y="75" width="170" height="45" fill="#fef2f2" rx="8" stroke="#ef4444" stroke-width="1.5"/>
  <text x="745" y="95" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle" font-weight="600">Ini yang users rasakan</text>
  <text x="745" y="110" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">(worst case biasa)</text>
  <!-- Footer -->
  <text x="450" y="325" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Building Microservices (Sam Newman) — Latency metrics</text>
</svg>
