<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="Inter, Segoe UI, sans-serif">
  <!-- Background -->
  <rect width="900" height="380" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Circuit Breaker State Machine</text>
  <text x="450" y="58" text-anchor="middle" font-size="12" fill="#64748b">Pattern Resiliensi untuk Microservices</text>

  <!-- ── CLOSED state ── -->
  <circle cx="160" cy="200" r="72" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="160" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">CLOSED</text>
  <text x="160" y="213" text-anchor="middle" font-size="11" fill="#166534">Normal Operation</text>
  <text x="160" y="230" text-anchor="middle" font-size="10" fill="#166534">Requests pass through</text>

  <!-- ── OPEN state ── -->
  <circle cx="740" cy="200" r="72" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="740" y="195" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">OPEN</text>
  <text x="740" y="213" text-anchor="middle" font-size="11" fill="#991b1b">Circuit Tripped</text>
  <text x="740" y="230" text-anchor="middle" font-size="10" fill="#991b1b">Requests fail fast</text>

  <!-- ── HALF-OPEN state ── -->
  <circle cx="450" cy="310" r="60" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
  <text x="450" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">HALF-OPEN</text>
  <text x="450" y="321" text-anchor="middle" font-size="10" fill="#92400e">Testing Recovery</text>
  <text x="450" y="336" text-anchor="middle" font-size="9" fill="#92400e">Limited probe requests</text>

  <!-- ── Arrow: CLOSED → OPEN (failure threshold exceeded) ── -->
  <!-- Curved path above the two circles -->
  <path d="M 230 175 Q 450 80 670 175" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">Failure threshold exceeded</text>
  <text x="450" y="124" text-anchor="middle" font-size="10" fill="#dc2626">(e.g. 50% errors in 10 calls)</text>

  <!-- ── Arrow: OPEN → HALF-OPEN (timeout elapsed) ── -->
  <path d="M 710 258 Q 600 320 510 316" fill="none" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrowYellow)"/>
  <text x="635" y="308" text-anchor="middle" font-size="11" fill="#92400e" font-weight="600">Timeout elapsed</text>

  <!-- ── Arrow: HALF-OPEN → CLOSED (probe success) ── -->
  <path d="M 392 296 Q 280 260 225 240" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="290" y="263" text-anchor="middle" font-size="11" fill="#15803d" font-weight="600">Probe success</text>

  <!-- ── Arrow: HALF-OPEN → OPEN (probe failure) ── -->
  <path d="M 508 296 Q 620 260 675 238" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="617" y="260" text-anchor="middle" font-size="11" fill="#dc2626" font-weight="600">Probe failure</text>

  <!-- Legend -->
  <rect x="20" y="330" width="14" height="14" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="40" y="341" font-size="11" fill="#374151">Closed: sistem sehat</text>
  <rect x="175" y="330" width="14" height="14" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="341" font-size="11" fill="#374151">Open: tolak request</text>
  <rect x="330" y="330" width="14" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="350" y="341" font-size="11" fill="#374151">Half-Open: probe recovery</text>

  <!-- Library badges -->
  <rect x="580" y="325" width="90" height="24" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="625" y="341" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="600">Resilience4j</text>
  <rect x="680" y="325" width="60" height="24" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="710" y="341" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">Hystrix</text>
  <rect x="750" y="325" width="60" height="24" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="780" y="341" text-anchor="middle" font-size="11" fill="#9d174d" font-weight="600">Sentinel</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ca8a04"/>
    </marker>
  </defs>
</svg>
