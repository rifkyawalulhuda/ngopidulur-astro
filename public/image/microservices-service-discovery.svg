<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff" rx="12"/>
  <rect width="900" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Service Discovery — Client-side vs Server-side</text>
  <!-- Left: Client-side -->
  <rect x="30" y="70" width="410" height="270" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="70" width="410" height="30" fill="#7c3aed" rx="10"/>
  <rect x="30" y="88" width="410" height="12" fill="#7c3aed"/>
  <text x="235" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">CLIENT-SIDE DISCOVERY</text>
  <!-- Client -->
  <rect x="50" y="120" width="110" height="50" fill="#ede9fe" rx="8" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="105" y="142" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5b21b6" text-anchor="middle" font-weight="600">Client</text>
  <text x="105" y="157" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6d28d9" text-anchor="middle">(query registry)</text>
  <!-- Registry -->
  <rect x="230" y="120" width="100" height="50" fill="#f5f3ff" rx="8" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="280" y="140" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#5b21b6" text-anchor="middle" font-weight="600">Registry</text>
  <text x="280" y="155" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#7c3aed" text-anchor="middle">(Eureka/Consul)</text>
  <!-- Service instances -->
  <rect x="170" y="240" width="90" height="45" fill="#ddd6fe" rx="8" stroke="#7c3aed" stroke-width="1"/>
  <text x="215" y="260" font-family="Inter,Arial,sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">Service A</text>
  <text x="215" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6d28d9" text-anchor="middle">instance 1</text>
  <rect x="280" y="240" width="90" height="45" fill="#ddd6fe" rx="8" stroke="#7c3aed" stroke-width="1"/>
  <text x="325" y="260" font-family="Inter,Arial,sans-serif" font-size="9" fill="#5b21b6" text-anchor="middle">Service A</text>
  <text x="325" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6d28d9" text-anchor="middle">instance 2</text>
  <!-- arrows -->
  <line x1="160" y1="145" x2="230" y2="145" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="170" x2="260" y2="240" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="290" y1="170" x2="310" y2="240" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="120" y1="170" x2="200" y2="240" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="235" y="320" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Client cari IP instance langsung dari registry,</text>
  <text x="235" y="334" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">lalu load balancing sendiri</text>
  <!-- Right: Server-side -->
  <rect x="460" y="70" width="410" height="270" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="460" y="70" width="410" height="30" fill="#0d9488" rx="10"/>
  <rect x="460" y="88" width="410" height="12" fill="#0d9488"/>
  <text x="665" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">SERVER-SIDE DISCOVERY</text>
  <!-- Client -->
  <rect x="480" y="120" width="110" height="50" fill="#ccfbf1" rx="8" stroke="#0d9488" stroke-width="1.5"/>
  <text x="535" y="142" font-family="Inter,Arial,sans-serif" font-size="11" fill="#115e59" text-anchor="middle" font-weight="600">Client</text>
  <text x="535" y="157" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#0f766e" text-anchor="middle">(kirim request)</text>
  <!-- LB -->
  <rect x="650" y="120" width="100" height="50" fill="#99f6e4" rx="8" stroke="#0d9488" stroke-width="2"/>
  <text x="700" y="140" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#134e4a" text-anchor="middle" font-weight="700">Router/LB</text>
  <text x="700" y="155" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#0f766e" text-anchor="middle">(Gateway/K8s)</text>
  <!-- Services -->
  <rect x="585" y="240" width="90" height="45" fill="#5eead4" rx="8" stroke="#0d9488" stroke-width="1"/>
  <text x="630" y="260" font-family="Inter,Arial,sans-serif" font-size="9" fill="#134e4a" text-anchor="middle">Service B</text>
  <text x="630" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#0f766e" text-anchor="middle">instance 1</text>
  <rect x="695" y="240" width="90" height="45" fill="#5eead4" rx="8" stroke="#0d9488" stroke-width="1"/>
  <text x="740" y="260" font-family="Inter,Arial,sans-serif" font-size="9" fill="#134e4a" text-anchor="middle">Service B</text>
  <text x="740" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#0f766e" text-anchor="middle">instance 2</text>
  <!-- Registry below -->
  <rect x="610" y="300" width="150" height="30" fill="#ccfbf1" rx="6" stroke="#0d9488" stroke-width="1"/>
  <text x="685" y="320" font-family="Inter,Arial,sans-serif" font-size="9" fill="#115e59" text-anchor="middle">Registry (internal)</text>
  <!-- arrows -->
  <line x1="590" y1="145" x2="650" y2="145" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="680" y1="170" x2="640" y2="240" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="170" x2="730" y2="240" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="665" y="350" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Client hanya tahu nama service; router yang resolve &amp; load balance</text>
  <!-- Footer -->
  <text x="450" y="372" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Building Microservices — Service Discovery Patterns</text>
</svg>
