<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="320" fill="#ffffff" rx="12"/>
  <rect width="900" height="320" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Lifecycle Teknologi API</text>
  <!-- 4 stages -->
  <rect x="60" y="110" width="160" height="100" fill="#e0f2fe" rx="10" stroke="#0284c7" stroke-width="2"/>
  <text x="140" y="150" font-family="Inter,Arial,sans-serif" font-size="14" fill="#0c4a6e" text-anchor="middle" font-weight="700">EMERGING</text>
  <text x="140" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#0369a1" text-anchor="middle">Baru muncul, diadopsi</text>
  <text x="140" y="186" font-family="Inter,Arial,sans-serif" font-size="9" fill="#0369a1" text-anchor="middle">early adopters</text>
  <rect x="270" y="110" width="160" height="100" fill="#dcfce7" rx="10" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="150" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">GROWING</text>
  <text x="350" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Pertumbuhan pesat,</text>
  <text x="350" y="186" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">mainstream mulai masuk</text>
  <rect x="480" y="110" width="160" height="100" fill="#fef3c7" rx="10" stroke="#d97706" stroke-width="2"/>
  <text x="560" y="150" font-family="Inter,Arial,sans-serif" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">MATURE</text>
  <text x="560" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">Standar industri,</text>
  <text x="560" y="186" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">adopsi luas &amp; stabil</text>
  <rect x="690" y="110" width="160" height="100" fill="#f1f5f9" rx="10" stroke="#94a3b8" stroke-width="2"/>
  <text x="770" y="150" font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="700">LEGACY</text>
  <text x="770" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Menua, perlu investasi</text>
  <text x="770" y="186" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">atau migrasi</text>
  <!-- Arrows -->
  <line x1="220" y1="160" x2="270" y2="160" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="430" y1="160" x2="480" y2="160" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="640" y1="160" x2="690" y2="160" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Critical point -->
  <rect x="250" y="240" width="400" height="40" fill="#fff7ed" rx="8" stroke="#ea580c" stroke-width="1.5"/>
  <text x="450" y="258" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#c2410c" text-anchor="middle" font-weight="600">Titik kritis: Emerging → Legacy — investasi atau migrasi?</text>
  <text x="450" y="272" font-family="Inter,Arial,sans-serif" font-size="9" fill="#ea580c" text-anchor="middle">Keputusan strategis menentukan umur teknologi di organisasi</text>
  <!-- Footer -->
  <text x="450" y="305" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">APIs for Dummies (Apigee Edition) — Teknologi lifecycle</text>
</svg>
