<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff" rx="12"/>
  <rect width="900" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Orchestration vs Choreography</text>
  <!-- Left: Orchestration -->
  <rect x="30" y="70" width="410" height="270" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="70" width="410" height="30" fill="#dc2626" rx="10"/>
  <rect x="30" y="88" width="410" height="12" fill="#dc2626"/>
  <text x="235" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">ORCHESTRATION</text>
  <text x="235" y="120" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Satu service mengatur semua (centralized)</text>
  <!-- Orchestrator -->
  <rect x="160" y="135" width="150" height="50" fill="#fecaca" rx="8" stroke="#dc2626" stroke-width="2"/>
  <text x="235" y="157" font-family="Inter,Arial,sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">Orchestrator</text>
  <text x="235" y="172" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">(Order Service)</text>
  <!-- Services -->
  <rect x="50" y="240" width="105" height="50" fill="#e0e7ff" rx="8" stroke="#6366f1" stroke-width="1.5"/>
  <text x="102" y="258" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="600">Inventory</text>
  <text x="102" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6366f1" text-anchor="middle">Service</text>
  <rect x="185" y="240" width="105" height="50" fill="#e0e7ff" rx="8" stroke="#6366f1" stroke-width="1.5"/>
  <text x="237" y="258" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="600">Payment</text>
  <text x="237" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6366f1" text-anchor="middle">Service</text>
  <rect x="320" y="240" width="105" height="50" fill="#e0e7ff" rx="8" stroke="#6366f1" stroke-width="1.5"/>
  <text x="372" y="258" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="600">Shipping</text>
  <text x="372" y="274" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6366f1" text-anchor="middle">Service</text>
  <!-- Orchestrator arrows -->
  <line x1="180" y1="185" x2="110" y2="240" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="235" y1="185" x2="237" y2="240" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="185" x2="365" y2="240" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="235" y="315" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Orchestrator memanggil tiap service</text>
  <text x="235" y="330" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">berurutan (sync)</text>
  <!-- Right: Choreography -->
  <rect x="460" y="70" width="410" height="270" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="460" y="70" width="410" height="30" fill="#059669" rx="10"/>
  <rect x="460" y="88" width="410" height="12" fill="#059669"/>
  <text x="665" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">CHOREOGRAPHY</text>
  <text x="665" y="120" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Setiap service bereaksi pada event (decentralized)</text>
  <!-- Broker -->
  <rect x="585" y="130" width="160" height="45" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="1.5"/>
  <text x="665" y="149" font-family="Inter,Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="700">Event Bus</text>
  <text x="665" y="164" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b45309" text-anchor="middle">(Kafka/Topic)</text>
  <!-- Services -->
  <rect x="480" y="230" width="105" height="50" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="532" y="248" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">Inventory</text>
  <text x="532" y="264" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">Service</text>
  <rect x="615" y="230" width="105" height="50" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="667" y="248" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">Payment</text>
  <text x="667" y="264" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">Service</text>
  <rect x="750" y="230" width="105" height="50" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="802" y="248" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">Shipping</text>
  <text x="802" y="264" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">Service</text>
  <!-- Event arrows -->
  <line x1="532" y1="230" x2="620" y2="175" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="667" y1="230" x2="665" y2="175" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="790" y1="230" x2="705" y2="175" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="665" y="315" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Setiap service subscribe event yang relevan</text>
  <text x="665" y="330" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">dan bereaksi sendiri (async)</text>
  <!-- Footer -->
  <text x="450" y="365" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Building Microservices (Sam Newman) — Dua pola koordinasi</text>
</svg>
