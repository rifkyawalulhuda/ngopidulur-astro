<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Waterfall vs Agile: Quantum vs Deterministic</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Jangan either/or fallacy - pilih sesuai konteks proyek</text>
  <!-- Waterfall -->
  <rect x="50" y="85" width="380" height="200" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="240" y="115" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Waterfall</text>
  <text x="240" y="140" font-size="12" text-anchor="middle" fill="#d5e8f5">Deterministic (Einstein)</text>
  <rect x="75" y="160" width="330" height="25" rx="4" fill="#2980b9"/>
  <text x="240" y="177" font-size="10" text-anchor="middle" fill="#ffffff">Analisis -&gt; Desain -&gt; Develop -&gt; Test -&gt; Release</text>
  <text x="240" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#f9e79f">Cocok ketika:</text>
  <text x="240" y="225" font-size="10" text-anchor="middle" fill="#d5e8f5">Integrasi intensif antar komponen</text>
  <text x="240" y="243" font-size="10" text-anchor="middle" fill="#d5e8f5">Kolokasi tim tidak memungkinkan</text>
  <text x="240" y="261" font-size="10" text-anchor="middle" fill="#d5e8f5">Tim tidak fokus satu proyek</text>
  <text x="240" y="279" font-size="10" text-anchor="middle" fill="#d5e8f5">High employee turnover</text>
  <!-- Agile -->
  <rect x="470" y="85" width="380" height="200" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="660" y="115" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">Agile (Scrum)</text>
  <text x="660" y="140" font-size="12" text-anchor="middle" fill="#d5f5e3">Indeterminism (Quantum)</text>
  <rect x="495" y="160" width="330" height="25" rx="4" fill="#27ae60"/>
  <text x="660" y="177" font-size="10" text-anchor="middle" fill="#ffffff">Sprint 2-3 minggu -&gt; Working product</text>
  <text x="660" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#f9e79f">3 Manifesto Utama:</text>
  <text x="660" y="225" font-size="10" text-anchor="middle" fill="#d5f5e3">Working software &gt; comprehensive docs</text>
  <text x="660" y="243" font-size="10" text-anchor="middle" fill="#d5f5e3">Customer collaboration &gt; contract</text>
  <text x="660" y="261" font-size="10" text-anchor="middle" fill="#d5f5e3">Responding to change &gt; following plan</text>
  <text x="660" y="279" font-size="10" text-anchor="middle" fill="#d5f5e3">Product owner + scrum master + tim</text>
  <!-- Hybrid -->
  <rect x="150" y="310" width="600" height="100" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="450" y="338" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Hybrid Strategy (Kasus CEC)</text>
  <rect x="180" y="352" width="250" height="45" rx="6" fill="#8e44ad"/>
  <text x="305" y="372" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Fase 1: Waterfall (2 bulan)</text>
  <text x="305" y="388" font-size="9" text-anchor="middle" fill="#e8daef">Core version, high-priority features</text>
  <rect x="470" y="352" width="250" height="45" rx="6" fill="#8e44ad"/>
  <text x="595" y="372" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Fase 2: Agile (sprints)</text>
  <text x="595" y="388" font-size="9" text-anchor="middle" fill="#e8daef">Medium/low priority features</text>
  <text x="450" y="440" font-size="12" text-anchor="middle" fill="#2c3e50">Law of Entropy: tanpa metodologi, proyek menuju kekacauan</text>
  <text x="450" y="465" font-size="11" text-anchor="middle" fill="#7f8c8d">"God doesn't play dice with the world" (Einstein) | Uncertainty principle (Heisenberg)</text>
</svg>