<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="restGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="grpcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="graphqlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e11d48;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#be185d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mqGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="svcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#5b21b6;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e11d48"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="420" fill="url(#bgLight)" rx="8"/>
  <rect width="900" height="420" fill="none" stroke="#e2e8f0" stroke-width="1" rx="8"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="16" font-weight="700" fill="#1e293b">Pola Komunikasi Microservices</text>
  <text x="450" y="52" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" fill="#64748b">REST · gRPC · GraphQL · Message Queue</text>
  <line x1="60" y1="62" x2="840" y2="62" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ===== CLIENT BOX ===== -->
  <rect x="30" y="160" width="110" height="100" rx="10" fill="url(#clientGrad)" filter="url(#shadow)"/>
  <text x="85" y="200" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="700" fill="white">Client</text>
  <!-- Browser icon placeholder -->
  <rect x="58" y="210" width="54" height="34" rx="4" fill="rgba(255,255,255,0.2)"/>
  <rect x="58" y="210" width="54" height="10" rx="4" fill="rgba(255,255,255,0.35)"/>
  <circle cx="66" cy="215" r="2.5" fill="rgba(255,100,100,0.8)"/>
  <circle cx="74" cy="215" r="2.5" fill="rgba(255,200,50,0.8)"/>
  <circle cx="82" cy="215" r="2.5" fill="rgba(80,200,80,0.8)"/>
  <text x="85" y="252" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.8)">Browser / App</text>

  <!-- ===== PROTOCOL LANES (middle column) ===== -->

  <!-- REST Lane -->
  <rect x="220" y="80" width="130" height="44" rx="8" fill="url(#restGrad)" filter="url(#shadow)"/>
  <text x="285" y="97" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">REST / HTTP</text>
  <text x="285" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.85)">JSON over HTTP/1.1</text>

  <!-- gRPC Lane -->
  <rect x="220" y="155" width="130" height="44" rx="8" fill="url(#grpcGrad)" filter="url(#shadow)"/>
  <text x="285" y="172" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">gRPC</text>
  <text x="285" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.85)">Protobuf / HTTP/2</text>

  <!-- GraphQL Lane -->
  <rect x="220" y="230" width="130" height="44" rx="8" fill="url(#graphqlGrad)" filter="url(#shadow)"/>
  <text x="285" y="247" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">GraphQL</text>
  <text x="285" y="263" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.85)">Query / Mutation / Sub</text>

  <!-- Message Queue Lane -->
  <rect x="220" y="305" width="130" height="44" rx="8" fill="url(#mqGrad)" filter="url(#shadow)"/>
  <text x="285" y="322" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">Message Queue</text>
  <text x="285" y="338" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.85)">Kafka / RabbitMQ</text>

  <!-- ===== ARROWS from Client to Protocols ===== -->
  <!-- Client to REST -->
  <path d="M 140,185 C 180,185 180,102 220,102" fill="none" stroke="#0ea5e9" stroke-width="1.8"
        stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <!-- Client to gRPC -->
  <path d="M 140,200 L 220,177" fill="none" stroke="#10b981" stroke-width="1.8"
        stroke-dasharray="5,3" marker-end="url(#arrowGreen)"/>
  <!-- Client to GraphQL -->
  <path d="M 140,215 C 180,215 180,252 220,252" fill="none" stroke="#e11d48" stroke-width="1.8"
        stroke-dasharray="5,3" marker-end="url(#arrowRed)"/>
  <!-- Client to MQ (async) -->
  <path d="M 140,230 C 180,230 180,327 220,327" fill="none" stroke="#f59e0b" stroke-width="1.8"
        stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>

  <!-- ===== MICROSERVICES (right column) ===== -->

  <!-- Service A: User Service -->
  <rect x="450" y="75" width="120" height="54" rx="8" fill="url(#svcGrad)" filter="url(#shadow)"/>
  <text x="510" y="96" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">User Service</text>
  <text x="510" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">:8081 / REST</text>
  <!-- Hex accent -->
  <polygon points="525,84 533,89 533,99 525,104 517,99 517,89" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Service B: Order Service -->
  <rect x="450" y="150" width="120" height="54" rx="8" fill="url(#svcGrad)" filter="url(#shadow)"/>
  <text x="510" y="171" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">Order Service</text>
  <text x="510" y="188" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">:8082 / gRPC</text>
  <polygon points="525,159 533,164 533,174 525,179 517,174 517,164" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Service C: Product Service -->
  <rect x="450" y="225" width="120" height="54" rx="8" fill="url(#svcGrad)" filter="url(#shadow)"/>
  <text x="510" y="246" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">Product Service</text>
  <text x="510" y="263" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">:8083 / GraphQL</text>
  <polygon points="525,234 533,239 533,249 525,254 517,249 517,239" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Service D: Notification Service -->
  <rect x="450" y="300" width="120" height="54" rx="8" fill="url(#svcGrad)" filter="url(#shadow)"/>
  <text x="510" y="321" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="700" fill="white">Notif Service</text>
  <text x="510" y="338" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(255,255,255,0.8)">:8084 / Consumer</text>
  <polygon points="525,309 533,314 533,324 525,329 517,324 517,314" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- ===== ARROWS from Protocols to Services ===== -->
  <!-- REST to User Service -->
  <line x1="350" y1="102" x2="450" y2="102" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <!-- gRPC to Order Service -->
  <line x1="350" y1="177" x2="450" y2="177" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <!-- GraphQL to Product Service -->
  <line x1="350" y1="252" x2="450" y2="252" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <!-- MQ to Notif Service -->
  <line x1="350" y1="327" x2="450" y2="327" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowAmber)"/>

  <!-- ===== DOWNSTREAM: Service-to-Service calls ===== -->
  <!-- Order Service calls User Service (internal gRPC) -->
  <rect x="620" y="160" width="110" height="34" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="675" y="175" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#065f46">Inventory Svc</text>
  <text x="675" y="189" text-anchor="middle" font-family="monospace" font-size="9" fill="#059669">:8085 / gRPC</text>
  <line x1="570" y1="177" x2="620" y2="177" stroke="#10b981" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowGreen)"/>

  <!-- Product Service calls downstream -->
  <rect x="620" y="232" width="110" height="34" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="675" y="247" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#881337">Pricing Svc</text>
  <text x="675" y="261" text-anchor="middle" font-family="monospace" font-size="9" fill="#be185d">:8086 / REST</text>
  <line x1="570" y1="252" x2="620" y2="249" stroke="#e11d48" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arrowRed)"/>

  <!-- ===== LEGEND ===== -->
  <rect x="620" y="75" width="250" height="70" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="745" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="11" font-weight="600" fill="#374151">Keterangan</text>
  <!-- Legend items -->
  <line x1="634" y1="106" x2="660" y2="106" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="666" y="110" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#374151">Synchronous (REST/gRPC/GraphQL)</text>
  <line x1="634" y1="124" x2="660" y2="124" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="666" y="128" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#374151">Asynchronous (Message Queue)</text>

  <!-- ===== LABEL: Async note for MQ ===== -->
  <text x="285" y="366" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#92400e">async / event-driven</text>

  <!-- ===== LABEL: Sync note for REST/gRPC/GraphQL ===== -->
  <text x="285" y="75" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#1e40af">synchronous / request-response</text>

  <!-- Footer -->
  <line x1="30" y1="390" x2="870" y2="390" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="408" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
        font-size="10" fill="#94a3b8">Microservices for Java Developers — InfoQ eMag 2020</text>
</svg>
