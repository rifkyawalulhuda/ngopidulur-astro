<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Verdana, sans-serif">
  <rect width="900" height="550" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">11 Format Visualisasi Data</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Diurutkan berdasarkan popularitas (Google News Lab &amp; Adioma)</text>
  <!-- Row 1 -->
  <rect x="40" y="85" width="195" height="130" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="137" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">1. Bar Chart</text>
  <rect x="65" y="130" width="25" height="50" fill="#d5e8f5"/>
  <rect x="100" y="115" width="25" height="65" fill="#d5e8f5"/>
  <rect x="135" y="145" width="25" height="35" fill="#d5e8f5"/>
  <rect x="170" y="125" width="25" height="55" fill="#d5e8f5"/>
  <text x="137" y="200" font-size="9" text-anchor="middle" fill="#d5e8f5">Vertical, Horizontal, Stacked</text>
  <rect x="250" y="85" width="195" height="130" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="347" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">2. Histogram</text>
  <rect x="275" y="130" width="20" height="50" fill="#d5f5e3"/>
  <rect x="300" y="120" width="20" height="60" fill="#d5f5e3"/>
  <rect x="325" y="115" width="20" height="65" fill="#d5f5e3"/>
  <rect x="350" y="125" width="20" height="55" fill="#d5f5e3"/>
  <rect x="375" y="140" width="20" height="40" fill="#d5f5e3"/>
  <rect x="400" y="150" width="20" height="30" fill="#d5f5e3"/>
  <text x="347" y="200" font-size="9" text-anchor="middle" fill="#d5f5e3">Distribusi frekuensi</text>
  <rect x="460" y="85" width="195" height="130" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="557" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">3. Pie Chart</text>
  <circle cx="557" cy="155" r="35" fill="#d5e8f5"/>
  <path d="M 557 155 L 557 120 A 35 35 0 0 1 587 173 Z" fill="#8e44ad"/>
  <text x="557" y="200" font-size="9" text-anchor="middle" fill="#e8daef">Standard, Donut (maks 5 slice)</text>
  <rect x="670" y="85" width="190" height="130" rx="8" fill="#e67e22" opacity="0.9"/>
  <text x="765" y="110" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">4. Scatter Plot</text>
  <circle cx="710" cy="160" r="3" fill="#fdebd0"/>
  <circle cx="730" cy="140" r="3" fill="#fdebd0"/>
  <circle cx="750" cy="150" r="3" fill="#fdebd0"/>
  <circle cx="770" cy="130" r="3" fill="#fdebd0"/>
  <circle cx="790" cy="145" r="3" fill="#fdebd0"/>
  <circle cx="810" cy="135" r="3" fill="#fdebd0"/>
  <text x="765" y="200" font-size="9" text-anchor="middle" fill="#fdebd0">Korelasi 2 variabel</text>
  <!-- Row 2 -->
  <rect x="40" y="230" width="195" height="130" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="137" y="255" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5. Heat Map</text>
  <rect x="70" y="275" width="30" height="30" fill="#c0392b"/>
  <rect x="105" y="275" width="30" height="30" fill="#fadbd8"/>
  <rect x="140" y="275" width="30" height="30" fill="#e74c3c"/>
  <rect x="70" y="310" width="30" height="30" fill="#fadbd8"/>
  <rect x="105" y="310" width="30" height="30" fill="#c0392b"/>
  <rect x="140" y="310" width="30" height="30" fill="#f1948a"/>
  <text x="137" y="355" font-size="9" text-anchor="middle" fill="#fadbd8">Mosaic, Color map</text>
  <rect x="250" y="230" width="195" height="130" rx="8" fill="#1abc9c" opacity="0.9"/>
  <text x="347" y="255" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6. Line Chart</text>
  <polyline points="275,330 300,310 325,320 350,290 375,300 400,275" stroke="#d1f2eb" stroke-width="3" fill="none"/>
  <text x="347" y="355" font-size="9" text-anchor="middle" fill="#d1f2eb">Tren sepanjang waktu</text>
  <rect x="460" y="230" width="195" height="130" rx="8" fill="#f39c12" opacity="0.9"/>
  <text x="557" y="255" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">7. Bubble Chart</text>
  <circle cx="530" cy="310" r="12" fill="#fdebd0" opacity="0.7"/>
  <circle cx="560" cy="295" r="18" fill="#fdebd0" opacity="0.7"/>
  <circle cx="595" cy="315" r="9" fill="#fdebd0" opacity="0.7"/>
  <text x="557" y="355" font-size="9" text-anchor="middle" fill="#fdebd0">Bubble plot, Bubble map</text>
  <rect x="670" y="230" width="190" height="130" rx="8" fill="#34495e" opacity="0.9"/>
  <text x="765" y="255" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">8. Radar Chart</text>
  <polygon points="765,280 785,295 780,318 750,318 745,295" fill="none" stroke="#bdc3c7" stroke-width="2"/>
  <text x="765" y="355" font-size="9" text-anchor="middle" fill="#bdc3c7">Metrik siklus waktu</text>
  <!-- Row 3 -->
  <rect x="40" y="375" width="260" height="80" rx="8" fill="#2980b9" opacity="0.9"/>
  <text x="170" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">9. Waterfall Chart</text>
  <text x="170" y="420" font-size="10" text-anchor="middle" fill="#d5e8f5">Efek kumulatif nilai +/-</text>
  <text x="170" y="440" font-size="9" text-anchor="middle" fill="#a0a0a0">Sequential</text>
  <rect x="320" y="375" width="260" height="80" rx="8" fill="#8e44ad" opacity="0.9"/>
  <text x="450" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">10. Tree Map</text>
  <text x="450" y="420" font-size="10" text-anchor="middle" fill="#e8daef">Nested rectangles proporsional</text>
  <text x="450" y="440" font-size="9" text-anchor="middle" fill="#a0a0a0">Data hierarkis</text>
  <rect x="600" y="375" width="260" height="80" rx="8" fill="#16a085" opacity="0.9"/>
  <text x="730" y="400" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">11. Area Chart</text>
  <text x="730" y="420" font-size="10" text-anchor="middle" fill="#d1f2eb">Standard, Stacked, 100%</text>
  <text x="730" y="440" font-size="9" text-anchor="middle" fill="#a0a0a0">Volume over time</text>
  <text x="450" y="485" font-size="12" text-anchor="middle" fill="#7f8c8d">Stephen Few: pilih chart yang menangkap perhatian, sederhana, mudah dibandingkan</text>
  <text x="450" y="510" font-size="11" text-anchor="middle" fill="#7f8c8d">Highlight tren &amp; perbedaan | Deteksi max &amp; min | Beri cara explore yang jelas</text>
</svg>