<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="spbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#spbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Space-Based Architecture</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">In-Memory Data Grid - Fundamentals Chapter 15</text>
  <!-- Processing Units -->
  <rect x="100" y="120" width="180" height="140" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="190" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Processing Unit 1</text>
  <rect x="120" y="160" width="140" height="80" rx="6" fill="#2980b9"/>
  <text x="190" y="185" font-size="11" text-anchor="middle" fill="#ffffff">Business Logic</text>
  <text x="190" y="205" font-size="10" text-anchor="middle" fill="#d5e8f5">+</text>
  <text x="190" y="220" font-size="10" text-anchor="middle" fill="#d5e8f5">In-Memory Data</text>
  <rect x="320" y="120" width="180" height="140" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="410" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Processing Unit 2</text>
  <rect x="340" y="160" width="140" height="80" rx="6" fill="#27ae60"/>
  <text x="410" y="185" font-size="11" text-anchor="middle" fill="#ffffff">Business Logic</text>
  <text x="410" y="205" font-size="10" text-anchor="middle" fill="#d5f5e3">+</text>
  <text x="410" y="220" font-size="10" text-anchor="middle" fill="#d5f5e3">In-Memory Data</text>
  <rect x="540" y="120" width="180" height="140" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="630" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Processing Unit 3</text>
  <rect x="560" y="160" width="140" height="80" rx="6" fill="#8e44ad"/>
  <text x="630" y="185" font-size="11" text-anchor="middle" fill="#ffffff">Business Logic</text>
  <text x="630" y="205" font-size="10" text-anchor="middle" fill="#e8daef">+</text>
  <text x="630" y="220" font-size="10" text-anchor="middle" fill="#e8daef">In-Memory Data</text>
  <!-- Data Grid -->
  <rect x="200" y="290" width="400" height="60" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Data Grid (Replicated In-Memory)</text>
  <text x="400" y="340" font-size="11" text-anchor="middle" fill="#fadbd8">Hazelcast, Apache Ignite, Redis</text>
  <!-- Connections -->
  <line x1="190" y1="260" x2="190" y2="290" stroke="#f39c12" stroke-width="2"/>
  <line x1="410" y1="260" x2="410" y2="290" stroke="#f39c12" stroke-width="2"/>
  <line x1="630" y1="260" x2="630" y2="290" stroke="#f39c12" stroke-width="2"/>
  <!-- Trade-offs -->
  <rect x="50" y="370" width="700" height="60" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="395" font-size="13" text-anchor="middle" fill="#ffffff">Scalability ★★★★★ | Performance ★★★★★ | Elasticity ★★★★★</text>
  <text x="400" y="415" font-size="11" text-anchor="middle" fill="#bdc3c7">No database bottleneck | Linear scalability | Eventual consistency</text>
</svg>