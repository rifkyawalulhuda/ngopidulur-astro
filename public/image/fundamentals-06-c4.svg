<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="c4bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#c4bg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">C4 Model</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">4 Levels of Architecture Diagrams - Fundamentals Chapter 21</text>
  <!-- Level 1 -->
  <rect x="80" y="120" width="140" height="100" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="150" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Level 1</text>
  <text x="150" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">System Context</text>
  <rect x="100" y="175" width="100" height="30" rx="4" fill="#2980b9"/>
  <text x="150" y="195" font-size="9" text-anchor="middle" fill="#ffffff">User → System → API</text>
  <!-- Level 2 -->
  <rect x="260" y="120" width="140" height="100" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="330" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Level 2</text>
  <text x="330" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Container</text>
  <rect x="280" y="175" width="100" height="30" rx="4" fill="#27ae60"/>
  <text x="330" y="195" font-size="9" text-anchor="middle" fill="#ffffff">Web App → API → DB</text>
  <!-- Level 3 -->
  <rect x="440" y="120" width="140" height="100" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="510" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Level 3</text>
  <text x="510" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Component</text>
  <rect x="460" y="175" width="100" height="30" rx="4" fill="#8e44ad"/>
  <text x="510" y="195" font-size="9" text-anchor="middle" fill="#ffffff">Controller → Service</text>
  <!-- Level 4 -->
  <rect x="620" y="120" width="140" height="100" rx="10" fill="#e74c3c" opacity="0.9"/>
  <text x="690" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Level 4</text>
  <text x="690" y="165" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Code</text>
  <rect x="640" y="175" width="100" height="30" rx="4" fill="#c0392b"/>
  <text x="690" y="195" font-size="9" text-anchor="middle" fill="#ffffff">Class Diagrams</text>
  <!-- Zoom -->
  <text x="400" y="250" font-size="12" text-anchor="middle" fill="#f39c12">Zoom in as needed →</text>
  <!-- Best Practices -->
  <rect x="50" y="280" width="700" height="150" rx="10" fill="#34495e" opacity="0.8"/>
  <text x="400" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Diagramming Best Practices</text>
  <text x="150" y="330" font-size="11" text-anchor="middle" fill="#2ecc71">✓ Know your audience</text>
  <text x="150" y="350" font-size="11" text-anchor="middle" fill="#2ecc71">✓ Tell a story</text>
  <text x="150" y="370" font-size="11" text-anchor="middle" fill="#2ecc71">✓ Use visuals</text>
  <text x="400" y="330" font-size="11" text-anchor="middle" fill="#3498db">✓ Be honest about trade-offs</text>
  <text x="400" y="350" font-size="11" text-anchor="middle" fill="#3498db">✓ Invite feedback</text>
  <text x="400" y="370" font-size="11" text-anchor="middle" fill="#3498db">✓ Keep diagrams updated</text>
  <text x="650" y="330" font-size="11" text-anchor="middle" fill="#e74c3c">✗ Too much detail</text>
  <text x="650" y="350" font-size="11" text-anchor="middle" fill="#e74c3c">✗ Too abstract</text>
  <text x="650" y="370" font-size="11" text-anchor="middle" fill="#e74c3c">✗ Outdated diagrams</text>
</svg>