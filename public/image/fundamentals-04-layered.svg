<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#lbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Layered Architecture</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">N-Tier Pattern - Fundamentals Chapter 10</text>
  <!-- Layers -->
  <rect x="200" y="110" width="400" height="60" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="400" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Presentation Layer</text>
  <text x="400" y="160" font-size="11" text-anchor="middle" fill="#d5e8f5">UI, Controllers, Views</text>
  <rect x="200" y="180" width="400" height="60" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="400" y="210" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Business Layer</text>
  <text x="400" y="230" font-size="11" text-anchor="middle" fill="#d5f5e3">Business Logic, Rules, Validation</text>
  <rect x="200" y="250" width="400" height="60" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="400" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Persistence Layer</text>
  <text x="400" y="300" font-size="11" text-anchor="middle" fill="#e8daef">Data Access, Repositories, ORM</text>
  <rect x="200" y="320" width="400" height="60" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="350" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Database Layer</text>
  <text x="400" y="370" font-size="11" text-anchor="middle" fill="#fadbd8">Tables, Indexes, Stored Procedures</text>
  <!-- Arrows -->
  <line x1="400" y1="170" x2="400" y2="180" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="240" x2="400" y2="250" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="310" x2="400" y2="320" stroke="#f39c12" stroke-width="2"/>
  <!-- Trade-offs -->
  <rect x="50" y="400" width="700" height="40" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="425" font-size="12" text-anchor="middle" fill="#ffffff">Simplicity ★★★★★ | Deployability ★☆☆☆☆ | Testability ★★☆☆☆ | Scalability ★☆☆☆☆</text>
</svg>