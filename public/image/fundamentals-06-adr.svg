    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#adrbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Architecture Decision Records</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Documenting Architecture Decisions - Fundamentals Chapter 19</text>
  <!-- ADR Structure -->
  <rect x="100" y="110" width="600" height="50" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="400" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Status: Proposed | Accepted | Deprecated | Superseded</text>
  <rect x="100" y="170" width="600" height="60" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="400" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Context</text>
  <text x="400" y="215" font-size="11" text-anchor="middle" fill="#d5f5e3">What is the issue? What forces are at play?</text>
  <rect x="100" y="240" width="600" height="60" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="400" y="265" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Decision</text>
