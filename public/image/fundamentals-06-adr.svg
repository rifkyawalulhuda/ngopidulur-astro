  <rect x="100" y="380" width="600" height="50" rx="8" fill="#e67e22" opacity="0.9"/>
  <text x="400" y="405" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Alternatives Considered + Reasons for Rejection</text>
