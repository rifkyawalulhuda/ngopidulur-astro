<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#ffffff" rx="12"/>
  <rect width="900" height="420" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Monolith vs Microservices Architecture</text>
  <!-- Monolith side -->
  <rect x="40" y="80" width="350" height="280" fill="#fef2f2" rx="12" stroke="#dc2626" stroke-width="2"/>
  <text x="215" y="105" font-family="Inter,Arial,sans-serif" font-size="14" fill="#991b1b" text-anchor="middle" font-weight="700">MONOLITH</text>
  <!-- Single app box -->
  <rect x="75" y="125" width="280" height="100" fill="#fecaca" rx="8" stroke="#dc2626" stroke-width="1.5"/>
  <text x="215" y="150" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="600">Single Application</text>
  <rect x="90" y="165" width="75" height="40" fill="#fee2e2" rx="5" stroke="#f87171" stroke-width="1"/>
  <text x="127" y="184" font-family="Inter,Arial,sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">UI Layer</text>
  <text x="127" y="197" font-family="Inter,Arial,sans-serif" font-size="8" fill="#b91c1c" text-anchor="middle">(HTML/JS)</text>
  <rect x="175" y="165" width="80" height="40" fill="#fee2e2" rx="5" stroke="#f87171" stroke-width="1"/>
  <text x="215" y="184" font-family="Inter,Arial,sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Business Logic</text>
  <text x="215" y="197" font-family="Inter,Arial,sans-serif" font-size="8" fill="#b91c1c" text-anchor="middle">(Java/Services)</text>
  <rect x="265" y="165" width="75" height="40" fill="#fee2e2" rx="5" stroke="#f87171" stroke-width="1"/>
  <text x="302" y="184" font-family="Inter,Arial,sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Database</text>
  <text x="302" y="197" font-family="Inter,Arial,sans-serif" font-size="8" fill="#b91c1c" text-anchor="middle">Access</text>
  <!-- Single DB -->
  <rect x="140" y="250" width="150" height="50" fill="#fda4af" rx="6" stroke="#dc2626" stroke-width="1.5"/>
  <text x="215" y="272" font-family="Inter,Arial,sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle" font-weight="600">Satu Database</text>
  <text x="215" y="286" font-family="Inter,Arial,sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">(semua data di sini)</text>
  <line x1="215" y1="225" x2="215" y2="250" stroke="#dc2626" stroke-width="1.5"/>
  <!-- Pain points -->
  <text x="215" y="330" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="middle">✗ Scale satu modul = scale seluruh app</text>
  <text x="215" y="346" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="middle">✗ Deploy satu fitur = deploy semua</text>
  <!-- Microservices side -->
  <rect x="420" y="80" width="440" height="280" fill="#f0fdf4" rx="12" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="105" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">MICROSERVICES</text>
  <!-- Services with own DB -->
  <rect x="445" y="125" width="120" height="95" fill="#bbf7d0" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="505" y="148" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">User Service</text>
  <rect x="465" y="160" width="80" height="22" fill="#dcfce7" rx="4" stroke="#4ade80" stroke-width="1"/>
  <text x="505" y="175" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">API</text>
  <rect x="465" y="185" width="80" height="26" fill="#86efac" rx="4" stroke="#22c55e" stroke-width="1"/>
  <text x="505" y="200" font-family="Inter,Arial,sans-serif" font-size="8" fill="#166534" text-anchor="middle">DB User</text>
  <rect x="590" y="125" width="120" height="95" fill="#bbf7d0" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="650" y="148" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">Order Service</text>
  <rect x="610" y="160" width="80" height="22" fill="#dcfce7" rx="4" stroke="#4ade80" stroke-width="1"/>
  <text x="650" y="175" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">API</text>
  <rect x="610" y="185" width="80" height="26" fill="#86efac" rx="4" stroke="#22c55e" stroke-width="1"/>
  <text x="650" y="200" font-family="Inter,Arial,sans-serif" font-size="8" fill="#166534" text-anchor="middle">DB Order</text>
  <rect x="735" y="125" width="110" height="95" fill="#bbf7d0" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="790" y="148" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">Payment</text>
  <text x="790" y="162" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="600">Service</text>
  <rect x="755" y="160" width="70" height="22" fill="#dcfce7" rx="4" stroke="#4ade80" stroke-width="1"/>
  <text x="790" y="175" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">API</text>
  <rect x="755" y="185" width="70" height="26" fill="#86efac" rx="4" stroke="#22c55e" stroke-width="1"/>
  <text x="790" y="200" font-family="Inter,Arial,sans-serif" font-size="8" fill="#166534" text-anchor="middle">DB Pay</text>
  <!-- Arrows between services -->
  <line x1="565" y1="150" x2="590" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="710" y1="150" x2="735" y2="150" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Benefits -->
  <text x="640" y="255" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">✓ Scale per service (independen)</text>
  <text x="640" y="272" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">✓ Deploy per service</text>
  <text x="640" y="289" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">✓ Fault isolation</text>
  <text x="640" y="306" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">✓ Database per service</text>
  <text x="640" y="323" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">✓ Technology diversity</text>
  <text x="640" y="340" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">✓ Independent teams</text>
  <!-- Footer -->
  <text x="450" y="405" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Building Microservices (Sam Newman) — Perbandingan Arsitektur</text>
</svg>
