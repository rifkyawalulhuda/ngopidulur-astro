<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff" rx="12"/>
  <rect width="900" height="360" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Dengan vs Tanpa API Gateway</text>
  <!-- Left: without -->
  <rect x="30" y="70" width="410" height="250" fill="#fef2f2" rx="10" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="30" y="70" width="410" height="30" fill="#dc2626" rx="10"/>
  <rect x="30" y="88" width="410" height="12" fill="#dc2626"/>
  <text x="235" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">TANPA API GATEWAY</text>
  <!-- Client -->
  <rect x="60" y="130" width="110" height="45" fill="#e2e8f0" rx="8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="152" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="600">Client</text>
  <text x="115" y="166" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">(mobile/web)</text>
  <!-- Services -->
  <rect x="300" y="105" width="120" height="40" fill="#fee2e2" rx="7" stroke="#f87171" stroke-width="1.2"/>
  <text x="360" y="129" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle">Service A</text>
  <rect x="300" y="155" width="120" height="40" fill="#fee2e2" rx="7" stroke="#f87171" stroke-width="1.2"/>
  <text x="360" y="179" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle">Service B</text>
  <rect x="300" y="205" width="120" height="40" fill="#fee2e2" rx="7" stroke="#f87171" stroke-width="1.2"/>
  <text x="360" y="229" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle">Service C</text>
  <!-- Arrows -->
  <line x1="170" y1="140" x2="300" y2="125" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="155" x2="300" y2="175" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="170" y1="170" x2="300" y2="225" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="235" y="280" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle">✗ Client harus tahu banyak URL</text>
  <text x="235" y="297" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#991b1b" text-anchor="middle">✗ Policy tersebar di tiap service</text>
  <!-- Right: with -->
  <rect x="460" y="70" width="410" height="250" fill="#f0fdf4" rx="10" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="460" y="70" width="410" height="30" fill="#16a34a" rx="10"/>
  <rect x="460" y="88" width="410" height="12" fill="#16a34a"/>
  <text x="665" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">DENGAN API GATEWAY</text>
  <!-- Client -->
  <rect x="485" y="130" width="110" height="45" fill="#e2e8f0" rx="8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="540" y="152" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#334155" text-anchor="middle" font-weight="600">Client</text>
  <!-- Gateway -->
  <rect x="640" y="125" width="130" height="55" fill="#4f46e5" rx="10" stroke="#3730a3" stroke-width="2"/>
  <text x="705" y="148" font-family="Inter,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">API Gateway</text>
  <text x="705" y="164" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#c7d2fe" text-anchor="middle">single entry point</text>
  <!-- Services -->
  <rect x="780" y="105" width="80" height="35" fill="#dcfce7" rx="6" stroke="#4ade80" stroke-width="1.2"/>
  <text x="820" y="127" font-family="Inter,Arial,sans-serif" font-size="9" fill="#166534" text-anchor="middle">Service A</text>
  <rect x="780" y="150" width="80" height="35" fill="#dcfce7" rx="6" stroke="#4ade80" stroke-width="1.2"/>
  <text x="820" y="172" font-family="Inter,Arial,sans-serif" font-size="9" fill="#166534" text-anchor="middle">Service B</text>
  <rect x="780" y="195" width="80" height="35" fill="#dcfce7" rx="6" stroke="#4ade80" stroke-width="1.2"/>
  <text x="820" y="217" font-family="Inter,Arial,sans-serif" font-size="9" fill="#166534" text-anchor="middle">Service C</text>
  <!-- Arrows -->
  <line x1="595" y1="152" x2="640" y2="152" stroke="#16a34a" stroke-width="2" marker-end="url(#arrB)"/>
  <line x1="770" y1="142" x2="780" y2="122" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="770" y1="152" x2="780" y2="167" stroke="#16a34a" stroke-width="1.2"/>
  <line x1="770" y1="162" x2="780" y2="212" stroke="#16a34a" stroke-width="1.2"/>
  <text x="665" y="280" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#166534" text-anchor="middle">✓ Satu URL untuk semua service</text>
  <text x="665" y="297" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#166534" text-anchor="middle">✓ Policy terpusat (auth, rate limit)</text>
  <!-- Footer -->
  <text x="450" y="345" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">API Gateway — Microservice Architecture (IBM White Paper)</text>
</svg>
