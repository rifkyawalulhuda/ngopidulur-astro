<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Data Storytelling</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Tiga elemen kunci untuk mengomunikasikan insight</text>
  <!-- 3 circles -->
  <circle cx="250" cy="200" r="85" fill="#3498db" opacity="0.75"/>
  <text x="250" y="195" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Data</text>
  <text x="250" y="220" font-size="11" text-anchor="middle" fill="#d5e8f5">Insight dari analisis</text>
  <circle cx="450" cy="200" r="85" fill="#2ecc71" opacity="0.75"/>
  <text x="450" y="195" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Visualization</text>
  <text x="450" y="220" font-size="11" text-anchor="middle" fill="#d5f5e3">Proses cepat &amp; visual</text>
  <circle cx="650" cy="200" r="85" fill="#9b59b6" opacity="0.75"/>
  <text x="650" y="195" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Narrative</text>
  <text x="650" y="220" font-size="11" text-anchor="middle" fill="#e8daef">Plot &amp; emosi</text>
  <!-- Combinations -->
  <rect x="80" y="310" width="230" height="60" rx="8" fill="#ecf0f1"/>
  <text x="195" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Data + Narrative</text>
  <text x="195" y="355" font-size="10" text-anchor="middle" fill="#7f8c8d">Insight bermakna</text>
  <rect x="335" y="310" width="230" height="60" rx="8" fill="#ecf0f1"/>
  <text x="450" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Data + Visualization</text>
  <text x="450" y="355" font-size="10" text-anchor="middle" fill="#7f8c8d">Pemahaman cepat</text>
  <rect x="590" y="310" width="230" height="60" rx="8" fill="#ecf0f1"/>
  <text x="705" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">Narrative + Viz</text>
  <text x="705" y="355" font-size="10" text-anchor="middle" fill="#7f8c8d">Cerita memotivasi</text>
  <!-- Formula -->
  <rect x="150" y="390" width="600" height="60" rx="8" fill="#e67e22" opacity="0.9"/>
  <text x="450" y="417" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Data + Visualization + Narrative = CHANGE</text>
  <text x="450" y="437" font-size="11" text-anchor="middle" fill="#fdebd0">Engage → Explain → Enlighten → Change</text>
  <text x="450" y="475" font-size="12" text-anchor="middle" fill="#7f8c8d">9 langkah: Find story, Define perspective, Create hierarchy, Organize, Plot, Anchor, Design, Review, Know content</text>
</svg>