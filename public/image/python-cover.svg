<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="pyblue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776ab"/>
      <stop offset="100%" stop-color="#4da6ff"/>
    </linearGradient>
    <linearGradient id="pyyellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b"/>
      <stop offset="100%" stop-color="#ffe873"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.05">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#4da6ff" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#4da6ff" stroke-width="0.5"/>
  </g>

  <!-- Python logo shape (left side) -->
  <!-- Blue snake top -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="200" height="220" rx="20" fill="#1c2a3a" stroke="#3776ab" stroke-width="1.5" opacity="0.8"/>
    <!-- Blue body -->
    <rect x="30" y="25" width="90" height="90" rx="45" fill="url(#pyblue)" opacity="0.9"/>
    <rect x="80" y="25" width="90" height="90" rx="10" fill="url(#pyblue)" opacity="0.6"/>
    <!-- Yellow body -->
    <rect x="80" y="105" width="90" height="90" rx="45" fill="url(#pyyellow)" opacity="0.9"/>
    <rect x="30" y="105" width="90" height="90" rx="10" fill="url(#pyyellow)" opacity="0.6"/>
    <!-- Eyes -->
    <circle cx="65" cy="60" r="8" fill="white" opacity="0.9"/>
    <circle cx="135" cy="150" r="8" fill="#1c2a3a" opacity="0.9"/>
    <!-- Label -->
    <text x="100" y="200" font-family="monospace" font-size="11" fill="#3776ab" text-anchor="middle" letter-spacing="3">PYTHON</text>
  </g>

  <!-- Code snippet left -->
  <g transform="translate(60, 330)">
    <rect x="0" y="0" width="240" height="160" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="240" height="28" rx="8" fill="#21262d"/>
    <circle cx="18" cy="14" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="14" r="5" fill="#febc2e"/>
    <circle cx="50" cy="14" r="5" fill="#28c840"/>
    <text x="120" y="18" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">python_basics.py</text>
    <!-- Code lines -->
    <text x="12" y="50" font-family="monospace" font-size="10" fill="#ff7b72">def</text>
    <text x="38" y="50" font-family="monospace" font-size="10" fill="#d2a8ff"> greet</text>
    <text x="90" y="50" font-family="monospace" font-size="10" fill="#e6edf3">(name):</text>
    <text x="12" y="68" font-family="monospace" font-size="10" fill="#79c0ff">    return</text>
    <text x="72" y="68" font-family="monospace" font-size="10" fill="#a5d6ff"> f</text>
    <text x="84" y="68" font-family="monospace" font-size="10" fill="#a5d6ff">"Hello, {name}"</text>
    <text x="12" y="88" font-family="monospace" font-size="10" fill="#8b949e"># List comprehension</text>
    <text x="12" y="106" font-family="monospace" font-size="10" fill="#e6edf3">nums = [</text>
    <text x="68" y="106" font-family="monospace" font-size="10" fill="#79c0ff">x</text>
    <text x="78" y="106" font-family="monospace" font-size="10" fill="#ff7b72">**</text>
    <text x="90" y="106" font-family="monospace" font-size="10" fill="#a5d6ff">2</text>
    <text x="98" y="106" font-family="monospace" font-size="10" fill="#ff7b72"> for </text>
    <text x="126" y="106" font-family="monospace" font-size="10" fill="#79c0ff">x</text>
    <text x="134" y="106" font-family="monospace" font-size="10" fill="#ff7b72"> in </text>
    <text x="154" y="106" font-family="monospace" font-size="10" fill="#e6edf3">range(</text>
    <text x="196" y="106" font-family="monospace" font-size="10" fill="#a5d6ff">5</text>
    <text x="204" y="106" font-family="monospace" font-size="10" fill="#e6edf3">)]</text>
    <text x="12" y="124" font-family="monospace" font-size="10" fill="#8b949e"># Dict comprehension</text>
    <text x="12" y="142" font-family="monospace" font-size="10" fill="#e6edf3">d = {</text>
    <text x="46" y="142" font-family="monospace" font-size="10" fill="#79c0ff">k</text>
    <text x="54" y="142" font-family="monospace" font-size="10" fill="#e6edf3">:</text>
    <text x="62" y="142" font-family="monospace" font-size="10" fill="#79c0ff">v</text>
    <text x="70" y="142" font-family="monospace" font-size="10" fill="#ff7b72"> for </text>
    <text x="98" y="142" font-family="monospace" font-size="10" fill="#79c0ff">k</text>
    <text x="106" y="142" font-family="monospace" font-size="10" fill="#e6edf3">,</text>
    <text x="112" y="142" font-family="monospace" font-size="10" fill="#79c0ff">v</text>
    <text x="120" y="142" font-family="monospace" font-size="10" fill="#ff7b72"> in </text>
    <text x="140" y="142" font-family="monospace" font-size="10" fill="#e6edf3">d.items()}</text>
  </g>

  <!-- Title block -->
  <g transform="translate(340, 120)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#3776ab" letter-spacing="4">BELAJAR</text>
    <text x="0" y="60" font-family="system-ui, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-2">Python</text>
    <rect x="0" y="72" width="100" height="4" rx="2" fill="url(#pyblue)"/>
    <rect x="108" y="72" width="60" height="4" rx="2" fill="url(#pyyellow)"/>
    <text x="0" y="115" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="2">dari nol hingga mahir</text>
  </g>

  <!-- Topic pills -->
  <g transform="translate(340, 310)" font-family="monospace" font-size="11">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#3776ab" opacity="0.2"/>
    <text x="45" y="18" fill="#4da6ff" text-anchor="middle">Keywords</text>
    <rect x="98" y="0" width="80" height="28" rx="14" fill="#3776ab" opacity="0.2"/>
    <text x="138" y="18" fill="#4da6ff" text-anchor="middle">Variables</text>
    <rect x="186" y="0" width="100" height="28" rx="14" fill="#ffd43b" opacity="0.15"/>
    <text x="236" y="18" fill="#ffd43b" text-anchor="middle">Data Types</text>
    <rect x="294" y="0" width="70" height="28" rx="14" fill="#ffd43b" opacity="0.15"/>
    <text x="329" y="18" fill="#ffd43b" text-anchor="middle">Strings</text>
    <rect x="372" y="0" width="60" height="28" rx="14" fill="#3776ab" opacity="0.2"/>
    <text x="402" y="18" fill="#4da6ff" text-anchor="middle">List</text>
    <rect x="0" y="36" width="66" height="28" rx="14" fill="#ffd43b" opacity="0.15"/>
    <text x="33" y="54" fill="#ffd43b" text-anchor="middle">Tuple</text>
    <rect x="74" y="36" width="50" height="28" rx="14" fill="#3776ab" opacity="0.2"/>
    <text x="99" y="54" fill="#4da6ff" text-anchor="middle">Set</text>
    <rect x="132" y="36" width="80" height="28" rx="14" fill="#ffd43b" opacity="0.15"/>
    <text x="172" y="54" fill="#ffd43b" text-anchor="middle">Dictionary</text>
    <rect x="220" y="36" width="100" height="28" rx="14" fill="#3776ab" opacity="0.2"/>
    <text x="270" y="54" fill="#4da6ff" text-anchor="middle">Functions</text>
    <rect x="328" y="36" width="56" height="28" rx="14" fill="#ffd43b" opacity="0.15"/>
    <text x="356" y="54" fill="#ffd43b" text-anchor="middle">OOP</text>
  </g>

  <!-- Lambda snippet -->
  <g transform="translate(340, 430)">
    <rect x="0" y="0" width="500" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="500" height="26" rx="8" fill="#21262d"/>
    <circle cx="16" cy="13" r="4" fill="#ff5f57"/>
    <circle cx="30" cy="13" r="4" fill="#febc2e"/>
    <circle cx="44" cy="13" r="4" fill="#28c840"/>
    <text x="250" y="17" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">oop_example.py</text>
    <text x="14" y="46" font-family="monospace" font-size="10" fill="#ff7b72">class</text>
    <text x="52" y="46" font-family="monospace" font-size="10" fill="#d2a8ff"> Animal</text>
    <text x="104" y="46" font-family="monospace" font-size="10" fill="#e6edf3">:</text>
    <text x="14" y="64" font-family="monospace" font-size="10" fill="#ff7b72">    def</text>
    <text x="52" y="64" font-family="monospace" font-size="10" fill="#d2a8ff"> __init__</text>
    <text x="112" y="64" font-family="monospace" font-size="10" fill="#e6edf3">(self, name): self.name = name</text>
    <text x="14" y="82" font-family="monospace" font-size="10" fill="#ff7b72">class</text>
    <text x="52" y="82" font-family="monospace" font-size="10" fill="#d2a8ff"> Dog</text>
    <text x="80" y="82" font-family="monospace" font-size="10" fill="#e6edf3">(</text>
    <text x="86" y="82" font-family="monospace" font-size="10" fill="#d2a8ff">Animal</text>
    <text x="128" y="82" font-family="monospace" font-size="10" fill="#e6edf3">):  </text>
    <text x="158" y="82" font-family="monospace" font-size="10" fill="#8b949e"># Inheritance</text>
    <text x="14" y="100" font-family="monospace" font-size="10" fill="#e6edf3">    dog = Dog(</text>
    <text x="100" y="100" font-family="monospace" font-size="10" fill="#a5d6ff">"Rex"</text>
    <text x="136" y="100" font-family="monospace" font-size="10" fill="#e6edf3">);  dog.speak()  </text>
    <text x="244" y="100" font-family="monospace" font-size="10" fill="#8b949e"># Woof!</text>
  </g>

  <!-- Branding -->
  <text x="30" y="612" font-family="system-ui, sans-serif" font-size="12" fill="#484f58">ngopidulur.my.id</text>
  <text x="1170" y="612" font-family="system-ui, sans-serif" font-size="11" fill="#484f58" text-anchor="end">Python Series</text>
</svg>
