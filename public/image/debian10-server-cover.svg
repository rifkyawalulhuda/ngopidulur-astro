<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="debian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d70a53"/>
      <stop offset="100%" stop-color="#ff6b8a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#ff6b8a" stroke-width="0.5"/>
    <line x1="0" y1="560" x2="1200" y2="560" stroke="#ff6b8a" stroke-width="0.5"/>
  </g>

  <!-- Debian swirl logo -->
  <g transform="translate(120, 140)" filter="url(#glow)">
    <path d="M0,100 C0,30 70,0 120,20 C170,40 200,90 190,140 C180,190 120,220 70,200 C20,180 0,170 0,100 Z" fill="none" stroke="url(#debian)" stroke-width="2.5" opacity="0.6"/>
    <path d="M25,140 C45,90 85,70 130,80 C170,90 190,130 175,170" fill="none" stroke="url(#debian)" stroke-width="1.8" opacity="0.4"/>
    <path d="M155,50 C200,80 220,130 200,180" fill="none" stroke="url(#debian)" stroke-width="1.8" opacity="0.3"/>
    <circle cx="95" cy="130" r="5" fill="url(#debian)" opacity="0.7"/>
  </g>

  <!-- Server rack blocks -->
  <g transform="translate(380, 95)">
    <!-- Server 1: DNS -->
    <rect x="0" y="0" width="220" height="52" rx="7" fill="#d70a53" opacity="0.08" stroke="#d70a53" stroke-width="1"/>
    <rect x="10" y="10" width="8" height="8" rx="2" fill="url(#debian)"/>
    <text x="26" y="20" font-family="monospace" font-size="11" fill="#ff6b8a" font-weight="bold">DNS Server</text>
    <text x="26" y="38" font-family="monospace" font-size="9" fill="#8b949e">BIND9 · :53 · caching + authoritative</text>

    <!-- Server 2: Web -->
    <rect x="0" y="64" width="220" height="52" rx="7" fill="#00bcd4" opacity="0.08" stroke="#00bcd4" stroke-width="1"/>
    <rect x="10" y="74" width="8" height="8" rx="2" fill="url(#cyan)"/>
    <text x="26" y="84" font-family="monospace" font-size="11" fill="#4dd0e1" font-weight="bold">Web Server</text>
    <text x="26" y="102" font-family="monospace" font-size="9" fill="#8b949e">Nginx/Apache · :80/:443 · LAMP/LEMP</text>

    <!-- Server 3: Mail -->
    <rect x="0" y="128" width="220" height="52" rx="7" fill="#d70a53" opacity="0.08" stroke="#d70a53" stroke-width="1"/>
    <rect x="10" y="138" width="8" height="8" rx="2" fill="url(#debian)"/>
    <text x="26" y="148" font-family="monospace" font-size="11" fill="#ff6b8a" font-weight="bold">Mail Server</text>
    <text x="26" y="166" font-family="monospace" font-size="9" fill="#8b949e">Postfix/Dovecot · :25/:587 · Roundcube</text>

    <!-- Server 4: Storage -->
    <rect x="0" y="192" width="220" height="52" rx="7" fill="#00bcd4" opacity="0.08" stroke="#00bcd4" stroke-width="1"/>
    <rect x="10" y="202" width="8" height="8" rx="2" fill="url(#cyan)"/>
    <text x="26" y="212" font-family="monospace" font-size="11" fill="#4dd0e1" font-weight="bold">File Sharing</text>
    <text x="26" y="230" font-family="monospace" font-size="9" fill="#8b949e">Samba · NFS · FTP :21 · Netdata :19999</text>
  </g>

  <!-- Terminal window -->
  <g transform="translate(380, 360)">
    <rect x="0" y="0" width="350" height="100" rx="8" fill="#0a0e14" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="350" height="22" rx="8" fill="#161b22"/>
    <rect x="0" y="13" width="350" height="9" fill="#161b22"/>
    <circle cx="14" cy="11" r="5" fill="#d70a53"/>
    <circle cx="28" cy="11" r="5" fill="#f59e0b"/>
    <circle cx="42" cy="11" r="5" fill="#00bcd4"/>
    <text x="175" y="15" font-family="monospace" font-size="8" fill="#8b949e" text-anchor="middle">root@debian:~</text>
    <text x="14" y="42" font-family="monospace" font-size="11" fill="#00bcd4">$</text>
    <text x="26" y="42" font-family="monospace" font-size="11" fill="#c9d1d9">apt install nginx bind9 postfix</text>
    <text x="14" y="62" font-family="monospace" font-size="11" fill="#c9d1d9">Reading package lists... Done</text>
    <text x="14" y="82" font-family="monospace" font-size="11" fill="#2ea44f">Setting up nginx (1.14.2-2+deb10u4) ...</text>
    <text x="14" y="96" font-family="monospace" font-size="11" fill="#8b949e">▮</text>
  </g>

  <!-- Title -->
  <g transform="translate(740, 200)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Debian 10</text>
    <text x="0" y="50" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="url(#debian)" letter-spacing="3" filter="url(#glow)">SERVER ADMIN</text>
    <rect x="0" y="66" width="100" height="3" rx="1.5" fill="url(#debian)" filter="url(#glow)"/>
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" letter-spacing="2">DNS · WEB · MAIL · SHARING · MONITORING</text>
  </g>

  <!-- ngopidulur branding -->
  <text x="30" y="610" font-family="system-ui, sans-serif" font-size="12" fill="#334155">ngopidulur.my.id</text>
  <text x="1170" y="610" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="end">Debian Buster Series</text>
</svg>
