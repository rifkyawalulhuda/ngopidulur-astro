<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a14"/>
      <stop offset="100%" style="stop-color:#0e1525"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff"/>
      <stop offset="100%" style="stop-color:#0072ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b09b"/>
      <stop offset="100%" style="stop-color:#96c93d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyan)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#cyan)"/>

  <!-- Left: Brain/Neural Network visualization -->
  <g transform="translate(60, 80)">
    <!-- Brain outline circle -->
    <circle cx="210" cy="240" r="190" fill="none" stroke="#0072ff" stroke-width="1" opacity="0.2"/>
    <circle cx="210" cy="240" r="160" fill="none" stroke="#00c6ff" stroke-width="0.5" opacity="0.15"/>

    <!-- Neural network nodes -->
    <!-- Input layer -->
    <circle cx="60" cy="140" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>
    <circle cx="60" cy="200" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>
    <circle cx="60" cy="260" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>
    <circle cx="60" cy="320" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>

    <!-- Hidden layer 1 -->
    <circle cx="160" cy="120" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="160" cy="180" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="160" cy="240" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="160" cy="300" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="160" cy="360" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>

    <!-- Hidden layer 2 -->
    <circle cx="260" cy="140" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="260" cy="200" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="260" cy="260" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="260" cy="320" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>
    <circle cx="260" cy="380" r="12" fill="#0a1a2e" stroke="#0072ff" stroke-width="2"/>

    <!-- Output layer -->
    <circle cx="360" cy="160" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>
    <circle cx="360" cy="240" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>
    <circle cx="360" cy="320" r="12" fill="#0a1a2e" stroke="#00c6ff" stroke-width="2"/>

    <!-- Connections (subset for clarity) -->
    <g stroke="#0072ff" stroke-width="0.4" opacity="0.25">
      <line x1="72" y1="140" x2="148" y2="120"/>
      <line x1="72" y1="140" x2="148" y2="180"/>
      <line x1="72" y1="140" x2="148" y2="240"/>
      <line x1="72" y1="200" x2="148" y2="120"/>
      <line x1="72" y1="200" x2="148" y2="180"/>
      <line x1="72" y1="200" x2="148" y2="300"/>
      <line x1="72" y1="260" x2="148" y2="180"/>
      <line x1="72" y1="260" x2="148" y2="240"/>
      <line x1="72" y1="260" x2="148" y2="300"/>
      <line x1="72" y1="320" x2="148" y2="240"/>
      <line x1="72" y1="320" x2="148" y2="300"/>
      <line x1="72" y1="320" x2="148" y2="360"/>
      <line x1="172" y1="120" x2="248" y2="140"/>
      <line x1="172" y1="120" x2="248" y2="200"/>
      <line x1="172" y1="180" x2="248" y2="140"/>
      <line x1="172" y1="180" x2="248" y2="200"/>
      <line x1="172" y1="180" x2="248" y2="260"/>
      <line x1="172" y1="240" x2="248" y2="200"/>
      <line x1="172" y1="240" x2="248" y2="260"/>
      <line x1="172" y1="240" x2="248" y2="320"/>
      <line x1="172" y1="300" x2="248" y2="260"/>
      <line x1="172" y1="300" x2="248" y2="320"/>
      <line x1="172" y1="300" x2="248" y2="380"/>
      <line x1="172" y1="360" x2="248" y2="320"/>
      <line x1="172" y1="360" x2="248" y2="380"/>
      <line x1="272" y1="140" x2="348" y2="160"/>
      <line x1="272" y1="140" x2="348" y2="240"/>
      <line x1="272" y1="200" x2="348" y2="160"/>
      <line x1="272" y1="200" x2="348" y2="240"/>
      <line x1="272" y1="260" x2="348" y2="240"/>
      <line x1="272" y1="260" x2="348" y2="320"/>
      <line x1="272" y1="320" x2="348" y2="240"/>
      <line x1="272" y1="320" x2="348" y2="320"/>
      <line x1="272" y1="380" x2="348" y2="320"/>
    </g>

    <!-- Active path highlight -->
    <g stroke="#00c6ff" stroke-width="2" opacity="0.9">
      <line x1="72" y1="260" x2="148" y2="240"/>
      <line x1="172" y1="240" x2="248" y2="260"/>
      <line x1="272" y1="260" x2="348" y2="240"/>
    </g>
    <circle cx="60" cy="260" r="12" fill="#00c6ff" opacity="0.5"/>
    <circle cx="160" cy="240" r="12" fill="#0072ff" opacity="0.5"/>
    <circle cx="260" cy="260" r="12" fill="#0072ff" opacity="0.5"/>
    <circle cx="360" cy="240" r="12" fill="#00c6ff" opacity="0.5"/>

    <!-- Labels -->
    <text x="60" y="480" font-family="monospace" font-size="10" fill="#6e7681" text-anchor="middle">Input</text>
    <text x="160" y="480" font-family="monospace" font-size="10" fill="#6e7681" text-anchor="middle">Hidden 1</text>
    <text x="260" y="480" font-family="monospace" font-size="10" fill="#6e7681" text-anchor="middle">Hidden 2</text>
    <text x="360" y="480" font-family="monospace" font-size="10" fill="#6e7681" text-anchor="middle">Output</text>
  </g>

  <!-- Right: Title -->
  <text x="530" y="130" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681" letter-spacing="5">TUTORIALSPOINT — AI TUTORIAL</text>
  <text x="530" y="192" font-family="'Segoe UI', sans-serif" font-size="48" fill="#f0f6fc" font-weight="800" letter-spacing="-2">Artificial</text>
  <text x="530" y="248" font-family="'Segoe UI', sans-serif" font-size="48" fill="url(#cyan)" font-weight="800" letter-spacing="-2">Intelligence</text>
  <text x="530" y="296" font-family="'Segoe UI', sans-serif" font-size="28" fill="url(#green)" font-weight="600">Panduan Lengkap</text>
  <rect x="530" y="310" width="240" height="4" rx="2" fill="url(#cyan)"/>

  <text x="530" y="348" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">Bahasa Indonesia — Seri 3 Artikel</text>
  <text x="530" y="368" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">Dari Pengantar hingga Masa Depan AI</text>

  <!-- Topic pills -->
  <g transform="translate(530, 390)">
    <rect x="0" y="0" width="80" height="26" rx="13" fill="#061a1a"/>
    <text x="40" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00c6ff" text-anchor="middle">Agen AI</text>
    <rect x="92" y="0" width="80" height="26" rx="13" fill="#061a1a"/>
    <text x="132" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00c6ff" text-anchor="middle">Search AI</text>
    <rect x="184" y="0" width="90" height="26" rx="13" fill="#0a1a06"/>
    <text x="229" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#96c93d" text-anchor="middle">Fuzzy Logic</text>
    <rect x="0" y="36" width="55" height="26" rx="13" fill="#061a1a"/>
    <text x="27" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00c6ff" text-anchor="middle">NLP</text>
    <rect x="67" y="36" width="110" height="26" rx="13" fill="#061a1a"/>
    <text x="122" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00c6ff" text-anchor="middle">Expert Systems</text>
    <rect x="189" y="36" width="80" height="26" rx="13" fill="#0a1a06"/>
    <text x="229" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#96c93d" text-anchor="middle">Robotics</text>
  </g>

  <!-- Series list -->
  <g transform="translate(530, 476)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.1  Pengantar AI, Kecerdasan, Tipe Agen, Lingkungan</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.2  Search, Fuzzy Logic, NLP, Expert Systems</text>
    <text x="0" y="36" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.3  Neural Networks, Vision, Robotics, Masa Depan AI</text>
  </g>

  <text x="530" y="600" font-family="'Segoe UI', sans-serif" font-size="12" fill="#30363d">ngopidulur.my.id</text>

  <!-- Glow effects -->
  <circle cx="1150" cy="100" r="120" fill="#00c6ff" opacity="0.04"/>
  <circle cx="80" cy="560" r="80" fill="#0072ff" opacity="0.04"/>
</svg>
