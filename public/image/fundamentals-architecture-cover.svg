  <text x="180" y="290" font-size="11" text-anchor="middle" fill="#d5e8f5">Components</text>
  <rect x="300" y="170" width="200" height="140" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="400" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Part II</text>
  <text x="400" y="225" font-size="14" text-anchor="middle" fill="#ffffff">Architecture Styles</text>
  <text x="400" y="250" font-size="11" text-anchor="middle" fill="#d5f5e3">Layered, Pipeline,</text>
