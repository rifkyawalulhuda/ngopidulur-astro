  <text x="400" y="130" font-size="16" text-anchor="middle" fill="#a0a0a0">Mark Richards &amp; Neal Ford - O'Reilly 2020</text>
  <!-- 3 Parts -->
  <rect x="80" y="170" width="200" height="140" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="180" y="200" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Part I</text>
  <text x="180" y="225" font-size="14" text-anchor="middle" fill="#ffffff">Foundations</text>
  <text x="180" y="250" font-size="11" text-anchor="middle" fill="#d5e8f5">Thinking, Modularity,</text>
