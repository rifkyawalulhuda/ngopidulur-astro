<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Use Case vs User Story</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Dua teknik mendefinisikan user requirements sesuai metodologi</text>
  <!-- Use Case -->
  <rect x="50" y="85" width="380" height="230" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="240" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Use Case (Waterfall)</text>
  <rect x="75" y="135" width="330" height="40" rx="5" fill="#2980b9"/>
  <text x="240" y="153" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">1. Who are the actors?</text>
  <text x="240" y="168" font-size="9" text-anchor="middle" fill="#d5e8f5">Target actors didefinisikan</text>
  <rect x="75" y="185" width="330" height="40" rx="5" fill="#2980b9"/>
  <text x="240" y="203" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">2. What are the goals?</text>
  <text x="240" y="218" font-size="9" text-anchor="middle" fill="#d5e8f5">Use case diagram (high-level scope)</text>
  <rect x="75" y="235" width="330" height="40" rx="5" fill="#2980b9"/>
  <text x="240" y="253" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">3. How will actors achieve goals?</text>
  <text x="240" y="268" font-size="9" text-anchor="middle" fill="#d5e8f5">Use case documents</text>
  <text x="240" y="298" font-size="10" text-anchor="middle" fill="#d5e8f5">Main | Alternative | Exception scenario</text>
  <!-- User Story -->
  <rect x="470" y="85" width="380" height="230" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="660" y="115" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">User Story (Agile)</text>
  <rect x="495" y="135" width="330" height="50" rx="5" fill="#27ae60"/>
  <text x="660" y="158" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">As a "role",</text>
  <text x="660" y="176" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">I want "goal"</text>
  <rect x="495" y="195" width="330" height="40" rx="5" fill="#27ae60"/>
  <text x="660" y="213" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">+ Acceptance Criteria</text>
  <text x="660" y="228" font-size="9" text-anchor="middle" fill="#d5f5e3">Nonfunctional req &amp; business rules</text>
  <text x="660" y="258" font-size="10" text-anchor="middle" fill="#d5f5e3">Contoh: "As a user, I can</text>
  <text x="660" y="274" font-size="10" text-anchor="middle" fill="#d5f5e3">rate CEC products"</text>
  <text x="660" y="298" font-size="10" text-anchor="middle" fill="#d5f5e3">Product backlog + product owner</text>
  <!-- Analogy -->
  <rect x="150" y="335" width="600" height="115" rx="10" fill="#ecf0f1"/>
  <text x="450" y="360" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Analogi Botol: Use Case vs Functional Requirement</text>
  <rect x="180" y="375" width="250" height="60" rx="6" fill="#9b59b6"/>
  <text x="305" y="398" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Use Case = "Minum air"</text>
  <text x="305" y="418" font-size="10" text-anchor="middle" fill="#e8daef">Tujuan (goal) dari actor</text>
  <rect x="470" y="375" width="250" height="60" rx="6" fill="#e67e22"/>
  <text x="595" y="398" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Func Req = "Buka tutup"</text>
  <text x="595" y="418" font-size="10" text-anchor="middle" fill="#fdebd0">Aktivitas mencapai tujuan</text>
  <text x="450" y="475" font-size="11" text-anchor="middle" fill="#7f8c8d">Orang tidak membeli botol untuk membuka-menutup tutupnya</text>
</svg>