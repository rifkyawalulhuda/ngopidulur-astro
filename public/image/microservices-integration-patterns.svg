<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284c7"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff" rx="12"/>
  <rect width="900" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Pola Integrasi Microservices</text>
  <!-- Left: Request/Response -->
  <rect x="40" y="70" width="380" height="270" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="70" width="380" height="30" fill="#0284c7" rx="10"/>
  <rect x="40" y="88" width="380" height="12" fill="#0284c7"/>
  <text x="230" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">REQUEST / RESPONSE</text>
  <!-- Client -->
  <rect x="60" y="130" width="120" height="55" fill="#e0f2fe" rx="8" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="153" font-family="Inter,Arial,sans-serif" font-size="11" fill="#0c4a6e" text-anchor="middle" font-weight="600">Client</text>
  <text x="120" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#0369a1" text-anchor="middle">(Browser/App)</text>
  <!-- Service -->
  <rect x="270" y="130" width="130" height="55" fill="#dbeafe" rx="8" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="153" font-family="Inter,Arial,sans-serif" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="600">Service</text>
  <text x="335" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#1d4ed8" text-anchor="middle">(REST/gRPC)</text>
  <!-- Request arrow -->
  <line x1="180" y1="142" x2="270" y2="142" stroke="#0284c7" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="225" y="136" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#0369a1" text-anchor="middle">request</text>
  <!-- Response arrow -->
  <line x1="270" y1="172" x2="180" y2="172" stroke="#0369a1" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="225" y="188" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#0369a1" text-anchor="middle">response</text>
  <text x="230" y="235" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Synchronous · blocking</text>
  <text x="230" y="252" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Client menunggu jawaban</text>
  <text x="230" y="269" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Contoh: REST, gRPC</text>
  <!-- Right: Event-driven -->
  <rect x="450" y="70" width="410" height="270" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="450" y="70" width="410" height="30" fill="#059669" rx="10"/>
  <rect x="450" y="88" width="410" height="12" fill="#059669"/>
  <text x="655" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">EVENT-DRIVEN (ASYNC)</text>
  <!-- Producer -->
  <rect x="470" y="130" width="120" height="55" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="530" y="153" font-family="Inter,Arial,sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="600">Producer</text>
  <text x="530" y="170" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">(Order Service)</text>
  <!-- Broker -->
  <rect x="640" y="125" width="110" height="65" fill="#fef3c7" rx="8" stroke="#d97706" stroke-width="1.5"/>
  <text x="695" y="148" font-family="Inter,Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="600">Message</text>
  <text x="695" y="162" font-family="Inter,Arial,sans-serif" font-size="11" fill="#92400e" text-anchor="middle" font-weight="600">Broker</text>
  <text x="695" y="178" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b45309" text-anchor="middle">Kafka/RabbitMQ</text>
  <!-- Consumer -->
  <rect x="760" y="130" width="85" height="55" fill="#d1fae5" rx="8" stroke="#059669" stroke-width="1.5"/>
  <text x="802" y="153" font-family="Inter,Arial,sans-serif" font-size="11" fill="#064e3b" text-anchor="middle" font-weight="600">Consumer</text>
  <text x="802" y="170" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#047857" text-anchor="middle">(Email/Notif)</text>
  <!-- Arrows -->
  <line x1="590" y1="157" x2="640" y2="157" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="615" y="150" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">event</text>
  <line x1="750" y1="157" x2="760" y2="157" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/>
  <text x="655" y="230" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Asynchronous · decoupled</text>
  <text x="655" y="247" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Producer tidak menunggu</text>
  <text x="655" y="264" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Contoh: Kafka, RabbitMQ, events</text>
  <text x="655" y="281" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Eventual consistency</text>
  <!-- Footer -->
  <text x="450" y="365" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Building Microservices (Sam Newman) — Dua pola integrasi utama</text>
</svg>
