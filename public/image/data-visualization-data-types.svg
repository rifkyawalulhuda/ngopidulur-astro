<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Jenis Data (Data Types)</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Klasifikasi data menentukan format visualisasi</text>
  <!-- Quantitative -->
  <rect x="60" y="90" width="370" height="170" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="245" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Quantitative (Numerical)</text>
  <text x="245" y="145" font-size="12" text-anchor="middle" fill="#d5e8f5">Bisa dihitung atau diukur</text>
  <rect x="80" y="165" width="330" height="35" rx="5" fill="#2980b9"/>
  <text x="245" y="188" font-size="11" text-anchor="middle" fill="#ffffff">Discrete: nilai terbatas (0, 1, 2...) - jumlah anak</text>
  <rect x="80" y="210" width="330" height="35" rx="5" fill="#2980b9"/>
  <text x="245" y="233" font-size="11" text-anchor="middle" fill="#ffffff">Continuous: nilai dalam rentang - tinggi badan</text>
  <!-- Qualitative -->
  <rect x="470" y="90" width="370" height="170" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="655" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Qualitative (Categorical)</text>
  <text x="655" y="145" font-size="12" text-anchor="middle" fill="#d5f5e3">Deskriptif, non-numerik</text>
  <rect x="490" y="165" width="330" height="35" rx="5" fill="#27ae60"/>
  <text x="655" y="188" font-size="11" text-anchor="middle" fill="#ffffff">Ordinal: punya urutan - bulan, abjad</text>
  <rect x="490" y="210" width="330" height="35" rx="5" fill="#27ae60"/>
  <text x="655" y="233" font-size="11" text-anchor="middle" fill="#ffffff">Categorical: tanpa urutan - jenis produk</text>
  <!-- Data type variants -->
  <rect x="60" y="280" width="800" height="100" rx="10" fill="#ecf0f1"/>
  <text x="450" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Istilah Data Types Lainnya</text>
  <rect x="80" y="320" width="180" height="45" rx="6" fill="#9b59b6"/>
  <text x="170" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Categorical</text>
  <text x="170" y="357" font-size="9" text-anchor="middle" fill="#e8daef">Grup/kategori</text>
  <rect x="280" y="320" width="180" height="45" rx="6" fill="#e67e22"/>
  <text x="370" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Continuous</text>
  <text x="370" y="357" font-size="9" text-anchor="middle" fill="#fdebd0">Nilai dalam rentang</text>
  <rect x="480" y="320" width="180" height="45" rx="6" fill="#1abc9c"/>
  <text x="570" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Discrete</text>
  <text x="570" y="357" font-size="9" text-anchor="middle" fill="#d1f2eb">Jumlah terbatas</text>
  <rect x="680" y="320" width="160" height="45" rx="6" fill="#e74c3c"/>
  <text x="760" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Quantitative</text>
  <text x="760" y="357" font-size="9" text-anchor="middle" fill="#fadbd8">Semua numerik</text>
  <!-- Key -->
  <rect x="200" y="405" width="500" height="60" rx="8" fill="#34495e" opacity="0.85"/>
  <text x="450" y="430" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Kenali tipe data sebelum memilih chart</text>
  <text x="450" y="450" font-size="11" text-anchor="middle" fill="#bdc3c7">Data salah jenis = visualisasi menyesatkan</text>
</svg>