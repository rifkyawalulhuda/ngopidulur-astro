<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#ffffff" rx="12" ry="12"/>
  <rect width="900" height="480" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12" ry="12"/>

  <!-- Title -->
  <rect x="0" y="0" width="900" height="44" fill="url(#headerGrad)" rx="12" ry="12"/>
  <rect x="0" y="22" width="900" height="22" fill="url(#headerGrad)"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">HP UFT — Layout Window</text>

  <!-- Toolbar strip -->
  <rect x="10" y="54" width="880" height="32" fill="#e0e7ff" rx="6" ry="6" stroke="#c7d2fe" stroke-width="1"/>
  <text x="20" y="75" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#3730a3" font-weight="600">TOOLBAR — New / Open / Run / Stop / Settings</text>

  <!-- Three panels -->
  <!-- Solution Explorer -->
  <rect x="10" y="96" width="190" height="370" fill="url(#panelGrad)" rx="8" ry="8" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="10" y="96" width="190" height="28" fill="#6366f1" rx="8" ry="8"/>
  <rect x="10" y="112" width="190" height="12" fill="#6366f1"/>
  <text x="105" y="115" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">SOLUTION EXPLORER</text>
  <text x="20" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">📁 MySolution</text>
  <text x="30" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">📁 BasicTest</text>
  <text x="40" y="179" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">📄 Test Flow</text>
  <text x="40" y="196" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8">📄 Additional Actions</text>
  <line x1="20" y1="210" x2="185" y2="210" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b" font-style="italic">Drag activities here</text>
  <text x="20" y="245" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b" font-style="italic">from Toolbox</text>

  <!-- Canvas (Test Flow) -->
  <rect x="210" y="96" width="470" height="370" fill="#fafafa" rx="8" ry="8" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="210" y="96" width="470" height="28" fill="#6366f1" rx="8" ry="8"/>
  <rect x="210" y="112" width="470" height="12" fill="#6366f1"/>
  <text x="445" y="115" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">CANVAS — Test Flow</text>

  <!-- Flow nodes in canvas -->
  <!-- Start -->
  <ellipse cx="445" cy="160" rx="40" ry="18" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
  <text x="445" y="165" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Start</text>
  <line x1="445" y1="178" x2="445" y2="208" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Activity node -->
  <rect x="375" y="208" width="140" height="38" fill="#e0e7ff" rx="6" ry="6" stroke="#6366f1" stroke-width="1.5"/>
  <text x="445" y="224" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="600">HTTP Request</text>
  <text x="445" y="238" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" fill="#6366f1" text-anchor="middle">GET /flights</text>
  <line x1="445" y1="246" x2="445" y2="276" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Checkpoint node -->
  <rect x="375" y="276" width="140" height="38" fill="#fef3c7" rx="6" ry="6" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445" y="292" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="600">Checkpoint</text>
  <text x="445" y="306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">Verify Status 200</text>
  <line x1="445" y1="314" x2="445" y2="344" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- End -->
  <ellipse cx="445" cy="360" rx="40" ry="18" fill="#ef4444" stroke="#dc2626" stroke-width="1.5"/>
  <text x="445" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">End</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Properties Pane -->
  <rect x="690" y="96" width="200" height="370" fill="url(#panelGrad)" rx="8" ry="8" stroke="#c7d2fe" stroke-width="1.5"/>
  <rect x="690" y="96" width="200" height="28" fill="#6366f1" rx="8" ry="8"/>
  <rect x="690" y="112" width="200" height="12" fill="#6366f1"/>
  <text x="790" y="115" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">PROPERTIES PANE</text>
  <text x="700" y="145" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b" font-weight="600">Selected: HTTP Request</text>
  <line x1="700" y1="152" x2="880" y2="152" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#475569">Method</text>
  <text x="820" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#1e40af">GET</text>
  <text x="700" y="187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#475569">URL</text>
  <text x="820" y="187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#1e40af">/flights</text>
  <text x="700" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#475569">Status</text>
  <text x="820" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#16a34a">200 OK</text>
  <text x="700" y="221" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#475569">Content-Type</text>
  <text x="700" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#1e40af">application/json</text>
  <line x1="700" y1="245" x2="880" y2="245" stroke="#e2e8f0" stroke-width="1"/>
  <text x="700" y="263" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b" font-weight="600">Input Parameters</text>
  <text x="700" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#475569">City</text>
  <text x="820" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#1e40af">Denver</text>
  <text x="700" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#475569">Date</text>
  <text x="820" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#1e40af">2024-01-15</text>

  <!-- Labels under panels -->
  <text x="105" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">① Solution Explorer</text>
  <text x="445" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">② Canvas — Test Flow (drag &amp; drop)</text>
  <text x="790" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">③ Properties Pane</text>
</svg>
