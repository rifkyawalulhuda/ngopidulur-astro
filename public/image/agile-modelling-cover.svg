<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2e"/>
      <stop offset="100%" style="stop-color:#1a0f2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#purple)"/>
  <rect x="0" y="625" width="1200" height="5" fill="url(#purple)"/>

  <!-- Left: Agile iteration diagram -->
  <g transform="translate(80, 120)">
    <!-- Outer circle -->
    <circle cx="200" cy="200" r="175" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
    <!-- Inner circle -->
    <circle cx="200" cy="200" r="100" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.3"/>
    <!-- Center -->
    <circle cx="200" cy="200" r="40" fill="#1a0f2e" stroke="#7c3aed" stroke-width="2"/>
    <text x="200" y="197" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a855f7" text-anchor="middle">MODEL</text>
    <text x="200" y="210" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a855f7" text-anchor="middle">STORM</text>

    <!-- Nodes around circle -->
    <!-- Top: Values -->
    <circle cx="200" cy="28" r="28" fill="#0f1a2e" stroke="#06b6d4" stroke-width="2"/>
    <text x="200" y="25" font-family="'Segoe UI', sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">VALUES</text>
    <text x="200" y="37" font-family="'Segoe UI', sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">&amp; PRIN.</text>

    <!-- Right: Practices -->
    <circle cx="372" cy="200" r="28" fill="#0f1a2e" stroke="#22c55e" stroke-width="2"/>
    <text x="372" y="197" font-family="'Segoe UI', sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">CORE</text>
    <text x="372" y="209" font-family="'Segoe UI', sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">PRACT.</text>

    <!-- Bottom: Deploy/Code -->
    <circle cx="200" cy="372" r="28" fill="#0f1a2e" stroke="#f59e0b" stroke-width="2"/>
    <text x="200" y="369" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">PROVE</text>
    <text x="200" y="381" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f59e0b" text-anchor="middle">W/ CODE</text>

    <!-- Left: Communication -->
    <circle cx="28" cy="200" r="28" fill="#0f1a2e" stroke="#f87171" stroke-width="2"/>
    <text x="28" y="197" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f87171" text-anchor="middle">COMM.</text>
    <text x="28" y="209" font-family="'Segoe UI', sans-serif" font-size="10" fill="#f87171" text-anchor="middle">COLLAB</text>

    <!-- Connecting lines -->
    <line x1="200" y1="56" x2="200" y2="160" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <line x1="344" y1="200" x2="300" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="344" x2="200" y2="240" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <line x1="56" y1="200" x2="100" y2="200" stroke="#f87171" stroke-width="1" opacity="0.5"/>

    <!-- Diagonal nodes -->
    <circle cx="324" cy="76" r="22" fill="#0f1a2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="324" y="73" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">XP</text>
    <text x="324" y="84" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">INTEG.</text>

    <circle cx="76" cy="76" r="22" fill="#0f1a2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="76" y="73" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">RUP</text>
    <text x="76" y="84" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">INTEG.</text>

    <circle cx="324" cy="324" r="22" fill="#0f1a2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="324" y="321" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">DOCS</text>
    <text x="324" y="332" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">JBGE</text>

    <circle cx="76" cy="324" r="22" fill="#0f1a2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="76" y="321" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">ADOPT</text>
    <text x="76" y="332" font-family="monospace" font-size="9" fill="#a855f7" text-anchor="middle">STRATEGY</text>
  </g>

  <!-- Right side: Title -->
  <text x="650" y="140" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e" letter-spacing="5">SCOTT AMBLER</text>
  <text x="650" y="205" font-family="'Segoe UI', sans-serif" font-size="54" fill="#f0f6fc" font-weight="800" letter-spacing="-2">Agile</text>
  <text x="650" y="265" font-family="'Segoe UI', sans-serif" font-size="54" fill="url(#purple)" font-weight="800" letter-spacing="-2">Modeling</text>
  <rect x="650" y="278" width="200" height="4" rx="2" fill="url(#purple)"/>

  <text x="650" y="318" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Effective Practices for XP</text>
  <text x="650" y="340" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8b949e">and the Unified Process</text>
  <text x="650" y="362" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Panduan Lengkap Bahasa Indonesia</text>

  <!-- Feature pills -->
  <g transform="translate(650, 390)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#1a0d2e"/>
    <text x="50" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a855f7" text-anchor="middle">5 Core Values</text>

    <rect x="112" y="0" width="110" height="26" rx="13" fill="#0d1a2e"/>
    <text x="167" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#06b6d4" text-anchor="middle">11 Principles</text>

    <rect x="234" y="0" width="120" height="26" rx="13" fill="#0d2a0d"/>
    <text x="294" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#22c55e" text-anchor="middle">Core Practices</text>

    <rect x="0" y="36" width="100" height="26" rx="13" fill="#2a1a00"/>
    <text x="50" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f59e0b" text-anchor="middle">XP + RUP</text>

    <rect x="112" y="36" width="110" height="26" rx="13" fill="#1a0d0d"/>
    <text x="167" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f87171" text-anchor="middle">Model Storming</text>

    <rect x="234" y="36" width="120" height="26" rx="13" fill="#0d0d2a"/>
    <text x="294" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#818cf8" text-anchor="middle">Agile Adoption</text>
  </g>

  <!-- Articles list -->
  <g transform="translate(650, 490)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.1  Values, Core &amp; Supplementary Principles</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.2  Core Practices dan Model Storming</text>
    <text x="0" y="36" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.3  Komunikasi, Budaya Tim, Dokumentasi</text>
    <text x="0" y="54" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.4  AM dan XP (Extreme Programming)</text>
    <text x="0" y="72" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.5  AM dan RUP, Strategi Adopsi</text>
  </g>

  <text x="650" y="606" font-family="'Segoe UI', sans-serif" font-size="12" fill="#30363d">ngopidulur.my.id</text>
</svg>
