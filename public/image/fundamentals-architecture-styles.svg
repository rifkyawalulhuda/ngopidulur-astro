<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">8 Architecture Styles Comparison</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Fundamentals of Software Architecture - Part II</text>
  <!-- Styles Grid -->
  <!-- Row 1 -->
  <rect x="50" y="90" width="190" height="100" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="145" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Layered</text>
  <text x="145" y="135" font-size="10" text-anchor="middle" fill="#ffffff">Simplicity ★★★★★</text>
  <text x="145" y="150" font-size="10" text-anchor="middle" fill="#ffffff">Deployability ★☆☆☆☆</text>
  <text x="145" y="170" font-size="9" text-anchor="middle" fill="#d5e8f5">Small teams, simple domain</text>
  <rect x="250" y="90" width="190" height="100" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="345" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Pipeline</text>
  <text x="345" y="135" font-size="10" text-anchor="middle" fill="#ffffff">Testability ★★★★☆</text>
  <text x="345" y="150" font-size="10" text-anchor="middle" fill="#ffffff">Scalability ★★☆☆☆</text>
  <text x="345" y="170" font-size="9" text-anchor="middle" fill="#d5f5e3">ETL, batch processing</text>
  <rect x="450" y="90" width="190" height="100" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="545" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Microkernel</text>
  <text x="545" y="135" font-size="10" text-anchor="middle" fill="#ffffff">Extensibility ★★★★★</text>
  <text x="545" y="150" font-size="10" text-anchor="middle" fill="#ffffff">Performance ★★★☆☆</text>
  <text x="545" y="170" font-size="9" text-anchor="middle" fill="#e8daef">Plugin ecosystem</text>
  <rect x="650" y="90" width="190" height="100" rx="8" fill="#1abc9c" opacity="0.9"/>
  <text x="745" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Service-Based</text>
  <text x="745" y="135" font-size="10" text-anchor="middle" fill="#ffffff">Deployability ★★★★☆</text>
  <text x="745" y="150" font-size="10" text-anchor="middle" fill="#ffffff">Scalability ★★★☆☆</text>
  <text x="745" y="170" font-size="9" text-anchor="middle" fill="#d1f2eb">Domain-driven, large teams</text>
  <!-- Row 2 -->
  <rect x="50" y="210" width="190" height="100" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="145" y="235" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Event-Driven</text>
  <text x="145" y="255" font-size="10" text-anchor="middle" fill="#ffffff">Scalability ★★★★★</text>
  <text x="145" y="270" font-size="10" text-anchor="middle" fill="#ffffff">Simplicity ★★☆☆☆</text>
  <text x="145" y="290" font-size="9" text-anchor="middle" fill="#fadbd8">High scale, real-time</text>
  <rect x="250" y="210" width="190" height="100" rx="8" fill="#f39c12" opacity="0.9"/>
  <text x="345" y="235" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Space-Based</text>
  <text x="345" y="255" font-size="10" text-anchor="middle" fill="#ffffff">Elasticity ★★★★★</text>
  <text x="345" y="270" font-size="10" text-anchor="middle" fill="#ffffff">Testability ★☆☆☆☆</text>
  <text x="345" y="290" font-size="9" text-anchor="middle" fill="#fdebd0">Extreme scale, variable load</text>
  <rect x="450" y="210" width="190" height="100" rx="8" fill="#e91e63" opacity="0.9"/>
  <text x="545" y="235" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">SOA</text>
  <text x="545" y="255" font-size="10" text-anchor="middle" fill="#ffffff">Reusability ★★★★★</text>
  <text x="545" y="270" font-size="10" text-anchor="middle" fill="#ffffff">Deployability ★★☆☆☆</text>
  <text x="545" y="290" font-size="9" text-anchor="middle" fill="#f8bbd0">Enterprise integration</text>
  <rect x="650" y="210" width="190" height="100" rx="8" fill="#00bcd4" opacity="0.9"/>
  <text x="745" y="235" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Microservices</text>
  <text x="745" y="255" font-size="10" text-anchor="middle" fill="#ffffff">Deployability ★★★★★</text>
  <text x="745" y="270" font-size="10" text-anchor="middle" fill="#ffffff">Simplicity ★☆☆☆☆</text>
  <text x="745" y="290" font-size="9" text-anchor="middle" fill="#b2ebf2">Large teams, complex domain</text>
  <!-- Legend -->
  <rect x="50" y="330" width="790" height="60" rx="8" fill="#ecf0f1"/>
  <text x="450" y="355" font-size="12" text-anchor="middle" fill="#2c3e50">★ = Rating (1-5) | All styles are trade-offs | No "best" architecture</text>
  <text x="450" y="375" font-size="11" text-anchor="middle" fill="#7f8c8d">Start with monolith, migrate to distributed if needed</text>
  <!-- Decision Guide -->
  <text x="450" y="430" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">When to Choose?</text>
  <text x="450" y="455" font-size="11" text-anchor="middle" fill="#7f8c8d">Team size | Domain complexity | Deployment frequency | Scale requirements | Budget</text>
</svg>