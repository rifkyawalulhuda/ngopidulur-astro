<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff" rx="12"/>
  <rect width="900" height="400" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Attribute-Driven Design 3.0 — 7 Langkah</text>
  <!-- 7 steps -->
  <rect x="30" y="70" width="280" height="90" fill="#dbeafe" rx="10" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="170" y="95" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#1e40af" text-anchor="middle" font-weight="700">Step 1: Review Inputs</text>
  <text x="170" y="115" font-family="Inter,Arial,sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">design purpose, drivers,</text>
  <text x="170" y="131" font-family="Inter,Arial,sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">constraints, concerns</text>
  <text x="170" y="150" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#93c5fd" text-anchor="middle">(hanya sekali di awal)</text>
  <rect x="330" y="70" width="280" height="90" fill="#dcfce7" rx="10" stroke="#16a34a" stroke-width="1.8"/>
  <text x="470" y="95" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#166534" text-anchor="middle" font-weight="700">Step 2: Establish Iteration Goal</text>
  <text x="470" y="115" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">pilih drivers untuk iterasi ini</text>
  <text x="470" y="131" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">(QA scenarios, use cases,</text>
  <text x="470" y="147" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">concerns, constraints)</text>
  <rect x="630" y="70" width="240" height="90" fill="#fef3c7" rx="10" stroke="#d97706" stroke-width="1.8"/>
  <text x="750" y="95" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="700">Step 3: Choose Elements</text>
  <text x="750" y="115" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">pilih element sistem</text>
  <text x="750" y="131" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">untuk di-refine</text>
  <rect x="150" y="185" width="280" height="90" fill="#fce7f3" rx="10" stroke="#db2777" stroke-width="1.8"/>
  <text x="290" y="210" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#9d174d" text-anchor="middle" font-weight="700">Step 4: Choose Design Concepts</text>
  <text x="290" y="230" font-family="Inter,Arial,sans-serif" font-size="9" fill="#db2777" text-anchor="middle">reference architectures,</text>
  <text x="290" y="246" font-family="Inter,Arial,sans-serif" font-size="9" fill="#db2777" text-anchor="middle">patterns, tactics, deployment</text>
  <rect x="470" y="185" width="280" height="90" fill="#f3e8ff" rx="10" stroke="#9333ea" stroke-width="1.8"/>
  <text x="610" y="210" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#6b21a8" text-anchor="middle" font-weight="700">Step 5: Instantiate Elements</text>
  <text x="610" y="230" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9333ea" text-anchor="middle">alokasikan responsibilities</text>
  <text x="610" y="246" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9333ea" text-anchor="middle">definisikan interfaces</text>
  <rect x="150" y="300" width="280" height="60" fill="#ecfdf5" rx="10" stroke="#10b981" stroke-width="1.8"/>
  <text x="290" y="325" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#065f46" text-anchor="middle" font-weight="700">Step 6: Sketch Views &amp; Record Decisions</text>
  <text x="290" y="345" font-family="Inter,Arial,sans-serif" font-size="9" fill="#059669" text-anchor="middle">module · component-connector · allocation</text>
  <rect x="470" y="300" width="280" height="60" fill="#fef2f2" rx="10" stroke="#ef4444" stroke-width="1.8"/>
  <text x="610" y="325" font-family="Inter,Arial,sans-serif" font-size="11.5" fill="#991b1b" text-anchor="middle" font-weight="700">Step 7: Analyze &amp; Review</text>
  <text x="610" y="345" font-family="Inter,Arial,sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">evaluasi design purpose · iterate jika perlu</text>
  <!-- Arrows -->
  <line x1="310" y1="115" x2="330" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="115" x2="630" y2="115" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="160" x2="290" y2="185" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="160" x2="610" y2="185" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="290" y1="275" x2="290" y2="300" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="275" x2="610" y2="300" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Footer -->
  <text x="450" y="385" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Designing Software Architectures (Cervantes &amp; Kazman, SEI)</text>
</svg>
