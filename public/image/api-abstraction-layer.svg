<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#ffffff" rx="12"/>
  <rect width="900" height="360" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <!-- Header -->
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">API sebagai Abstraction Layer</text>

  <!-- Implementations on left -->
  <rect x="40" y="80" width="160" height="50" fill="#e0f2fe" rx="8" stroke="#0284c7" stroke-width="1.5"/>
  <text x="120" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#0c4a6e" text-anchor="middle" font-weight="600">Implementasi A</text>
  <text x="120" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">Python / Django</text>

  <rect x="40" y="155" width="160" height="50" fill="#dcfce7" rx="8" stroke="#16a34a" stroke-width="1.5"/>
  <text x="120" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="600">Implementasi B</text>
  <text x="120" y="193" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#16a34a" text-anchor="middle">Java / Spring Boot</text>

  <rect x="40" y="230" width="160" height="50" fill="#fef3c7" rx="8" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="120" y="252" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="600">Implementasi C</text>
  <text x="120" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#b45309" text-anchor="middle">Node.js / Express</text>

  <!-- Arrows to API Interface -->
  <line x1="200" y1="105" x2="310" y2="165" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="200" y1="180" x2="310" y2="180" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="200" y1="255" x2="310" y2="195" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- API Interface box -->
  <rect x="310" y="130" width="280" height="100" fill="#4f46e5" rx="12" stroke="#3730a3" stroke-width="2"/>
  <text x="450" y="162" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">API Interface</text>
  <text x="450" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">Kontrak tetap stabil</text>
  <text x="450" y="198" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">GET /endpoint</text>
  <text x="450" y="214" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#c7d2fe" text-anchor="middle">POST /endpoint</text>

  <!-- Arrow to Consumer -->
  <line x1="590" y1="180" x2="700" y2="180" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Consumer box -->
  <rect x="700" y="130" width="160" height="100" fill="#f1f5f9" rx="10" stroke="#64748b" stroke-width="2"/>
  <text x="780" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Consumer</text>
  <text x="780" y="188" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">(Program / App)</text>
  <text x="780" y="206" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">Tidak perlu tahu</text>
  <text x="780" y="220" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">detail implementasi</text>

  <!-- Note -->
  <rect x="40" y="305" width="820" height="38" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">💡 Implementasi bisa berganti (A → B → C) tanpa Consumer perlu berubah — inilah kekuatan API sebagai abstraction layer.</text>
  <text x="450" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Separation of Concerns · Loose Coupling · Easy Refactoring</text>
</svg>
