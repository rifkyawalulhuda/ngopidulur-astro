<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Perbandingan integrasi tanpa API vs dengan API Hub">
  <title>Integrasi Tanpa API vs Dengan API Hub</title>
  <desc>Kiri: tanpa API, CRM, ERP, HR, dan Finance semua terhubung langsung satu sama lain membentuk koneksi spaghetti. Kanan: dengan API Hub, semua sistem terhubung ke satu hub terpusat.</desc>

  <!-- Background -->
  <rect width="900" height="420" fill="#f8fafc"/>

  <!-- ── Title ── -->
  <text x="450" y="34" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e293b">Integrasi Sistem: Tanpa API vs Dengan API Hub</text>

  <!-- ════════════════════════════════════════
       DIVIDER
  ════════════════════════════════════════ -->
  <line x1="450" y1="52" x2="450" y2="400" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ══════════════════════════════════════════════════
       LEFT PANEL — TANPA API (spaghetti)
  ══════════════════════════════════════════════════ -->

  <!-- Panel background -->
  <rect x="14" y="52" width="422" height="356" rx="12" fill="#fff" stroke="#fca5a5" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="14" y="52" width="422" height="44" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="14" y="80" width="422" height="16" fill="#fef2f2"/><!-- flatten bottom corners of header -->
  <text x="225" y="79" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#dc2626">❌  TANPA API — Point-to-Point</text>

  <!-- System boxes: place 4 systems at corners of a square inside the panel -->
  <!-- CRM top-left ~(60,150), ERP top-right ~(320,150), HR bottom-left ~(60,290), Finance bottom-right ~(320,290) -->

  <!-- CRM -->
  <rect x="52" y="148" width="104" height="50" rx="9" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="104" y="169" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">👥</text>
  <text x="104" y="189" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#991b1b">CRM</text>

  <!-- ERP -->
  <rect x="316" y="148" width="104" height="50" rx="9" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="368" y="169" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">🏭</text>
  <text x="368" y="189" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#991b1b">ERP</text>

  <!-- HR -->
  <rect x="52" y="288" width="104" height="50" rx="9" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="104" y="309" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">🧑‍💼</text>
  <text x="104" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#991b1b">HR</text>

  <!-- Finance -->
  <rect x="316" y="288" width="104" height="50" rx="9" fill="#fff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="368" y="309" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">💰</text>
  <text x="368" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Finance</text>

  <!-- Spaghetti connections — double-headed lines between all 4 pairs -->
  <!-- CRM(104,173) ↔ ERP(368,173): horizontal top -->
  <line x1="156" y1="173" x2="316" y2="173" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- HR(104,313) ↔ Finance(368,313): horizontal bottom -->
  <line x1="156" y1="313" x2="316" y2="313" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- CRM(104,198) ↔ HR(104,288): vertical left -->
  <line x1="104" y1="198" x2="104" y2="288" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ERP(368,198) ↔ Finance(368,288): vertical right -->
  <line x1="368" y1="198" x2="368" y2="288" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- CRM(156,198) ↔ Finance(316,288): diagonal -->
  <line x1="156" y1="198" x2="316" y2="288" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- ERP(316,198) ↔ HR(156,288): diagonal -->
  <line x1="316" y1="198" x2="156" y2="288" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- custom code labels on connections -->
  <rect x="184" y="160" width="104" height="18" rx="4" fill="#fef2f2"/>
  <text x="236" y="173" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#dc2626">custom code</text>

  <rect x="184" y="300" width="104" height="18" rx="4" fill="#fef2f2"/>
  <text x="236" y="313" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" fill="#dc2626">custom code</text>

  <!-- Formula label -->
  <rect x="100" y="352" width="252" height="44" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="226" y="370" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#dc2626">N×(N−1)/2 koneksi</text>
  <text x="226" y="386" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#b91c1c">4 sistem → 6 koneksi custom = mahal &amp; rapuh</text>

  <!-- ══════════════════════════════════════════════════
       RIGHT PANEL — DENGAN API HUB
  ══════════════════════════════════════════════════ -->

  <!-- Panel background -->
  <rect x="464" y="52" width="422" height="356" rx="12" fill="#fff" stroke="#6ee7b7" stroke-width="1.5"/>

  <!-- Panel header -->
  <rect x="464" y="52" width="422" height="44" rx="12" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="464" y="80" width="422" height="16" fill="#f0fdf4"/>
  <text x="675" y="79" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#16a34a">✅  DENGAN API Hub — Terpusat</text>

  <!-- API Hub — center of right panel -->
  <!-- Right panel center x = 675, center of diagram y ~235 -->
  <rect x="622" y="202" width="106" height="66" rx="12" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="675" y="228" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#fff">🔗</text>
  <text x="675" y="247" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">API Hub</text>
  <text x="675" y="261" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#d1fae5">Central Gateway</text>

  <!-- System boxes: same 4 systems at corners -->
  <!-- CRM top-left, ERP top-right, HR bottom-left, Finance bottom-right -->
  <!-- Offset by 464 for right panel: positions relative to panel left=464 -->
  <!-- CRM: 464+52=516, ERP: 464+316=780 -->

  <!-- CRM -->
  <rect x="502" y="128" width="104" height="50" rx="9" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <text x="554" y="149" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">👥</text>
  <text x="554" y="169" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#065f46">CRM</text>

  <!-- ERP -->
  <rect x="744" y="128" width="104" height="50" rx="9" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <text x="796" y="149" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">🏭</text>
  <text x="796" y="169" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#065f46">ERP</text>

  <!-- HR -->
  <rect x="502" y="308" width="104" height="50" rx="9" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <text x="554" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">🧑‍💼</text>
  <text x="554" y="349" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#065f46">HR</text>

  <!-- Finance -->
  <rect x="744" y="308" width="104" height="50" rx="9" fill="#fff" stroke="#10b981" stroke-width="1.5"/>
  <text x="796" y="329" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">💰</text>
  <text x="796" y="349" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#065f46">Finance</text>

  <!-- Arrow marker for green -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Lines from each system to API Hub center (675, 235) -->
  <!-- CRM center: 554,153 → Hub: 622,228 -->
  <line x1="554" y1="178" x2="630" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- ERP center: 796,153 → Hub: 728,210 -->
  <line x1="796" y1="178" x2="720" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- HR center: 554,308 → Hub: 630,268 -->
  <line x1="554" y1="308" x2="630" y2="268" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- Finance center: 796,308 → Hub: 720,268 -->
  <line x1="796" y1="308" x2="720" y2="268" stroke="#10b981" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Formula label -->
  <rect x="550" y="372" width="252" height="28" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1"/>
  <text x="676" y="386" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#16a34a">N koneksi — mudah dikelola &amp; konsisten</text>
  <text x="676" y="398" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#065f46">4 sistem → 4 koneksi ke 1 hub</text>

  <!-- ── Bottom footnote ── -->
  <text x="450" y="415" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#94a3b8">Sumber: APIs For Dummies, Apigee Special Edition (Nijim &amp; Pagano, 2014)</text>
</svg>
