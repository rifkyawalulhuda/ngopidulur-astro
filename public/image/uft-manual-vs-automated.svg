<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff" rx="12"/>
  <rect width="900" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Manual vs Automated Testing</text>
  <!-- Manual -->
  <rect x="30" y="70" width="410" height="270" fill="#fef2f2" rx="10" stroke="#fecaca" stroke-width="1.5"/>
  <rect x="30" y="70" width="410" height="30" fill="#dc2626" rx="10"/>
  <rect x="30" y="88" width="410" height="12" fill="#dc2626"/>
  <text x="235" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">MANUAL TESTING</text>
  <!-- Steps -->
  <rect x="50" y="120" width="120" height="45" fill="#fee2e2" rx="8" stroke="#f87171" stroke-width="1.5"/>
  <text x="110" y="142" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">Tester</text>
  <text x="110" y="156" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">(manusia)</text>
  <rect x="210" y="120" width="130" height="45" fill="#fee2e2" rx="8" stroke="#f87171" stroke-width="1.5"/>
  <text x="275" y="142" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">Jalankan Test</text>
  <text x="275" y="156" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">case manual</text>
  <rect x="360" y="120" width="120" height="45" fill="#fee2e2" rx="8" stroke="#f87171" stroke-width="1.5"/>
  <text x="420" y="142" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#991b1b" text-anchor="middle" font-weight="600">Catat Hasil</text>
  <text x="420" y="156" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b91c1c" text-anchor="middle">(manual)</text>
  <line x1="170" y1="142" x2="210" y2="142" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="340" y1="142" x2="360" y2="142" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Loop back -->
  <path d="M 420 165 L 420 205 L 110 205 L 110 165" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="265" y="197" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">ulangi setiap build</text>
  <!-- Cons -->
  <text x="235" y="240" font-family="Inter,Arial,sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">✗ Waktu lama</text>
  <text x="235" y="257" font-family="Inter,Arial,sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">✗ Error-prone</text>
  <text x="235" y="274" font-family="Inter,Arial,sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">✗ Tidak konsisten</text>
  <text x="235" y="291" font-family="Inter,Arial,sans-serif" font-size="10" fill="#991b1b" text-anchor="middle">✗ Reproducibility rendah</text>
  <text x="235" y="320" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Tidak bisa diulang identik</text>
  <!-- Automated -->
  <rect x="460" y="70" width="410" height="270" fill="#f0fdf4" rx="10" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="460" y="70" width="410" height="30" fill="#16a34a" rx="10"/>
  <rect x="460" y="88" width="410" height="12" fill="#16a34a"/>
  <text x="665" y="91" font-family="Inter,Arial,sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">AUTOMATED TESTING (UFT)</text>
  <!-- Steps -->
  <rect x="480" y="120" width="120" height="45" fill="#dcfce7" rx="8" stroke="#4ade80" stroke-width="1.5"/>
  <text x="540" y="142" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">Script</text>
  <text x="540" y="156" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">(sekali buat)</text>
  <rect x="640" y="120" width="120" height="45" fill="#dcfce7" rx="8" stroke="#4ade80" stroke-width="1.5"/>
  <text x="700" y="142" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">Jalankan</text>
  <text x="700" y="156" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">otomatis</text>
  <rect x="800" y="120" width="60" height="45" fill="#dcfce7" rx="8" stroke="#4ade80" stroke-width="1.5"/>
  <text x="830" y="142" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#166534" text-anchor="middle" font-weight="600">Report</text>
  <text x="830" y="156" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">otomatis</text>
  <line x1="600" y1="142" x2="640" y2="142" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="142" x2="800" y2="142" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Loop -->
  <path d="M 830 165 L 830 205 L 540 205 L 540 165" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="685" y="197" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">ulangi setiap build (otomatis)</text>
  <!-- Pros -->
  <text x="665" y="240" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">✓ Waktu cepat</text>
  <text x="665" y="257" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">✓ Konsisten</text>
  <text x="665" y="274" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">✓ Reproducible</text>
  <text x="665" y="291" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle">✓ 24/7 tanpa manusia</text>
  <text x="665" y="320" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Bisa ribuan test case per build</text>
  <!-- Footer -->
  <text x="450" y="365" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">HP UFT API Testing — Perbandingan pendekatan</text>
</svg>
