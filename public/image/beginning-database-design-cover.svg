<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#172554"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>
  <!-- Wiley badge -->
  <rect x="740" y="28" width="130" height="38" fill="#f59e0b" rx="6"/>
  <text x="805" y="53" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#1c1917" text-anchor="middle">WILEY</text>
  <!-- Title -->
  <text x="450" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">Beginning Database Design</text>
  <text x="450" y="123" font-family="Inter,Arial,sans-serif" font-size="15" fill="#93c5fd" text-anchor="middle">Gavin Powell · Relational Modeling dari Nol</text>
  <!-- Tables diagram -->
  <!-- CUSTOMERS table -->
  <rect x="60" y="160" width="200" height="150" fill="#1d4ed8" rx="10" stroke="#60a5fa" stroke-width="2"/>
  <rect x="60" y="160" width="200" height="30" fill="#2563eb" rx="10"/>
  <rect x="60" y="178" width="200" height="12" fill="#2563eb"/>
  <text x="160" y="181" font-family="monospace,Consolas" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">CUSTOMERS</text>
  <text x="75" y="210" font-family="monospace,Consolas" font-size="9.5" fill="#dbeafe">PK customer_id</text>
  <text x="75" y="228" font-family="monospace,Consolas" font-size="9.5" fill="#bfdbfe">name</text>
  <text x="75" y="246" font-family="monospace,Consolas" font-size="9.5" fill="#bfdbfe">email</text>
  <text x="75" y="264" font-family="monospace,Consolas" font-size="9.5" fill="#bfdbfe">phone</text>
  <text x="75" y="282" font-family="monospace,Consolas" font-size="9.5" fill="#bfdbfe">address</text>
  <!-- ORDERS table -->
  <rect x="350" y="160" width="200" height="150" fill="#0f766e" rx="10" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="350" y="160" width="200" height="30" fill="#0d9488" rx="10"/>
  <rect x="350" y="178" width="200" height="12" fill="#0d9488"/>
  <text x="450" y="181" font-family="monospace,Consolas" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">ORDERS</text>
  <text x="365" y="210" font-family="monospace,Consolas" font-size="9.5" fill="#ccfbf1">PK order_id</text>
  <text x="365" y="228" font-family="monospace,Consolas" font-size="9.5" fill="#99f6e4">FK customer_id</text>
  <text x="365" y="246" font-family="monospace,Consolas" font-size="9.5" fill="#99f6e4">order_date</text>
  <text x="365" y="264" font-family="monospace,Consolas" font-size="9.5" fill="#99f6e4">total</text>
  <text x="365" y="282" font-family="monospace,Consolas" font-size="9.5" fill="#99f6e4">status</text>
  <!-- PRODUCTS table -->
  <rect x="640" y="160" width="200" height="150" fill="#7c3aed" rx="10" stroke="#a78bfa" stroke-width="2"/>
  <rect x="640" y="160" width="200" height="30" fill="#8b5cf6" rx="10"/>
  <rect x="640" y="178" width="200" height="12" fill="#8b5cf6"/>
  <text x="740" y="181" font-family="monospace,Consolas" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">PRODUCTS</text>
  <text x="655" y="210" font-family="monospace,Consolas" font-size="9.5" fill="#ede9fe">PK product_id</text>
  <text x="655" y="228" font-family="monospace,Consolas" font-size="9.5" fill="#ddd6fe">name</text>
  <text x="655" y="246" font-family="monospace,Consolas" font-size="9.5" fill="#ddd6fe">price</text>
  <text x="655" y="264" font-family="monospace,Consolas" font-size="9.5" fill="#ddd6fe">stock</text>
  <!-- Crow's foot connector -->
  <line x1="260" y1="235" x2="350" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="350,235 338,229 338,241" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="270" cy="235" r="4" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <line x1="300" y1="235" x2="310" y2="235" stroke="#fbbf24" stroke-width="2"/>
  <!-- label 1:M -->
  <text x="305" y="225" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle" font-weight="700">1 : M</text>
  <!-- Footer -->
  <rect x="200" y="380" width="500" height="55" fill="rgba(96,165,250,0.12)" stroke="#60a5fa" stroke-width="1.5" rx="10"/>
  <text x="450" y="402" font-family="Inter,Arial,sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Normalization · ERD · Primary/Foreign Keys · SQL</text>
  <text x="450" y="420" font-family="Inter,Arial,sans-serif" font-size="12" fill="#bfdbfe" text-anchor="middle">Data Warehouse · Star Schema · Performance Tuning</text>
  <text x="450" y="465" font-family="Inter,Arial,sans-serif" font-size="10" fill="#475569" text-anchor="middle">ngopidulur.my.id</text>
</svg>
