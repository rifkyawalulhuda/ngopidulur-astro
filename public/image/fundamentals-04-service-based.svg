  <rect x="340" y="200" width="140" height="25" rx="4" fill="#27ae60"/>
  <text x="410" y="217" font-size="10" text-anchor="middle" fill="#ffffff">Business Logic</text>
  <rect x="340" y="230" width="140" height="20" rx="4" fill="#27ae60"/>
  <text x="410" y="244" font-size="9" text-anchor="middle" fill="#ffffff">Customer DB Access</text>
  <rect x="540" y="120" width="180" height="140" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="630" y="150" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Catalog Service</text>
  <rect x="560" y="170" width="140" height="25" rx="4" fill="#8e44ad"/>
  <text x="630" y="187" font-size="10" text-anchor="middle" fill="#ffffff">API Layer</text>
