  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Domain Services + Shared Database - Fundamentals Chapter 13</text>
  <!-- Services -->
  <rect x="100" y="120" width="180" height="140" rx="10" fill="#3498db" opacity="0.9"/>
