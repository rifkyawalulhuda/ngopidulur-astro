  <rect x="250" y="290" width="300" height="60" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="400" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Shared Database</text>
  <text x="400" y="340" font-size="11" text-anchor="middle" fill="#fadbd8">Single Schema | All Services Access</text>
  <!-- Connections -->
  <line x1="190" y1="260" x2="190" y2="290" stroke="#f39c12" stroke-width="2"/>
  <line x1="410" y1="260" x2="410" y2="290" stroke="#f39c12" stroke-width="2"/>
  <line x1="630" y1="260" x2="630" y2="290" stroke="#f39c12" stroke-width="2"/>
