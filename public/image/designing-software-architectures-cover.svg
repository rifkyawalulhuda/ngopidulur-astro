  <text x="200" y="383" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">QA · functionality · concerns</text>
  <text x="200" y="397" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">constraints</text>
  <rect x="340" y="340" width="240" height="70" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-width="1.3" rx="10"/>
  <text x="460" y="365" font-family="Inter,Arial,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="700">Design Concepts</text>
  <text x="460" y="383" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">reference arch · patterns</text>
  <text x="460" y="397" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">tactics · deployment</text>
  <rect x="600" y="340" width="220" height="70" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-width="1.3" rx="10"/>
  <text x="710" y="365" font-family="Inter,Arial,sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle" font-weight="700">3 Case Studies</text>
  <text x="710" y="383" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">FCAPS · Big Data</text>
  <text x="710" y="397" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#94a3b8" text-anchor="middle">Banking (brownfield)</text>
  <text x="450" y="460" font-family="Inter,Arial,sans-serif" font-size="10" fill="#57534e" text-anchor="middle">ngopidulur.my.id</text>
