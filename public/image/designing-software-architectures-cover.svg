<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c0a09"/>
      <stop offset="50%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>
  <!-- SEI badge -->
  <rect x="680" y="28" width="190" height="40" fill="#f59e0b" rx="6"/>
  <text x="775" y="53" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#1c1917" text-anchor="middle">SEI Series</text>
  <!-- Title -->
  <text x="450" y="92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="800" fill="#ffffff" text-anchor="middle">Designing Software Architectures</text>
  <text x="450" y="122" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#fbbf24" text-anchor="middle">A Practical Approach</text>
  <text x="450" y="148" font-family="Inter,Arial,sans-serif" font-size="13" fill="#d6d3d1" text-anchor="middle">Cervantes &amp; Kazman · Attribute-Driven Design 3.0</text>
  <!-- ADD flow -->
  <rect x="80" y="185" width="140" height="70" fill="rgba(56,189,248,0.2)" stroke="#38bdf8" stroke-width="1.8" rx="10"/>
  <text x="150" y="212" font-family="Inter,Arial,sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle" font-weight="700">1. Review Inputs</text>
  <text x="150" y="232" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#bae6fd" text-anchor="middle">drivers, constraints</text>
  <line x1="220" y1="220" x2="255" y2="220" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="260" y="185" width="140" height="70" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="1.8" rx="10"/>
  <text x="330" y="212" font-family="Inter,Arial,sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle" font-weight="700">2-4. Select</text>
  <text x="330" y="232" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#a7f3d0" text-anchor="middle">drivers · concepts</text>
  <line x1="400" y1="220" x2="435" y2="220" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="440" y="185" width="140" height="70" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1.8" rx="10"/>
  <text x="510" y="212" font-family="Inter,Arial,sans-serif" font-size="11" fill="#fdba74" text-anchor="middle" font-weight="700">5. Instantiate</text>
  <text x="510" y="232" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#fed7aa" text-anchor="middle">elements · interfaces</text>
  <line x1="580" y1="220" x2="615" y2="220" stroke="#fbbf24" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="620" y="185" width="200" height="70" fill="rgba(129,140,248,0.2)" stroke="#818cf8" stroke-width="1.8" rx="10"/>
  <text x="720" y="212" font-family="Inter,Arial,sans-serif" font-size="11" fill="#a5b4fc" text-anchor="middle" font-weight="700">6-7. Sketch &amp; Analyze</text>
  <text x="720" y="232" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#c7d2fe" text-anchor="middle">views · decisions · iterate</text>
  <!-- Loop back -->
  <path d="M 720 255 L 720 290 L 150 290 L 150 255" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="435" y="308" font-family="Inter,Arial,sans-serif" font-size="10" fill="#fde68a" text-anchor="middle" font-weight="600">iterate sampai design purpose tercapai</text>
