<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Pipeline Architecture</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Pipes and Filters - Fundamentals Chapter 11</text>
  <!-- Pipeline -->
  <rect x="50" y="150" width="100" height="60" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="100" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Input</text>
  <text x="100" y="200" font-size="10" text-anchor="middle" fill="#d5e8f5">CSV File</text>
  <line x1="150" y1="180" x2="200" y2="180" stroke="#f39c12" stroke-width="3"/>
  <polygon points="200,175 210,180 200,185" fill="#f39c12"/>
  <rect x="210" y="150" width="120" height="60" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="270" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Parser</text>
  <text x="270" y="200" font-size="10" text-anchor="middle" fill="#d5f5e3">Transform</text>
  <line x1="330" y1="180" x2="380" y2="180" stroke="#f39c12" stroke-width="3"/>
  <polygon points="380,175 390,180 380,185" fill="#f39c12"/>
  <rect x="390" y="150" width="120" height="60" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="450" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Validator</text>
  <text x="450" y="200" font-size="10" text-anchor="middle" fill="#e8daef">Test/Filter</text>
  <line x1="510" y1="180" x2="560" y2="180" stroke="#f39c12" stroke-width="3"/>
  <polygon points="560,175 570,180 560,185" fill="#f39c12"/>
  <rect x="570" y="150" width="120" height="60" rx="8" fill="#e67e22" opacity="0.9"/>
  <text x="630" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Enricher</text>
  <text x="630" y="200" font-size="10" text-anchor="middle" fill="#fdebd0">Transform</text>
  <line x1="690" y1="180" x2="740" y2="180" stroke="#f39c12" stroke-width="3"/>
  <polygon points="740,175 750,180 740,185" fill="#f39c12"/>
  <rect x="750" y="150" width="50" height="60" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="775" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">DB</text>
  <!-- Filter Types -->
  <rect x="100" y="250" width="600" height="120" rx="10" fill="#34495e" opacity="0.8"/>
  <text x="400" y="275" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Filter Types</text>
  <rect x="130" y="290" width="120" height="40" rx="6" fill="#3498db"/>
  <text x="190" y="310" font-size="11" text-anchor="middle" fill="#ffffff">Producer</text>
  <text x="190" y="325" font-size="9" text-anchor="middle" fill="#d5e8f5">Source data</text>
  <rect x="280" y="290" width="120" height="40" rx="6" fill="#2ecc71"/>
  <text x="340" y="310" font-size="11" text-anchor="middle" fill="#ffffff">Transformer</text>
  <text x="340" y="325" font-size="9" text-anchor="middle" fill="#d5f5e3">Modify data</text>
  <rect x="430" y="290" width="120" height="40" rx="6" fill="#9b59b6"/>
  <text x="490" y="310" font-size="11" text-anchor="middle" fill="#ffffff">Tester</text>
  <text x="490" y="325" font-size="9" text-anchor="middle" fill="#e8daef">Filter/route</text>
  <rect x="580" y="290" width="120" height="40" rx="6" fill="#e74c3c"/>
  <text x="640" y="310" font-size="11" text-anchor="middle" fill="#ffffff">Consumer</text>
  <text x="640" y="325" font-size="9" text-anchor="middle" fill="#fadbd8">Final destination</text>
  <!-- Trade-offs -->
  <rect x="50" y="390" width="700" height="40" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="415" font-size="12" text-anchor="middle" fill="#ffffff">Testability ★★★★☆ | Modularity ★★★★★ | Performance ★★★☆☆ | Scalability ★★☆☆☆</text>
</svg>