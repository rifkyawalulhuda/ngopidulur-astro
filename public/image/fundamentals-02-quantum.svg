<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="qbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a1a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#qbg2)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Architecture Quantum</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Independently Deployable + High Functional Cohesion</text>
  <!-- Monolith -->
  <rect x="80" y="120" width="200" height="200" rx="10" fill="#e74c3c" opacity="0.9"/>
  <text x="180" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Monolith</text>
  <text x="180" y="170" font-size="12" text-anchor="middle" fill="#fadbd8">1 Quantum</text>
  <rect x="100" y="190" width="160" height="30" rx="5" fill="#c0392b"/>
  <text x="180" y="210" font-size="11" text-anchor="middle" fill="#ffffff">Single Deployment</text>
  <rect x="100" y="230" width="160" height="30" rx="5" fill="#c0392b"/>
  <text x="180" y="250" font-size="11" text-anchor="middle" fill="#ffffff">Shared Database</text>
  <rect x="100" y="270" width="160" height="30" rx="5" fill="#c0392b"/>
  <text x="180" y="290" font-size="11" text-anchor="middle" fill="#ffffff">Tight Coupling</text>
  <!-- Microservices -->
  <rect x="320" y="120" width="120" height="90" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="380" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Service A</text>
  <text x="380" y="165" font-size="10" text-anchor="middle" fill="#d5e8f5">Own DB</text>
  <rect x="460" y="120" width="120" height="90" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="520" y="145" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Service B</text>
  <text x="520" y="165" font-size="10" text-anchor="middle" fill="#d5f5e3">Own DB</text>
  <rect x="390" y="230" width="120" height="90" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="450" y="255" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Service C</text>
  <text x="450" y="275" font-size="10" text-anchor="middle" fill="#e8daef">Own DB</text>
  <text x="450" y="340" font-size="12" text-anchor="middle" fill="#a0a0a0">N Quantum</text>
  <!-- Serverless -->
  <rect x="600" y="120" width="80" height="60" rx="6" fill="#f39c12" opacity="0.9"/>
  <text x="640" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Function 1</text>
  <rect x="600" y="190" width="80" height="60" rx="6" fill="#e67e22" opacity="0.9"/>
  <text x="640" y="215" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Function 2</text>
  <rect x="600" y="260" width="80" height="60" rx="6" fill="#e74c3c" opacity="0.9"/>
  <text x="640" y="285" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Function 3</text>
  <text x="640" y="340" font-size="12" text-anchor="middle" fill="#a0a0a0">M Quantum</text>
  <!-- Trade-off -->
  <rect x="150" y="370" width="500" height="60" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="395" font-size="13" text-anchor="middle" fill="#ffffff">More Quantum = More Independence, More Complexity</text>
  <text x="400" y="415" font-size="11" text-anchor="middle" fill="#bdc3c7">Static coupling: shared DB/library | Dynamic coupling: sync calls</text>
</svg>