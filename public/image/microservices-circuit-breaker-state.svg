<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff" rx="12"/>
  <rect width="900" height="400" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Circuit Breaker — State Machine</text>
  <!-- CLOSED -->
  <rect x="50" y="110" width="180" height="130" fill="#dcfce7" rx="12" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="140" cy="150" r="24" fill="#16a34a"/>
  <text x="140" y="155" font-family="Inter,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">✓</text>
  <text x="140" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#166534" text-anchor="middle" font-weight="700">CLOSED</text>
  <text x="140" y="214" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Request diteruskan normal</text>
  <text x="140" y="228" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#4ade80" text-anchor="middle">Error rate &lt; threshold</text>
  <!-- OPEN -->
  <rect x="360" y="110" width="180" height="130" fill="#fecaca" rx="12" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="450" cy="150" r="24" fill="#dc2626"/>
  <text x="450" y="155" font-family="Inter,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">✕</text>
  <text x="450" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">OPEN</text>
  <text x="450" y="214" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle">Request DIBLOKIR</text>
  <text x="450" y="228" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#f87171" text-anchor="middle">Fail fast, proteksi service</text>
  <!-- HALF-OPEN -->
  <rect x="670" y="110" width="180" height="130" fill="#fef3c7" rx="12" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="760" cy="150" r="24" fill="#d97706"/>
  <text x="760" y="155" font-family="Inter,Arial,sans-serif" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">?</text>
  <text x="760" y="196" font-family="Inter,Arial,sans-serif" font-size="13" fill="#92400e" text-anchor="middle" font-weight="700">HALF-OPEN</text>
  <text x="760" y="214" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">Coba request terbatas</text>
  <text x="760" y="228" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#fbbf24" text-anchor="middle">Tes apakah pulih</text>
  <!-- Arrows -->
  <line x1="230" y1="145" x2="360" y2="145" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="295" y="130" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#b91c1c" text-anchor="middle" font-weight="600">failures &gt; threshold</text>
  <line x1="540" y1="145" x2="670" y2="145" stroke="#d97706" stroke-width="2" marker-end="url(#arr)"/>
  <text x="605" y="130" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">timeout</text>
  <!-- Return arrows -->
  <path d="M 760 240 L 760 290 L 140 290 L 140 240" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="450" y="280" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle" font-weight="600">success → CLOSED (reset)</text>
  <text x="450" y="295" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">failure → kembali OPEN</text>
  <!-- Behavior labels -->
  <text x="140" y="330" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">Closed → Open: saat error rate</text>
  <text x="140" y="344" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">melebihi threshold (misal 50%)</text>
  <text x="450" y="330" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">Open → Half-open: setelah</text>
  <text x="450" y="344" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">cooldown timeout (misal 30 detik)</text>
  <text x="760" y="330" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">Half-open → Closed: jika probe</text>
  <text x="760" y="344" font-family="Inter,Arial,sans-serif" font-size="9" fill="#475569" text-anchor="middle">request berhasil</text>
  <!-- Footer -->
  <text x="450" y="385" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Building Microservices (Sam Newman) — Resilience pattern</text>
</svg>
