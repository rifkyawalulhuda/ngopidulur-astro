<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid dots -->
  <g opacity="0.06">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="#a78bfa" stroke-width="0.5"/>
  </g>

  <!-- Binary Tree visualization -->
  <g transform="translate(60, 80)">
    <!-- Edges -->
    <line x1="160" y1="50" x2="80" y2="130" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
    <line x1="160" y1="50" x2="240" y2="130" stroke="#7c3aed" stroke-width="1.5" opacity="0.6"/>
    <line x1="80" y1="130" x2="40" y2="210" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
    <line x1="80" y1="130" x2="120" y2="210" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
    <line x1="240" y1="130" x2="280" y2="210" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
    <!-- Nodes -->
    <circle cx="160" cy="50" r="22" fill="#1e1b4b" stroke="url(#purple)" stroke-width="2"/>
    <text x="160" y="55" font-family="monospace" font-size="13" fill="#a78bfa" text-anchor="middle" font-weight="bold">50</text>
    <circle cx="80" cy="130" r="20" fill="#1e1b4b" stroke="url(#purple)" stroke-width="1.5"/>
    <text x="80" y="135" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">30</text>
    <circle cx="240" cy="130" r="20" fill="#1e1b4b" stroke="url(#purple)" stroke-width="1.5"/>
    <text x="240" y="135" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">70</text>
    <circle cx="40" cy="210" r="18" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="40" y="215" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">20</text>
    <circle cx="120" cy="210" r="18" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="120" y="215" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">40</text>
    <circle cx="280" cy="210" r="18" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1"/>
    <text x="280" y="215" font-family="monospace" font-size="11" fill="#8b5cf6" text-anchor="middle">80</text>
    <!-- Label -->
    <text x="160" y="275" font-family="monospace" font-size="10" fill="#6d28d9" text-anchor="middle" letter-spacing="2">BINARY SEARCH TREE</text>
  </g>

  <!-- Array visualization -->
  <g transform="translate(60, 380)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#6d28d9" letter-spacing="2">ARRAY</text>
    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="48" height="40" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="24" y="25" font-family="monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">10</text>
      <rect x="52" y="0" width="48" height="40" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="76" y="25" font-family="monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">30</text>
      <rect x="104" y="0" width="48" height="40" rx="4" fill="#2d1b69" stroke="#a78bfa" stroke-width="2"/>
      <text x="128" y="25" font-family="monospace" font-size="14" fill="#c4b5fd" text-anchor="middle" font-weight="bold">50</text>
      <rect x="156" y="0" width="48" height="40" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="180" y="25" font-family="monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">70</text>
      <rect x="208" y="0" width="48" height="40" rx="4" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
      <text x="232" y="25" font-family="monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">90</text>
    </g>
    <g transform="translate(0, 56)" font-family="monospace" font-size="9" fill="#6d28d9" text-anchor="middle">
      <text x="24">0</text>
      <text x="76">1</text>
      <text x="128">2</text>
      <text x="180">3</text>
      <text x="232">4</text>
    </g>
  </g>

  <!-- Linked list visualization -->
  <g transform="translate(60, 490)">
    <text x="0" y="0" font-family="monospace" font-size="10" fill="#0891b2" letter-spacing="2">LINKED LIST</text>
    <g transform="translate(0, 12)">
      <rect x="0" y="0" width="64" height="36" rx="4" fill="#0c1a2e" stroke="#0891b2" stroke-width="1.5"/>
      <text x="20" y="22" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">10</text>
      <line x1="40" y1="18" x2="52" y2="18" stroke="#0891b2" stroke-width="1"/>
      <text x="52" y="22" font-family="monospace" font-size="10" fill="#0891b2">→</text>
      <line x1="68" y1="18" x2="80" y2="18" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr)"/>
      <rect x="84" y="0" width="64" height="36" rx="4" fill="#0c1a2e" stroke="#0891b2" stroke-width="1.5"/>
      <text x="104" y="22" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">20</text>
      <line x1="136" y1="18" x2="156" y2="18" stroke="#0891b2" stroke-width="1.5"/>
      <rect x="168" y="0" width="64" height="36" rx="4" fill="#0c1a2e" stroke="#0891b2" stroke-width="1.5"/>
      <text x="188" y="22" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">30</text>
      <line x1="220" y1="18" x2="240" y2="18" stroke="#0891b2" stroke-width="1.5"/>
      <text x="248" y="22" font-family="monospace" font-size="11" fill="#0891b2">NULL</text>
    </g>
  </g>

  <!-- Stack visualization -->
  <g transform="translate(380, 380)">
    <text x="30" y="0" font-family="monospace" font-size="10" fill="#6d28d9" text-anchor="middle" letter-spacing="2">STACK</text>
    <rect x="0" y="10" width="60" height="32" rx="3" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <text x="30" y="31" font-family="monospace" font-size="12" fill="#c4b5fd" text-anchor="middle" font-weight="bold">30</text>
    <text x="70" y="31" font-family="monospace" font-size="9" fill="#7c3aed">← TOP</text>
    <rect x="0" y="46" width="60" height="32" rx="3" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="30" y="67" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">20</text>
    <rect x="0" y="82" width="60" height="32" rx="3" fill="#1e1b4b" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="30" y="103" font-family="monospace" font-size="12" fill="#a78bfa" text-anchor="middle">10</text>
    <rect x="0" y="116" width="60" height="6" rx="0" fill="#7c3aed" opacity="0.4"/>
  </g>

  <!-- Title block -->
  <g transform="translate(540, 140)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#6d28d9" letter-spacing="4">DATA STRUCTURE</text>
    <text x="0" y="48" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-2">&amp; Algorithm</text>
    <rect x="0" y="64" width="120" height="4" rx="2" fill="url(#purple)" filter="url(#glow)"/>
    <text x="0" y="110" font-family="system-ui, sans-serif" font-size="14" fill="#6d28d9" letter-spacing="3">ARRAY · LINKED LIST · STACK · QUEUE · TREE · GRAPH · SORT</text>
  </g>

  <!-- Big O tags -->
  <g transform="translate(540, 390)" font-family="monospace">
    <rect x="0" y="0" width="72" height="28" rx="14" fill="#7c3aed" opacity="0.15"/>
    <text x="36" y="18" font-size="11" fill="#a78bfa" text-anchor="middle">O(1)</text>
    <rect x="82" y="0" width="82" height="28" rx="14" fill="#7c3aed" opacity="0.15"/>
    <text x="123" y="18" font-size="11" fill="#a78bfa" text-anchor="middle">O(log n)</text>
    <rect x="174" y="0" width="68" height="28" rx="14" fill="#0891b2" opacity="0.15"/>
    <text x="208" y="18" font-size="11" fill="#22d3ee" text-anchor="middle">O(n)</text>
    <rect x="252" y="0" width="100" height="28" rx="14" fill="#0891b2" opacity="0.15"/>
    <text x="302" y="18" font-size="11" fill="#22d3ee" text-anchor="middle">O(n log n)</text>
    <rect x="362" y="0" width="68" height="28" rx="14" fill="#7c3aed" opacity="0.15"/>
    <text x="396" y="18" font-size="11" fill="#a78bfa" text-anchor="middle">O(n²)</text>
  </g>

  <!-- ngopidulur branding -->
  <text x="30" y="610" font-family="system-ui, sans-serif" font-size="12" fill="#334155">ngopidulur.my.id</text>
  <text x="1170" y="610" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="end">DSA Series</text>
</svg>
