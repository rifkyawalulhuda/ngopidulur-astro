<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="900" height="500" fill="qbg"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Architecture Quantum</text>
  <text x="450" y="58" font-size="12" text-anchor="middle" fill="#6c757d">Independently deployable component with high functional cohesion</text>

  <!-- Quantum A: Independently deployable -->
  <rect x="60" y="90" width="360" height="160" rx="10" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="240" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#155724">Quantum A: Independently Deployable</text>
  <rect x="80" y="135" width="150" height="50" rx="5" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="155" y="165" font-size="11" text-anchor="middle" fill="#155724">Service A</text>
  <rect x="250" y="135" width="150" height="50" rx="5" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="325" y="165" font-size="11" text-anchor="middle" fill="#155724">Database A</text>
  <text x="240" y="215" font-size="10" text-anchor="middle" fill="#155724">High Functional Cohesion</text>
  <text x="240" y="232" font-size="10" text-anchor="middle" fill="#155724">(Service + Data deploy together)</text>

  <!-- Quantum B: Coupled -->
  <rect x="480" y="90" width="360" height="160" rx="10" fill="#f8d7da" stroke="#dc3545" stroke-width="2"/>
  <text x="660" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#721c24">Quantum B: Statically Coupled</text>
  <rect x="500" y="135" width="150" height="50" rx="5" fill="#ffffff" stroke="#dc3545" stroke-width="1"/>
  <text x="575" y="165" font-size="11" text-anchor="middle" fill="#721c24">Service B</text>
  <rect x="670" y="135" width="150" height="50" rx="5" fill="#ffffff" stroke="#dc3545" stroke-width="1"/>
  <text x="745" y="165" font-size="11" text-anchor="middle" fill="#721c24">Service C</text>
  <line x1="650" y1="160" x2="670" y2="160" stroke="#dc3545" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="215" font-size="10" text-anchor="middle" fill="#721c24">Shared Database → Coupling</text>
  <text x="660" y="232" font-size="10" text-anchor="middle" fill="#721c24">(Changes affect both services)</text>

  <!-- Static vs Dynamic -->
  <rect x="60" y="280" width="780" height="180" rx="10" fill="#ffffff" stroke="#495057" stroke-width="1"/>
  <text x="450" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">Two Types of Coupling</text>

  <rect x="90" y="325" width="350" height="110" rx="5" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="265" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d6efd">Static Coupling</text>
  <text x="265" y="370" font-size="10" text-anchor="middle" fill="#212529">Structural dependencies in code</text>
  <text x="265" y="388" font-size="10" text-anchor="middle" fill="#212529">Class A → Class B</text>
  <text x="265" y="406" font-size="10" text-anchor="middle" fill="#6c757d">Measurable: afferent/efferent coupling</text>

  <rect x="460" y="325" width="350" height="110" rx="5" fill="#fff3cd" stroke="#ffc107" stroke-width="1"/>
  <text x="635" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#856404">Dynamic Coupling</text>
  <text x="635" y="370" font-size="10" text-anchor="middle" fill="#212529">Runtime dependencies via network</text>
  <text x="635" y="388" font-size="10" text-anchor="middle" fill="#212529">Service A → Service B (REST/gRPC)</text>
  <text x="635" y="406" font-size="10" text-anchor="middle" fill="#6c757d">Harder to measure, more dangerous</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc3545"/>
    </marker>
  </defs>
</svg>
