<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="ldbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ldbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Soft Skills for Software Architect</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Teams, Negotiation, Leadership, Career - Fundamentals Part III</text>
  <!-- Team Effectiveness -->
  <rect x="80" y="110" width="180" height="140" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="170" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Team</text>
  <text x="170" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Effectiveness</text>
  <rect x="100" y="170" width="140" height="25" rx="4" fill="#2980b9"/>
  <text x="170" y="187" font-size="10" text-anchor="middle" fill="#ffffff">Team Boundaries</text>
  <rect x="100" y="200" width="140" height="25" rx="4" fill="#2980b9"/>
  <text x="170" y="217" font-size="10" text-anchor="middle" fill="#ffffff">Elastic Leadership</text>
  <rect x="100" y="230" width="140" height="25" rx="4" fill="#2980b9"/>
  <text x="170" y="247" font-size="10" text-anchor="middle" fill="#ffffff">Warning Signs</text>
  <!-- Negotiation -->
  <rect x="310" y="110" width="180" height="140" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="400" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Negotiation</text>
  <text x="400" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">&amp; Leadership</text>
  <rect x="330" y="170" width="140" height="25" rx="4" fill="#27ae60"/>
  <text x="400" y="187" font-size="10" text-anchor="middle" fill="#ffffff">Divide &amp; Conquer</text>
  <rect x="330" y="200" width="140" height="25" rx="4" fill="#27ae60"/>
  <text x="400" y="217" font-size="10" text-anchor="middle" fill="#ffffff">Compromise</text>
  <rect x="330" y="230" width="140" height="25" rx="4" fill="#27ae60"/>
  <text x="400" y="247" font-size="10" text-anchor="middle" fill="#ffffff">4 C's Architecture</text>
  <!-- Career -->
  <rect x="540" y="110" width="180" height="140" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="630" y="135" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Career</text>
  <text x="630" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">Development</text>
  <rect x="560" y="170" width="140" height="25" rx="4" fill="#8e44ad"/>
  <text x="630" y="187" font-size="10" text-anchor="middle" fill="#ffffff">20-Minute Rule</text>
  <rect x="560" y="200" width="140" height="25" rx="4" fill="#8e44ad"/>
  <text x="630" y="217" font-size="10" text-anchor="middle" fill="#ffffff">Architecture Katas</text>
  <rect x="560" y="230" width="140" height="25" rx="4" fill="#8e44ad"/>
  <text x="630" y="247" font-size="10" text-anchor="middle" fill="#ffffff">Continuous Learning</text>
  <!-- Architect Types -->
  <rect x="100" y="280" width="600" height="60" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Architect Personalities</text>
  <text x="200" y="325" font-size="11" text-anchor="middle" fill="#e74c3c">✗ Control Freak (micro-manage)</text>
  <text x="400" y="325" font-size="11" text-anchor="middle" fill="#f39c12">✗ Armchair Architect (no hands-on)</text>
  <text x="600" y="325" font-size="11" text-anchor="middle" fill="#2ecc71">✓ Effective Architect (balanced)</text>
  <!-- Key Insight -->
  <rect x="150" y="360" width="500" height="60" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="385" font-size="13" text-anchor="middle" fill="#ffffff">"Architecture is a journey, not a destination"</text>
  <text x="400" y="405" font-size="11" text-anchor="middle" fill="#bdc3c7">Technical skills + Soft skills = Effective Architect</text>
</svg>