<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="dvbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#203a43"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dvbg)"/>
  <text x="400" y="55" font-size="30" font-weight="bold" text-anchor="middle" fill="#ffffff">Data Visualization</text>
  <text x="400" y="90" font-size="15" text-anchor="middle" fill="#a0a0a0">Panduan Lengkap Memilih Chart &amp; Mendesain Visualisasi</text>
  <!-- 4 pillars -->
  <rect x="60" y="130" width="160" height="150" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="140" y="160" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Data</text>
  <text x="140" y="185" font-size="11" text-anchor="middle" fill="#d5e8f5">Jenis data</text>
  <text x="140" y="205" font-size="11" text-anchor="middle" fill="#d5e8f5">7 hubungan</text>
  <text x="140" y="225" font-size="11" text-anchor="middle" fill="#d5e8f5">11 format</text>
  <text x="140" y="255" font-size="10" text-anchor="middle" fill="#a0a0a0">Temukan cerita</text>
  <rect x="240" y="130" width="160" height="150" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="320" y="160" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Chart</text>
  <text x="320" y="185" font-size="11" text-anchor="middle" fill="#d5f5e3">Bar, Pie, Line</text>
  <text x="320" y="205" font-size="11" text-anchor="middle" fill="#d5f5e3">Area, Scatter</text>
  <text x="320" y="225" font-size="11" text-anchor="middle" fill="#d5f5e3">Bubble, Heat map</text>
  <text x="320" y="255" font-size="10" text-anchor="middle" fill="#a0a0a0">Pilih yang tepat</text>
  <rect x="420" y="130" width="160" height="150" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="500" y="160" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Design</text>
  <text x="500" y="185" font-size="11" text-anchor="middle" fill="#e8daef">Preattentive</text>
  <text x="500" y="205" font-size="11" text-anchor="middle" fill="#e8daef">Gestalt</text>
  <text x="500" y="225" font-size="11" text-anchor="middle" fill="#e8daef">Shneiderman</text>
  <text x="500" y="255" font-size="10" text-anchor="middle" fill="#a0a0a0">Prinsip persepsi</text>
  <rect x="600" y="130" width="160" height="150" rx="10" fill="#e67e22" opacity="0.9"/>
  <text x="680" y="160" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Storytelling</text>
  <text x="680" y="185" font-size="11" text-anchor="middle" fill="#fdebd0">Narrative</text>
  <text x="680" y="205" font-size="11" text-anchor="middle" fill="#fdebd0">Visualization</text>
  <text x="680" y="225" font-size="11" text-anchor="middle" fill="#fdebd0">Data</text>
  <text x="680" y="255" font-size="10" text-anchor="middle" fill="#a0a0a0">Komunikasikan insight</text>
  <!-- Formula -->
  <rect x="150" y="310" width="500" height="55" rx="8" fill="#34495e" opacity="0.85"/>
  <text x="400" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Data + Visualization + Narrative = Insight</text>
  <text x="400" y="355" font-size="11" text-anchor="middle" fill="#bdc3c7">Visual diproses 60.000x lebih cepat dari teks/tabel</text>
  <text x="400" y="410" font-size="12" text-anchor="middle" fill="#7f8c8d">"Graphical excellence gives the greatest number of ideas in the shortest time" - Edward Tufte</text>
</svg>