<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e34c26"/>
      <stop offset="100%" stop-color="#f06529"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#264de4"/>
      <stop offset="100%" stop-color="#2965f1"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0db4f"/>
      <stop offset="100%" stop-color="#f7e018"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.04">
    <line x1="0" y1="90" x2="1200" y2="90" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="450" x2="1200" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- HTML logo block -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#1c2128" stroke="#e34c26" stroke-width="1.5"/>
    <text x="65" y="45" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="url(#orange)" text-anchor="middle">5</text>
    <text x="65" y="75" font-family="Arial, sans-serif" font-size="11" fill="#e34c26" text-anchor="middle" letter-spacing="2">HTML</text>
    <text x="65" y="110" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">&lt;div&gt;</text>
    <text x="65" y="124" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">  &lt;p&gt;Hello&lt;/p&gt;</text>
    <text x="65" y="138" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">&lt;/div&gt;</text>
  </g>

  <!-- CSS logo block -->
  <g transform="translate(210, 60)">
    <rect x="0" y="0" width="130" height="150" rx="8" fill="#1c2128" stroke="#264de4" stroke-width="1.5"/>
    <text x="65" y="45" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="url(#blue)" text-anchor="middle">3</text>
    <text x="65" y="75" font-family="Arial, sans-serif" font-size="11" fill="#264de4" text-anchor="middle" letter-spacing="2">CSS</text>
    <text x="65" y="110" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">.btn {</text>
    <text x="65" y="124" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">  color: blue;</text>
    <text x="65" y="138" font-family="monospace" font-size="9" fill="#8b949e" text-anchor="middle">}</text>
  </g>

  <!-- JS logo block -->
  <g transform="translate(60, 230)">
    <rect x="0" y="0" width="280" height="150" rx="8" fill="#1c2128" stroke="#f0db4f" stroke-width="1.5"/>
    <text x="50" y="55" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="url(#yellow)" text-anchor="middle">JS</text>
    <text x="50" y="78" font-family="Arial, sans-serif" font-size="10" fill="#f0db4f" text-anchor="middle" letter-spacing="2">JAVASCRIPT</text>
    <text x="175" y="45" font-family="monospace" font-size="9" fill="#79c0ff">const</text>
    <text x="212" y="45" font-family="monospace" font-size="9" fill="#e6edf3"> greet =</text>
    <text x="175" y="60" font-family="monospace" font-size="9" fill="#ffa657">  (name)</text>
    <text x="221" y="60" font-family="monospace" font-size="9" fill="#ff7b72"> =&gt;</text>
    <text x="175" y="75" font-family="monospace" font-size="9" fill="#a5d6ff">  `Hello ${name}`</text>
    <text x="175" y="105" font-family="monospace" font-size="9" fill="#8b949e">// ES6 Arrow Function</text>
    <text x="175" y="120" font-family="monospace" font-size="9" fill="#79c0ff">const</text>
    <text x="212" y="120" font-family="monospace" font-size="9" fill="#e6edf3"> nums = [1,2,3]</text>
    <text x="175" y="135" font-family="monospace" font-size="9" fill="#e6edf3">.map(</text>
    <text x="202" y="135" font-family="monospace" font-size="9" fill="#ffa657">x</text>
    <text x="210" y="135" font-family="monospace" font-size="9" fill="#ff7b72"> =&gt; </text>
    <text x="228" y="135" font-family="monospace" font-size="9" fill="#ffa657">x</text>
    <text x="236" y="135" font-family="monospace" font-size="9" fill="#ff7b72">**</text>
    <text x="248" y="135" font-family="monospace" font-size="9" fill="#a5d6ff">2</text>
    <text x="256" y="135" font-family="monospace" font-size="9" fill="#e6edf3">);</text>
  </g>

  <!-- Title -->
  <g transform="translate(390, 80)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#8b949e" letter-spacing="5">BELAJAR</text>
    <text x="0" y="58" font-family="system-ui, sans-serif" font-size="68" font-weight="900" fill="#ffffff">UI Dev</text>
    <rect x="0" y="68" width="80" height="4" rx="2" fill="url(#orange)"/>
    <rect x="88" y="68" width="60" height="4" rx="2" fill="url(#blue)"/>
    <rect x="156" y="68" width="60" height="4" rx="2" fill="url(#yellow)"/>
    <text x="0" y="105" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e" letter-spacing="1">HTML · CSS · JavaScript + ES6</text>
  </g>

  <!-- Topic pills -->
  <g transform="translate(390, 240)" font-family="monospace" font-size="11">
    <rect x="0" y="0" width="86" height="28" rx="14" fill="#e34c26" opacity="0.2"/>
    <text x="43" y="18" fill="#f06529" text-anchor="middle">HTML Tags</text>
    <rect x="94" y="0" width="100" height="28" rx="14" fill="#e34c26" opacity="0.2"/>
    <text x="144" y="18" fill="#f06529" text-anchor="middle">Forms &amp; Tables</text>
    <rect x="202" y="0" width="110" height="28" rx="14" fill="#264de4" opacity="0.2"/>
    <text x="257" y="18" fill="#2965f1" text-anchor="middle">CSS Selectors</text>
    <rect x="320" y="0" width="90" height="28" rx="14" fill="#264de4" opacity="0.2"/>
    <text x="365" y="18" fill="#2965f1" text-anchor="middle">Flexbox</text>
    <rect x="0" y="36" width="110" height="28" rx="14" fill="#f0db4f" opacity="0.15"/>
    <text x="55" y="54" fill="#f0db4f" text-anchor="middle">JS Variables</text>
    <rect x="118" y="36" width="86" height="28" rx="14" fill="#f0db4f" opacity="0.15"/>
    <text x="161" y="54" fill="#f0db4f" text-anchor="middle">Functions</text>
    <rect x="212" y="36" width="70" height="28" rx="14" fill="#f0db4f" opacity="0.15"/>
    <text x="247" y="54" fill="#f0db4f" text-anchor="middle">ES6+</text>
    <rect x="290" y="36" width="80" height="28" rx="14" fill="#f0db4f" opacity="0.15"/>
    <text x="330" y="54" fill="#f0db4f" text-anchor="middle">Promises</text>
  </g>

  <!-- Browser mockup -->
  <g transform="translate(390, 350)">
    <rect x="0" y="0" width="770" height="220" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="770" height="32" rx="8" fill="#21262d"/>
    <circle cx="18" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="16" r="5" fill="#febc2e"/>
    <circle cx="50" cy="16" r="5" fill="#28c840"/>
    <rect x="70" y="6" width="500" height="20" rx="10" fill="#0d1117"/>
    <text x="320" y="20" font-family="monospace" font-size="9" fill="#484f58" text-anchor="middle">https://ngopidulur.my.id</text>
    <!-- HTML code -->
    <text x="20" y="58" font-family="monospace" font-size="10" fill="#8b949e">&lt;!-- HTML --&gt;</text>
    <text x="20" y="76" font-family="monospace" font-size="10" fill="#ff7b72">&lt;div</text>
    <text x="54" y="76" font-family="monospace" font-size="10" fill="#79c0ff"> class</text>
    <text x="96" y="76" font-family="monospace" font-size="10" fill="#e6edf3">=</text>
    <text x="104" y="76" font-family="monospace" font-size="10" fill="#a5d6ff">"container"</text>
    <text x="174" y="76" font-family="monospace" font-size="10" fill="#ff7b72">&gt;</text>
    <!-- CSS code -->
    <text x="20" y="102" font-family="monospace" font-size="10" fill="#8b949e">/* CSS */</text>
    <text x="20" y="120" font-family="monospace" font-size="10" fill="#e6edf3">.container {</text>
    <text x="20" y="136" font-family="monospace" font-size="10" fill="#79c0ff">  display</text>
    <text x="84" y="136" font-family="monospace" font-size="10" fill="#e6edf3">:</text>
    <text x="92" y="136" font-family="monospace" font-size="10" fill="#a5d6ff"> flex</text>
    <text x="118" y="136" font-family="monospace" font-size="10" fill="#e6edf3">;</text>
    <!-- JS code -->
    <text x="300" y="58" font-family="monospace" font-size="10" fill="#8b949e">// JavaScript ES6</text>
    <text x="300" y="76" font-family="monospace" font-size="10" fill="#ff7b72">const</text>
    <text x="336" y="76" font-family="monospace" font-size="10" fill="#e6edf3"> data = </text>
    <text x="384" y="76" font-family="monospace" font-size="10" fill="#ff7b72">await</text>
    <text x="418" y="76" font-family="monospace" font-size="10" fill="#e6edf3"> fetch(url);</text>
    <text x="300" y="94" font-family="monospace" font-size="10" fill="#ff7b72">const</text>
    <text x="336" y="94" font-family="monospace" font-size="10" fill="#e6edf3"> items = data</text>
    <text x="300" y="112" font-family="monospace" font-size="10" fill="#e6edf3">  .filter(</text>
    <text x="354" y="112" font-family="monospace" font-size="10" fill="#ffa657">x</text>
    <text x="362" y="112" font-family="monospace" font-size="10" fill="#ff7b72"> =&gt; </text>
    <text x="386" y="112" font-family="monospace" font-size="10" fill="#ffa657">x</text>
    <text x="394" y="112" font-family="monospace" font-size="10" fill="#e6edf3">.aktif)</text>
    <text x="300" y="130" font-family="monospace" font-size="10" fill="#e6edf3">  .map(</text>
    <text x="334" y="130" font-family="monospace" font-size="10" fill="#ffa657">x</text>
    <text x="342" y="130" font-family="monospace" font-size="10" fill="#ff7b72"> =&gt; </text>
    <text x="366" y="130" font-family="monospace" font-size="10" fill="#a5d6ff">`${x.nama}`</text>
    <text x="424" y="130" font-family="monospace" font-size="10" fill="#e6edf3">);</text>
    <!-- Destructuring -->
    <text x="300" y="158" font-family="monospace" font-size="10" fill="#8b949e">// Destructuring</text>
    <text x="300" y="176" font-family="monospace" font-size="10" fill="#ff7b72">const</text>
    <text x="336" y="176" font-family="monospace" font-size="10" fill="#e6edf3"> { nama, umur } = user;</text>
    <text x="300" y="194" font-family="monospace" font-size="10" fill="#ff7b72">const</text>
    <text x="336" y="194" font-family="monospace" font-size="10" fill="#e6edf3"> [first, ...rest] = arr;</text>
  </g>

  <!-- Branding -->
  <text x="30" y="612" font-family="system-ui, sans-serif" font-size="12" fill="#484f58">ngopidulur.my.id</text>
  <text x="1170" y="612" font-family="system-ui, sans-serif" font-size="11" fill="#484f58" text-anchor="end">UI Technologies Series</text>
</svg>
