<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff" rx="12"/>
  <rect width="900" height="300" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Query Plan — Operator Tree (Volcano Iterator Model)</text>
  <!-- Top: HashJoin customers -->
  <rect x="370" y="70" width="170" height="55" fill="#4f46e5" rx="10" stroke="#3730a3" stroke-width="2"/>
  <text x="455" y="94" font-family="Inter,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">HashJoin</text>
  <text x="455" y="112" font-family="Inter,Arial,sans-serif" font-size="9" fill="#c7d2fe" text-anchor="middle">on customer_id</text>
  <!-- Left branch: SeqScan customers -->
  <rect x="90" y="180" width="190" height="55" fill="#dbeafe" rx="10" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="185" y="204" font-family="Inter,Arial,sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">SeqScan</text>
  <text x="185" y="222" font-family="Inter,Arial,sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">customers · city = 'Jakarta'</text>
  <!-- Right branch: HashJoin product -->
  <rect x="350" y="180" width="200" height="55" fill="#dcfce7" rx="10" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="204" font-family="Inter,Arial,sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">HashJoin</text>
  <text x="450" y="222" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">on product_id</text>
  <!-- Right-left: SeqScan orders -->
  <rect x="330" y="270" width="130" height="50" fill="#fef3c7" rx="10" stroke="#d97706" stroke-width="1.8"/>
  <text x="395" y="292" font-family="Inter,Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700">SeqScan</text>
  <text x="395" y="310" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#b45309" text-anchor="middle">orders · status='PAID'</text>
  <!-- Right-right: IndexScan products -->
  <rect x="530" y="270" width="150" height="50" fill="#fce7f3" rx="10" stroke="#db2777" stroke-width="1.8"/>
  <text x="605" y="292" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9d174d" text-anchor="middle" font-weight="700">IndexScan</text>
  <text x="605" y="310" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#db2777" text-anchor="middle">products · PK index</text>
  <!-- Edges -->
  <line x1="440" y1="125" x2="200" y2="180" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="125" x2="460" y2="180" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="235" x2="400" y2="270" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="480" y1="235" x2="590" y2="270" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Footer note -->
  <text x="450" y="260" font-family="Inter,Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Setiap operator = iterator (Open / Next / Close) · hasil dipipelin ke parent</text>
</svg>
