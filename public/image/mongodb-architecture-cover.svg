<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#052e16"/>
      <stop offset="50%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#166534"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>
  <!-- MongoDB leaf badge -->
  <circle cx="90" cy="95" r="34" fill="#22c55e"/>
  <path d="M90,72 c-8,14 -8,32 0,46 c8,-14 8,-32 0,-46 z" fill="#14532d"/>
  <text x="450" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">MongoDB Architecture Guide</text>
  <text x="450" y="123" font-family="Inter,Arial,sans-serif" font-size="15" fill="#86efac" text-anchor="middle">Document Database · Nexus Architecture · Scale-Out</text>
  <!-- Document icon -->
  <rect x="340" y="160" width="220" height="150" fill="#f0fdf4" rx="12" stroke="#4ade80" stroke-width="2"/>
  <text x="450" y="190" font-family="monospace,Consolas" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">{ "article": {</text>
  <text x="450" y="212" font-family="monospace,Consolas" font-size="10.5" fill="#15803d" text-anchor="middle">"title": "MongoDB",</text>
  <text x="450" y="230" font-family="monospace,Consolas" font-size="10.5" fill="#15803d" text-anchor="middle">"tags": ["db","nosql"],</text>
  <text x="450" y="248" font-family="monospace,Consolas" font-size="10.5" fill="#15803d" text-anchor="middle">"comments": [</text>
  <text x="450" y="266" font-family="monospace,Consolas" font-size="10.5" fill="#16a34a" text-anchor="middle">  { "text": "great" }</text>
  <text x="450" y="284" font-family="monospace,Consolas" font-size="10.5" fill="#15803d" text-anchor="middle">] } }</text>
  <!-- Replica set below -->
  <rect x="130" y="350" width="140" height="55" fill="rgba(74,222,128,0.2)" stroke="#4ade80" stroke-width="1.8" rx="10"/>
  <text x="200" y="375" font-family="Inter,Arial,sans-serif" font-size="12" fill="#bbf7d0" text-anchor="middle" font-weight="700">PRIMARY</text>
  <text x="200" y="392" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#86efac" text-anchor="middle">writes + reads</text>
  <rect x="390" y="350" width="140" height="55" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5" rx="10"/>
  <text x="460" y="375" font-family="Inter,Arial,sans-serif" font-size="11" fill="#bbf7d0" text-anchor="middle" font-weight="700">SECONDARY</text>
  <text x="460" y="392" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#86efac" text-anchor="middle">reads (optional)</text>
  <rect x="640" y="350" width="140" height="55" fill="rgba(74,222,128,0.12)" stroke="#4ade80" stroke-width="1.5" rx="10"/>
  <text x="710" y="375" font-family="Inter,Arial,sans-serif" font-size="11" fill="#bbf7d0" text-anchor="middle" font-weight="700">SECONDARY</text>
  <text x="710" y="392" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#86efac" text-anchor="middle">reads (optional)</text>
  <line x1="270" y1="377" x2="390" y2="377" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="530" y1="377" x2="640" y2="377" stroke="#4ade80" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="450" y="432" font-family="Inter,Arial,sans-serif" font-size="10" fill="#86efac" text-anchor="middle">Replica Set — self-healing, automatic failover, oplog replication</text>
  <text x="450" y="468" font-family="Inter,Arial,sans-serif" font-size="10" fill="#14532d" text-anchor="middle">ngopidulur.my.id</text>
</svg>
