<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Architectural Thinking vs Design Thinking</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Fundamentals of Software Architecture - Chapter 2</text>
  <!-- Design Thinking -->
  <rect x="80" y="120" width="280" height="240" rx="10" fill="#e74c3c" opacity="0.9"/>
  <text x="220" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Design Thinking</text>
  <text x="220" y="175" font-size="12" text-anchor="middle" fill="#fadbd8">Focus: Function &amp; Features</text>
  <rect x="100" y="190" width="240" height="30" rx="5" fill="#c0392b"/>
  <text x="220" y="210" font-size="11" text-anchor="middle" fill="#ffffff">"How to implement login?"</text>
  <rect x="100" y="230" width="240" height="30" rx="5" fill="#c0392b"/>
  <text x="220" y="250" font-size="11" text-anchor="middle" fill="#ffffff">"Which algorithm to use?"</text>
  <rect x="100" y="270" width="240" height="30" rx="5" fill="#c0392b"/>
  <text x="220" y="290" font-size="11" text-anchor="middle" fill="#ffffff">"How to structure this class?"</text>
  <text x="220" y="325" font-size="11" text-anchor="middle" fill="#fadbd8">Scope: Module | Time: Weeks</text>
  <text x="220" y="345" font-size="11" text-anchor="middle" fill="#fadbd8">Change Cost: Low | Impact: Local</text>
  <!-- Architectural Thinking -->
  <rect x="440" y="120" width="280" height="240" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="580" y="150" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffffff">Architectural Thinking</text>
  <text x="580" y="175" font-size="12" text-anchor="middle" fill="#d5e8f5">Focus: Structure &amp; Relationships</text>
  <rect x="460" y="190" width="240" height="30" rx="5" fill="#2980b9"/>
  <text x="580" y="210" font-size="11" text-anchor="middle" fill="#ffffff">"How does auth work across services?"</text>
  <rect x="460" y="230" width="240" height="30" rx="5" fill="#2980b9"/>
  <text x="580" y="250" font-size="11" text-anchor="middle" fill="#ffffff">"What's the trade-off of microservices?"</text>
  <rect x="460" y="270" width="240" height="30" rx="5" fill="#2980b9"/>
  <text x="580" y="290" font-size="11" text-anchor="middle" fill="#ffffff">"How do we ensure scalability?"</text>
  <text x="580" y="325" font-size="11" text-anchor="middle" fill="#d5e8f5">Scope: System | Time: Years</text>
  <text x="580" y="345" font-size="11" text-anchor="middle" fill="#d5e8f5">Change Cost: High | Impact: Global</text>
  <!-- Key Insight -->
  <rect x="200" y="380" width="400" height="50" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="405" font-size="13" text-anchor="middle" fill="#ffffff">Architecture = Decisions that are HARD to change</text>
</svg>