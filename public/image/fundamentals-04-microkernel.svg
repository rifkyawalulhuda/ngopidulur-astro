<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="mkbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a1a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mkbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Microkernel Architecture</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Core System + Plugins - Fundamentals Chapter 12</text>
  <!-- Core System -->
  <rect x="250" y="110" width="300" height="120" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="400" y="140" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Core System</text>
  <rect x="280" y="155" width="240" height="50" rx="6" fill="#2980b9"/>
  <text x="400" y="180" font-size="12" text-anchor="middle" fill="#ffffff">Minimal Business Logic</text>
  <text x="400" y="195" font-size="10" text-anchor="middle" fill="#d5e8f5">Plugin API + Registry</text>
  <!-- Plugins -->
  <rect x="100" y="260" width="130" height="80" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="165" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Plugin A</text>
  <text x="165" y="310" font-size="10" text-anchor="middle" fill="#d5f5e3">Report Generator</text>
  <rect x="260" y="260" width="130" height="80" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="325" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Plugin B</text>
  <text x="325" y="310" font-size="10" text-anchor="middle" fill="#e8daef">Data Export</text>
  <rect x="420" y="260" width="130" height="80" rx="8" fill="#e67e22" opacity="0.9"/>
  <text x="485" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Plugin C</text>
  <text x="485" y="310" font-size="10" text-anchor="middle" fill="#fdebd0">Email Notification</text>
  <rect x="580" y="260" width="130" height="80" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="645" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Plugin D</text>
  <text x="645" y="310" font-size="10" text-anchor="middle" fill="#fadbd8">Custom Workflow</text>
  <!-- Connections -->
  <line x1="165" y1="260" x2="350" y2="230" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="325" y1="260" x2="375" y2="230" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="485" y1="260" x2="425" y2="230" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="645" y1="260" x2="450" y2="230" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>
  <!-- Trade-offs -->
  <rect x="50" y="370" width="700" height="60" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="395" font-size="13" text-anchor="middle" fill="#ffffff">Extensibility ★★★★★ | Testability ★★★★☆ | Deployability ★★★★☆</text>
  <text x="400" y="415" font-size="11" text-anchor="middle" fill="#bdc3c7">Add plugins without changing core | Examples: VS Code, Eclipse, Rule Engines</text>
</svg>