<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a1a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Main Sequence: Abstractness vs Instability</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Robert C. Martin Metrics - Fundamentals of Software Architecture</text>
  <!-- Main Sequence Line -->
  <line x1="100" y1="350" x2="700" y2="100" stroke="#f39c12" stroke-width="3" stroke-dasharray="10,5"/>
  <text x="400" y="90" font-size="12" text-anchor="middle" fill="#f39c12">Main Sequence (A + I = 1)</text>
  <!-- Zone of Pain -->
  <circle cx="150" cy="320" r="60" fill="#e74c3c" opacity="0.7"/>
  <text x="150" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Zone of</text>
  <text x="150" y="330" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Pain</text>
  <text x="150" y="350" font-size="10" text-anchor="middle" fill="#fadbd8">A=0, I=0</text>
  <text x="150" y="365" font-size="10" text-anchor="middle" fill="#fadbd8">Concrete, Stable</text>
  <!-- Zone of Uselessness -->
  <circle cx="650" cy="130" r="60" fill="#9b59b6" opacity="0.7"/>
  <text x="650" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Zone of</text>
  <text x="650" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Uselessness</text>
  <text x="650" y="160" font-size="10" text-anchor="middle" fill="#e8daef">A=1, I=1</text>
  <text x="650" y="175" font-size="10" text-anchor="middle" fill="#e8daef">Abstract, Unstable</text>
  <!-- Ideal Points -->
  <circle cx="400" cy="225" r="50" fill="#27ae60" opacity="0.8"/>
  <text x="400" y="220" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Ideal</text>
  <text x="400" y="235" font-size="10" text-anchor="middle" fill="#d5f5e3">D ≈ 0</text>
  <text x="400" y="250" font-size="10" text-anchor="middle" fill="#d5f5e3">Near Main Sequence</text>
  <!-- Metrics -->
  <rect x="50" y="380" width="700" height="50" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="405" font-size="12" text-anchor="middle" fill="#ffffff">D = |A + I - 1| | A = Na/Nc | I = Ce/(Ca+Ce) | Target: D → 0</text>
  <!-- Axis Labels -->
  <text x="400" y="390" font-size="12" text-anchor="middle" fill="#7f8c8d">Abstractness (A) →</text>
  <text x="50" y="225" font-size="12" text-anchor="middle" fill="#7f8c8d" transform="rotate(-90 50 225)">Instability (I) →</text>
</svg>