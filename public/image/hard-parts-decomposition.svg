<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Architectural Decomposition</text>
  <text x="400" y="85" font-size="14" text-anchor="middle" fill="#a0a0a0">6 Patterns to Break Monoliths into Microservices</text>
  <!-- Monolith -->
  <rect x="50" y="140" width="200" height="220" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="150" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Monolith</text>
  <rect x="70" y="200" width="160" height="30" rx="4" fill="#c0392b"/>
  <text x="150" y="220" font-size="11" text-anchor="middle" fill="#ffffff">Shared Database</text>
  <rect x="70" y="240" width="160" height="30" rx="4" fill="#c0392b"/>
  <text x="150" y="260" font-size="11" text-anchor="middle" fill="#ffffff">Tight Coupling</text>
  <rect x="70" y="280" width="160" height="30" rx="4" fill="#c0392b"/>
  <text x="150" y="300" font-size="11" text-anchor="middle" fill="#ffffff">Single Deployment</text>
  <!-- Arrow -->
  <line x1="270" y1="250" x2="350" y2="250" stroke="#f39c12" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="350,245 360,250 350,255" fill="#f39c12"/>
  <text x="315" y="240" font-size="12" text-anchor="middle" fill="#f39c12">decompose</text>
  <!-- Microservices -->
  <rect x="380" y="140" width="120" height="60" rx="6" fill="#3498db" opacity="0.9"/>
  <text x="440" y="175" font-size="11" text-anchor="middle" fill="#ffffff">Ticket Service</text>
  <rect x="380" y="210" width="120" height="60" rx="6" fill="#2ecc71" opacity="0.9"/>
  <text x="440" y="245" font-size="11" text-anchor="middle" fill="#ffffff">Customer Service</text>
  <rect x="380" y="280" width="120" height="60" rx="6" fill="#9b59b6" opacity="0.9"/>
  <text x="440" y="315" font-size="11" text-anchor="middle" fill="#ffffff">Billing Service</text>
  <!-- Database per service -->
  <rect x="520" y="150" width="80" height="40" rx="4" fill="#3498db" opacity="0.6"/>
  <text x="560" y="175" font-size="10" text-anchor="middle" fill="#ffffff">TicketDB</text>
  <rect x="520" y="220" width="80" height="40" rx="4" fill="#2ecc71" opacity="0.6"/>
  <text x="560" y="245" font-size="10" text-anchor="middle" fill="#ffffff">CustomerDB</text>
  <rect x="520" y="290" width="80" height="40" rx="4" fill="#9b59b6" opacity="0.6"/>
  <text x="560" y="315" font-size="10" text-anchor="middle" fill="#ffffff">BillingDB</text>
  <!-- Patterns -->
  <rect x="630" y="140" width="140" height="200" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="700" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">6 Patterns</text>
  <text x="700" y="190" font-size="10" text-anchor="middle" fill="#bdc3c7">1. Identify &amp; Size</text>
  <text x="700" y="210" font-size="10" text-anchor="middle" fill="#bdc3c7">2. Gather Domain</text>
  <text x="700" y="230" font-size="10" text-anchor="middle" fill="#bdc3c7">3. Flatten</text>
  <text x="700" y="250" font-size="10" text-anchor="middle" fill="#bdc3c7">4. Dependencies</text>
  <text x="700" y="270" font-size="10" text-anchor="middle" fill="#bdc3c7">5. Create Domains</text>
  <text x="700" y="290" font-size="10" text-anchor="middle" fill="#bdc3c7">6. Create Services</text>
  <text x="400" y="410" font-size="12" text-anchor="middle" fill="#7f8c8d">Software Architecture: The Hard Parts - Chapter 3-5</text>
</svg>