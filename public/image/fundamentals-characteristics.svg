<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Verdana, sans-serif">
  <rect width="900" height="500" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">Architecture Characteristics (Quality Attributes)</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Fundamentals of Software Architecture - Chapter 4-7</text>
  <!-- Three Categories -->
  <rect x="50" y="90" width="260" height="180" rx="10" fill="#3498db" opacity="0.9"/>
  <text x="180" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Operational</text>
  <text x="180" y="145" font-size="11" text-anchor="middle" fill="#d5e8f5">How the system runs</text>
  <rect x="70" y="160" width="220" height="25" rx="4" fill="#2980b9"/>
  <text x="180" y="177" font-size="10" text-anchor="middle" fill="#ffffff">Availability (99.9% uptime)</text>
  <rect x="70" y="195" width="220" height="25" rx="4" fill="#2980b9"/>
  <text x="180" y="212" font-size="10" text-anchor="middle" fill="#ffffff">Performance (response &lt; 200ms)</text>
  <rect x="70" y="230" width="220" height="25" rx="4" fill="#2980b9"/>
  <text x="180" y="247" font-size="10" text-anchor="middle" fill="#ffffff">Scalability (10x users)</text>
  <rect x="320" y="90" width="260" height="180" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="450" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Structural</text>
  <text x="450" y="145" font-size="11" text-anchor="middle" fill="#d5f5e3">How the code is organized</text>
  <rect x="340" y="160" width="220" height="25" rx="4" fill="#27ae60"/>
  <text x="450" y="177" font-size="10" text-anchor="middle" fill="#ffffff">Maintainability (low coupling)</text>
  <rect x="340" y="195" width="220" height="25" rx="4" fill="#27ae60"/>
  <text x="450" y="212" font-size="10" text-anchor="middle" fill="#ffffff">Extensibility (easy to add features)</text>
  <rect x="340" y="230" width="220" height="25" rx="4" fill="#27ae60"/>
  <text x="450" y="247" font-size="10" text-anchor="middle" fill="#ffffff">Testability (easy to test)</text>
  <rect x="590" y="90" width="260" height="180" rx="10" fill="#9b59b6" opacity="0.9"/>
  <text x="720" y="120" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Cross-Cutting</text>
  <text x="720" y="145" font-size="11" text-anchor="middle" fill="#e8daef">Affects all parts</text>
  <rect x="610" y="160" width="220" height="25" rx="4" fill="#8e44ad"/>
  <text x="720" y="177" font-size="10" text-anchor="middle" fill="#ffffff">Security (authentication)</text>
  <rect x="610" y="195" width="220" height="25" rx="4" fill="#8e44ad"/>
  <text x="720" y="212" font-size="10" text-anchor="middle" fill="#ffffff">Privacy (data protection)</text>
  <rect x="610" y="230" width="220" height="25" rx="4" fill="#8e44ad"/>
  <text x="720" y="247" font-size="10" text-anchor="middle" fill="#ffffff">Usability (user experience)</text>
  <!-- Measuring -->
  <rect x="50" y="290" width="800" height="80" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="450" y="315" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Measuring &amp; Governing</text>
  <text x="150" y="340" font-size="11" text-anchor="middle" fill="#bdc3c7">Operational: Uptime, Latency</text>
  <text x="450" y="340" font-size="11" text-anchor="middle" fill="#bdc3c7">Structural: Coupling, Complexity</text>
  <text x="750" y="340" font-size="11" text-anchor="middle" fill="#bdc3c7">Process: Deploy Freq, Lead Time</text>
  <text x="450" y="365" font-size="12" text-anchor="middle" fill="#f39c12">Fitness Functions = Automated Validation</text>
  <!-- Quantum -->
  <rect x="200" y="390" width="500" height="60" rx="8" fill="#1abc9c" opacity="0.8"/>
  <text x="450" y="415" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Architecture Quantum</text>
  <text x="450" y="435" font-size="11" text-anchor="middle" fill="#d1f2eb">Independently Deployable + High Functional Cohesion</text>
  <text x="450" y="470" font-size="11" text-anchor="middle" fill="#7f8c8d">Trade-offs: More quantum = more independence, more complexity</text>
</svg>