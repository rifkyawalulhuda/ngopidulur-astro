<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="100%" stop-color="#302b63"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Reuse Patterns &amp; Data Ownership</text>
  <text x="400" y="85" font-size="14" text-anchor="middle" fill="#a0a0a0">Sharing Code and Data in Microservices</text>
  <!-- 4 Reuse Patterns -->
  <rect x="50" y="130" width="160" height="120" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="130" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Code Replication</text>
  <text x="130" y="180" font-size="10" text-anchor="middle" fill="#ffffff">Copy-paste stable code</text>
  <text x="130" y="200" font-size="10" text-anchor="middle" fill="#7f8c8d">Coupling: None</text>
  <text x="130" y="220" font-size="10" text-anchor="middle" fill="#7f8c8d">Use: Stable utils</text>
  <rect x="230" y="130" width="160" height="120" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="310" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Shared Library</text>
  <text x="310" y="180" font-size="10" text-anchor="middle" fill="#ffffff">JAR/npm package</text>
  <text x="310" y="200" font-size="10" text-anchor="middle" fill="#7f8c8d">Coupling: Medium</text>
  <text x="310" y="220" font-size="10" text-anchor="middle" fill="#7f8c8d">Use: Infrastructure</text>
  <rect x="410" y="130" width="160" height="120" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="490" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Shared Service</text>
  <text x="490" y="180" font-size="10" text-anchor="middle" fill="#ffffff">Separate service</text>
  <text x="490" y="200" font-size="10" text-anchor="middle" fill="#7f8c8d">Coupling: High</text>
  <text x="490" y="220" font-size="10" text-anchor="middle" fill="#7f8c8d">Use: Rare, business</text>
  <rect x="590" y="130" width="160" height="120" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="670" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Sidecar / Mesh</text>
  <text x="670" y="180" font-size="10" text-anchor="middle" fill="#ffffff">Istio, Linkerd</text>
  <text x="670" y="200" font-size="10" text-anchor="middle" fill="#7f8c8d">Coupling: Low</text>
  <text x="670" y="220" font-size="10" text-anchor="middle" fill="#7f8c8d">Use: Cross-cutting</text>
  <!-- Data Ownership -->
  <rect x="50" y="280" width="220" height="100" rx="8" fill="#1abc9c" opacity="0.8"/>
  <text x="160" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Single Ownership</text>
  <text x="160" y="330" font-size="11" text-anchor="middle" fill="#ffffff">One service owns data</text>
  <text x="160" y="350" font-size="10" text-anchor="middle" fill="#7f8c8d">Ideal scenario</text>
  <rect x="290" y="280" width="220" height="100" rx="8" fill="#f39c12" opacity="0.8"/>
  <text x="400" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Common Ownership</text>
  <text x="400" y="330" font-size="11" text-anchor="middle" fill="#ffffff">Shared database</text>
  <text x="400" y="350" font-size="10" text-anchor="middle" fill="#7f8c8d">Avoid if possible</text>
  <rect x="530" y="280" width="220" height="100" rx="8" fill="#e91e63" opacity="0.8"/>
  <text x="640" y="305" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Joint Ownership</text>
  <text x="640" y="330" font-size="11" text-anchor="middle" fill="#ffffff">Table split / Domain</text>
  <text x="640" y="350" font-size="10" text-anchor="middle" fill="#7f8c8d">Delegate technique</text>
  <text x="400" y="410" font-size="12" text-anchor="middle" fill="#7f8c8d">Software Architecture: The Hard Parts - Chapter 8-9</text>
</svg>