<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff" rx="12"/>
  <rect width="900" height="380" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Tiga Arsitektur Parallel — Shared Memory vs Shared Disk vs Shared Nothing</text>
  <!-- Shared Memory -->
  <rect x="30" y="80" width="270" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="165" y="102" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Shared Memory</text>
  <rect x="60" y="115" width="80" height="40" fill="#dbeafe" rx="7" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="100" y="139" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">CPU 1</text>
  <rect x="170" y="115" width="80" height="40" fill="#dbeafe" rx="7" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="210" y="139" font-family="Inter,Arial,sans-serif" font-size="10" fill="#1e40af" text-anchor="middle">CPU 2</text>
  <rect x="60" y="175" width="190" height="45" fill="#e0e7ff" rx="7" stroke="#6366f1" stroke-width="1.5"/>
  <text x="155" y="195" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle" font-weight="700">Shared RAM</text>
  <text x="155" y="210" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#6366f1" text-anchor="middle">semua CPU akses sama</text>
  <rect x="60" y="240" width="190" height="45" fill="#dcfce7" rx="7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="260" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Shared Disk</text>
  <text x="155" y="275" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">satu storage bersama</text>
  <line x1="100" y1="155" x2="155" y2="175" stroke="#6366f1" stroke-width="1.2"/>
  <line x1="210" y1="155" x2="155" y2="175" stroke="#6366f1" stroke-width="1.2"/>
  <line x1="155" y1="220" x2="155" y2="240" stroke="#16a34a" stroke-width="1.2"/>
  <text x="165" y="310" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">contoh: SMP server, multi-core</text>
  <!-- Shared Disk -->
  <rect x="315" y="80" width="270" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="102" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Shared Disk</text>
  <rect x="345" y="115" width="80" height="40" fill="#fef3c7" rx="7" stroke="#d97706" stroke-width="1.5"/>
  <text x="385" y="139" font-family="Inter,Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Node A</text>
  <rect x="470" y="115" width="80" height="40" fill="#fef3c7" rx="7" stroke="#d97706" stroke-width="1.5"/>
  <text x="510" y="139" font-family="Inter,Arial,sans-serif" font-size="10" fill="#92400e" text-anchor="middle">Node B</text>
  <rect x="345" y="175" width="80" height="40" fill="#e0e7ff" rx="7" stroke="#6366f1" stroke-width="1.5"/>
  <text x="385" y="199" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle">RAM A</text>
  <rect x="470" y="175" width="80" height="40" fill="#e0e7ff" rx="7" stroke="#6366f1" stroke-width="1.5"/>
  <text x="510" y="199" font-family="Inter,Arial,sans-serif" font-size="10" fill="#3730a3" text-anchor="middle">RAM B</text>
  <rect x="345" y="240" width="205" height="45" fill="#dcfce7" rx="7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="447" y="260" font-family="Inter,Arial,sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Shared Disk (SAN)</text>
  <text x="447" y="275" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">semua node akses storage sama</text>
  <text x="450" y="310" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">contoh: Oracle RAC, SAN cluster</text>
  <!-- Shared Nothing -->
  <rect x="600" y="80" width="270" height="250" fill="#f8fafc" rx="10" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="735" y="102" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1e293b" text-anchor="middle" font-weight="700">Shared Nothing</text>
  <rect x="630" y="115" width="100" height="50" fill="#fce7f3" rx="7" stroke="#db2777" stroke-width="1.5"/>
  <text x="680" y="135" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9d174d" text-anchor="middle">Node 1</text>
  <text x="680" y="152" font-family="Inter,Arial,sans-serif" font-size="8" fill="#db2777" text-anchor="middle">CPU+RAM+Disk</text>
  <rect x="760" y="115" width="100" height="50" fill="#fce7f3" rx="7" stroke="#db2777" stroke-width="1.5"/>
  <text x="810" y="135" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9d174d" text-anchor="middle">Node 2</text>
  <text x="810" y="152" font-family="Inter,Arial,sans-serif" font-size="8" fill="#db2777" text-anchor="middle">CPU+RAM+Disk</text>
  <rect x="630" y="195" width="100" height="50" fill="#fce7f3" rx="7" stroke="#db2777" stroke-width="1.5"/>
  <text x="680" y="215" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9d174d" text-anchor="middle">Node 3</text>
  <text x="680" y="232" font-family="Inter,Arial,sans-serif" font-size="8" fill="#db2777" text-anchor="middle">CPU+RAM+Disk</text>
  <rect x="760" y="195" width="100" height="50" fill="#fce7f3" rx="7" stroke="#db2777" stroke-width="1.5"/>
  <text x="810" y="215" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9d174d" text-anchor="middle">Node 4</text>
  <text x="810" y="232" font-family="Inter,Arial,sans-serif" font-size="8" fill="#db2777" text-anchor="middle">CPU+RAM+Disk</text>
  <!-- interconnect -->
  <line x1="730" y1="165" x2="760" y2="165" stroke="#db2777" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="680" y1="195" x2="680" y2="245" stroke="#db2777" stroke-width="1.2"/>
  <text x="735" y="270" font-family="Inter,Arial,sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">interconnect (network)</text>
  <text x="735" y="310" font-family="Inter,Arial,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">contoh: Hadoop, Grid, MySQL Cluster</text>
  <!-- Footer -->
  <text x="450" y="360" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Architecture of a Database System (Hellerstein et al. 2007) — Section 3</text>
</svg>
