<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="csbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#csbg)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Choosing Architecture Style</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Decision Matrix - Fundamentals Chapter 18</text>
  <!-- Decision Tree -->
  <rect x="300" y="110" width="200" height="50" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="400" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Team Size &amp; Domain</text>
  <text x="400" y="150" font-size="10" text-anchor="middle" fill="#d5e8f5">Complexity?</text>
  <!-- Small team -->
  <rect x="100" y="180" width="150" height="60" rx="6" fill="#2ecc71" opacity="0.9"/>
  <text x="175" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Small Team</text>
  <text x="175" y="220" font-size="10" text-anchor="middle" fill="#d5f5e3">Simple Domain</text>
  <text x="175" y="235" font-size="10" text-anchor="middle" fill="#d5f5e3">→ Layered</text>
  <!-- Large team -->
  <rect x="550" y="180" width="150" height="60" rx="6" fill="#e74c3c" opacity="0.9"/>
  <text x="625" y="205" font-size="11" font-weight="bold" text-anchor="middle" fill="#ffffff">Large Team</text>
  <text x="625" y="220" font-size="10" text-anchor="middle" fill="#fadbd8">Complex Domain</text>
  <text x="625" y="235" font-size="10" text-anchor="middle" fill="#fadbd8">→ Microservices</text>
  <!-- Middle options -->
  <rect x="250" y="180" width="120" height="60" rx="6" fill="#9b59b6" opacity="0.9"/>
  <text x="310" y="205" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Data Processing</text>
  <text x="310" y="220" font-size="10" text-anchor="middle" fill="#e8daef">→ Pipeline</text>
  <rect x="400" y="180" width="120" height="60" rx="6" fill="#e67e22" opacity="0.9"/>
  <text x="460" y="205" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Product-Based</text>
  <text x="460" y="220" font-size="10" text-anchor="middle" fill="#fdebd0">→ Microkernel</text>
  <!-- Scale requirements -->
  <rect x="250" y="260" width="300" height="50" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="400" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Scale Requirements?</text>
  <!-- High scale -->
  <rect x="100" y="330" width="150" height="50" rx="6" fill="#e74c3c" opacity="0.9"/>
  <text x="175" y="350" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">High Scale</text>
  <text x="175" y="365" font-size="10" text-anchor="middle" fill="#fadbd8">Variable Load</text>
  <text x="175" y="380" font-size="10" text-anchor="middle" fill="#fadbd8">→ Space-Based</text>
  <rect x="250" y="330" width="150" height="50" rx="6" fill="#2ecc71" opacity="0.9"/>
  <text x="325" y="350" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Real-Time</text>
  <text x="325" y="365" font-size="10" text-anchor="middle" fill="#d5f5e3">Event-Heavy</text>
  <text x="325" y="380" font-size="10" text-anchor="middle" fill="#d5f5e3">→ Event-Driven</text>
  <rect x="400" y="330" width="150" height="50" rx="6" fill="#9b59b6" opacity="0.9"/>
  <text x="475" y="350" font-size="10" font-weight="bold" text-anchor="middle" fill="#ffffff">Enterprise</text>
  <text x="475" y="365" font-size="10" text-anchor="middle" fill="#e8daef">Integration</text>
  <text x="475" y="380" font-size="10" text-anchor="middle" fill="#e8daef">→ SOA</text>
  <!-- Connections -->
  <line x1="350" y1="160" x2="175" y2="180" stroke="#f39c12" stroke-width="2"/>
  <line x1="450" y1="160" x2="625" y2="180" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="160" x2="310" y2="180" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="160" x2="460" y2="180" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="310" x2="175" y2="330" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="310" x2="325" y2="330" stroke="#f39c12" stroke-width="2"/>
  <line x1="400" y1="310" x2="475" y2="330" stroke="#f39c12" stroke-width="2"/>
  <!-- Evolution -->
  <rect x="50" y="400" width="700" height="40" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="425" font-size="12" text-anchor="middle" fill="#ffffff">Evolution: Monolith → Service-Based → Microservices → Event-Driven</text>
</svg>