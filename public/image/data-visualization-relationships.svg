<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Verdana, sans-serif">
  <rect width="900" height="550" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">7 Hubungan Data (Data Relationships)</text>
  <text x="450" y="60" font-size="12" text-anchor="middle" fill="#7f8c8d">Setiap hubungan punya format visualisasi yang paling efektif</text>
  <!-- 7 relationships in grid -->
  <rect x="40" y="85" width="260" height="90" rx="8" fill="#3498db" opacity="0.9"/>
  <text x="170" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">1. Part-to-Whole</text>
  <text x="170" y="132" font-size="10" text-anchor="middle" fill="#d5e8f5">Subset vs total</text>
  <text x="170" y="152" font-size="10" text-anchor="middle" fill="#ffffff">→ Pie, Stacked Bar</text>
  <text x="170" y="168" font-size="9" text-anchor="middle" fill="#a0a0a0">% pelanggan beli produk X</text>
  <rect x="320" y="85" width="260" height="90" rx="8" fill="#2ecc71" opacity="0.9"/>
  <text x="450" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">2. Time-Series</text>
  <text x="450" y="132" font-size="10" text-anchor="middle" fill="#d5f5e3">Perubahan sepanjang waktu</text>
  <text x="450" y="152" font-size="10" text-anchor="middle" fill="#ffffff">→ Line, Area</text>
  <text x="450" y="168" font-size="9" text-anchor="middle" fill="#a0a0a0">Penjualan bulanan</text>
  <rect x="600" y="85" width="260" height="90" rx="8" fill="#9b59b6" opacity="0.9"/>
  <text x="730" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">3. Correlation</text>
  <text x="730" y="132" font-size="10" text-anchor="middle" fill="#e8daef">Dua+ variabel terkait</text>
  <text x="730" y="152" font-size="10" text-anchor="middle" fill="#ffffff">→ Scatter, Bubble</text>
  <text x="730" y="168" font-size="9" text-anchor="middle" fill="#a0a0a0">Gaji vs pendidikan</text>
  <rect x="40" y="190" width="260" height="90" rx="8" fill="#e67e22" opacity="0.9"/>
  <text x="170" y="215" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">4. Ranking</text>
  <text x="170" y="237" font-size="10" text-anchor="middle" fill="#fdebd0">Urutan magnitude relatif</text>
  <text x="170" y="257" font-size="10" text-anchor="middle" fill="#ffffff">→ Horizontal Bar</text>
  <text x="170" y="273" font-size="9" text-anchor="middle" fill="#a0a0a0">Produk terlaris</text>
  <rect x="320" y="190" width="260" height="90" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="450" y="215" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">5. Distribution</text>
  <text x="450" y="237" font-size="10" text-anchor="middle" fill="#fadbd8">Sebaran sekitar nilai pusat</text>
  <text x="450" y="257" font-size="10" text-anchor="middle" fill="#ffffff">→ Histogram, Box Plot</text>
  <text x="450" y="273" font-size="9" text-anchor="middle" fill="#a0a0a0">Tinggi pemain basket</text>
  <rect x="600" y="190" width="260" height="90" rx="8" fill="#1abc9c" opacity="0.9"/>
  <text x="730" y="215" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">6. Deviation</text>
  <text x="730" y="237" font-size="10" text-anchor="middle" fill="#d1f2eb">Jarak dari rata-rata</text>
  <text x="730" y="257" font-size="10" text-anchor="middle" fill="#ffffff">→ Bar dengan baseline</text>
  <text x="730" y="273" font-size="9" text-anchor="middle" fill="#a0a0a0">Tiket vs hari hujan</text>
  <rect x="40" y="295" width="260" height="90" rx="8" fill="#34495e" opacity="0.9"/>
  <text x="170" y="320" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">7. Nominal Comparison</text>
  <text x="170" y="342" font-size="10" text-anchor="middle" fill="#bdc3c7">Bandingkan subkategori</text>
  <text x="170" y="362" font-size="10" text-anchor="middle" fill="#ffffff">→ Bar Chart</text>
  <text x="170" y="378" font-size="9" text-anchor="middle" fill="#a0a0a0">Pengunjung berbagai situs</text>
  <!-- Decision helper -->
  <rect x="320" y="295" width="540" height="90" rx="8" fill="#ecf0f1"/>
  <text x="590" y="320" font-size="13" font-weight="bold" text-anchor="middle" fill="#2c3e50">Cara Memilih</text>
  <text x="590" y="342" font-size="11" text-anchor="middle" fill="#34495e">1. Apa pertanyaan bisnis Anda?</text>
  <text x="590" y="360" font-size="11" text-anchor="middle" fill="#34495e">2. Hubungan apa yang ingin ditunjukkan?</text>
  <text x="590" y="378" font-size="11" text-anchor="middle" fill="#34495e">3. Pilih format yang paling akurat</text>
  <text x="450" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Temukan cerita: Trends | Correlations | Outliers</text>
  <text x="450" y="455" font-size="11" text-anchor="middle" fill="#7f8c8d">Data yang salah divisualisasikan = insight hilang</text>
  <text x="450" y="490" font-size="11" text-anchor="middle" fill="#7f8c8d">Pahami hubungan data sebelum memilih chart</text>
</svg>