<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="55%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#312e81"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="url(#bg)"/>
  <!-- Red Hat badge -->
  <rect x="730" y="28" width="140" height="40" fill="#ee0000" rx="6"/>
  <text x="800" y="54" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">Red Hat</text>
  <!-- Title -->
  <text x="450" y="100" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">Microservices for Java Developers</text>
  <text x="450" y="128" font-family="Inter,Arial,sans-serif" font-size="15" fill="#fbbf24" text-anchor="middle">Spring Boot · Dropwizard · WildFly Swarm · Docker · Kubernetes</text>
  <!-- Framework boxes row -->
  <rect x="60" y="165" width="220" height="90" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-width="1.8" rx="12"/>
  <text x="170" y="195" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#67e8f9" text-anchor="middle">Spring Boot</text>
  <text x="170" y="215" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#a5f3fc" text-anchor="middle">Auto-configuration</text>
  <text x="170" y="230" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#a5f3fc" text-anchor="middle">Starter Dependencies</text>
  <text x="170" y="245" font-family="Inter,Arial,sans-serif" font-size="9" fill="#67e8f9" text-anchor="middle">Self-contained JAR</text>
  <rect x="340" y="165" width="220" height="90" fill="rgba(52,211,153,0.15)" stroke="#34d399" stroke-width="1.8" rx="12"/>
  <text x="450" y="195" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#6ee7b7" text-anchor="middle">Dropwizard</text>
  <text x="450" y="215" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Jetty + Jersey</text>
  <text x="450" y="230" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#a7f3d0" text-anchor="middle">Metrics + Health</text>
  <text x="450" y="245" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">Fat JAR</text>
  <rect x="620" y="165" width="220" height="90" fill="rgba(251,146,60,0.15)" stroke="#fb923c" stroke-width="1.8" rx="12"/>
  <text x="730" y="195" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#fdba74" text-anchor="middle">WildFly Swarm</text>
  <text x="730" y="215" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#fed7aa" text-anchor="middle">Uber JAR</text>
  <text x="730" y="230" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#fed7aa" text-anchor="middle">JBoss Forge</text>
  <text x="730" y="245" font-family="Inter,Arial,sans-serif" font-size="9" fill="#fdba74" text-anchor="middle">Java EE Features</text>
  <!-- Arrow down -->
  <line x1="450" y1="270" x2="450" y2="300" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arr)"/>
  <!-- Deploy -->
  <rect x="200" y="305" width="500" height="80" fill="rgba(251,191,36,0.12)" stroke="#fbbf24" stroke-width="2" rx="12"/>
  <text x="450" y="335" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#fde68a" text-anchor="middle">Docker · Kubernetes · Cluster</text>
  <text x="450" y="356" font-family="Inter,Arial,sans-serif" font-size="10.5" fill="#fef3c7" text-anchor="middle">Immutable delivery · Pods · Replication · Failover · Load Balancing</text>
  <text x="450" y="372" font-family="Inter,Arial,sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">Netflix OSS · Circuit Breaker · Bulkhead</text>
  <!-- Footer -->
  <text x="450" y="425" font-family="Inter,Arial,sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">James Cross · 7 Chapter Hands-On</text>
  <text x="450" y="445" font-family="Inter,Arial,sans-serif" font-size="10" fill="#64748b" text-anchor="middle">ngopidulur.my.id</text>
</svg>
