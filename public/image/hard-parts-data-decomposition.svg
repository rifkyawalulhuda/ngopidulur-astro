<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a1a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Data Decomposition</text>
  <text x="400" y="85" font-size="14" text-anchor="middle" fill="#a0a0a0">Breaking the Monolithic Database</text>
  <!-- Shared DB -->
  <rect x="60" y="150" width="180" height="200" rx="8" fill="#e74c3c" opacity="0.9"/>
  <text x="150" y="180" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Shared Database</text>
  <rect x="80" y="200" width="140" height="25" rx="3" fill="#c0392b"/>
  <text x="150" y="217" font-size="10" text-anchor="middle" fill="#ffffff">tickets + customers</text>
  <rect x="80" y="235" width="140" height="25" rx="3" fill="#c0392b"/>
  <text x="150" y="252" font-size="10" text-anchor="middle" fill="#ffffff">invoices + reports</text>
  <rect x="80" y="270" width="140" height="25" rx="3" fill="#c0392b"/>
  <text x="150" y="287" font-size="10" text-anchor="middle" fill="#ffffff">FK constraints</text>
  <rect x="80" y="305" width="140" height="25" rx="3" fill="#c0392b"/>
  <text x="150" y="322" font-size="10" text-anchor="middle" fill="#ffffff">ACID transactions</text>
  <!-- Arrow -->
  <line x1="260" y1="250" x2="340" y2="250" stroke="#f39c12" stroke-width="3" stroke-dasharray="8,4"/>
  <polygon points="340,245 350,250 340,255" fill="#f39c12"/>
  <text x="300" y="240" font-size="12" text-anchor="middle" fill="#f39c12">decompose</text>
  <!-- Service DBs -->
  <rect x="380" y="130" width="120" height="70" rx="6" fill="#3498db" opacity="0.9"/>
  <text x="440" y="160" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Ticket Service</text>
  <text x="440" y="180" font-size="10" text-anchor="middle" fill="#ffffff">ticket_db</text>
  <rect x="380" y="215" width="120" height="70" rx="6" fill="#2ecc71" opacity="0.9"/>
  <text x="440" y="245" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Customer Service</text>
  <text x="440" y="265" font-size="10" text-anchor="middle" fill="#ffffff">customer_db</text>
  <rect x="380" y="300" width="120" height="70" rx="6" fill="#9b59b6" opacity="0.9"/>
  <text x="440" y="330" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Billing Service</text>
  <text x="440" y="350" font-size="10" text-anchor="middle" fill="#ffffff">billing_db</text>
  <!-- Polyglot -->
  <rect x="530" y="150" width="110" height="50" rx="6" fill="#1abc9c" opacity="0.8"/>
  <text x="585" y="180" font-size="11" text-anchor="middle" fill="#ffffff">PostgreSQL</text>
  <rect x="530" y="220" width="110" height="50" rx="6" fill="#e67e22" opacity="0.8"/>
  <text x="585" y="250" font-size="11" text-anchor="middle" fill="#ffffff">MongoDB</text>
  <rect x="530" y="290" width="110" height="50" rx="6" fill="#e91e63" opacity="0.8"/>
  <text x="585" y="320" font-size="11" text-anchor="middle" fill="#ffffff">Redis</text>
  <text x="585" y="365" font-size="12" text-anchor="middle" fill="#7f8c8d">Polyglot Persistence</text>
  <!-- 5 Steps -->
  <rect x="670" y="130" width="110" height="240" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="725" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">5 Steps</text>
  <text x="725" y="180" font-size="10" text-anchor="middle" fill="#bdc3c7">1. Analyze</text>
  <text x="725" y="200" font-size="10" text-anchor="middle" fill="#bdc3c7">2. Assign</text>
  <text x="725" y="220" font-size="10" text-anchor="middle" fill="#bdc3c7">3. Separate</text>
  <text x="725" y="240" font-size="10" text-anchor="middle" fill="#bdc3c7">4. Move</text>
  <text x="725" y="260" font-size="10" text-anchor="middle" fill="#bdc3c7">5. Switch Over</text>
  <text x="400" y="410" font-size="12" text-anchor="middle" fill="#7f8c8d">Software Architecture: The Hard Parts - Chapter 6-7</text>
</svg>