<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#ffffff" rx="12" ry="12"/>
  <rect width="900" height="400" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12" ry="12"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12" ry="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">UFT API Testing — Linking Test Steps</text>

  <!-- Step 1: GetFlights -->
  <rect x="50" y="80" width="180" height="80" fill="#e0e7ff" rx="10" ry="10" stroke="#6366f1" stroke-width="2"/>
  <rect x="50" y="80" width="180" height="26" fill="#6366f1" rx="10" ry="10"/>
  <rect x="50" y="93" width="180" height="13" fill="#6366f1"/>
  <text x="140" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Step 1: GetFlights</text>
  <text x="60" y="125" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#3730a3">Input: City = Denver</text>
  <text x="60" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#3730a3">Input: Date = 2024-01-15</text>
  <text x="60" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#16a34a" font-weight="600">Output: FlightNumber</text>

  <!-- Arrow from Step1 to Step2 -->
  <line x1="230" y1="157" x2="340" y2="230" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <rect x="245" y="175" width="90" height="22" fill="#f0fdf4" rx="4" stroke="#16a34a" stroke-width="1"/>
  <text x="290" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="600">FlightNumber →</text>

  <!-- Step 2: CreateFlightOrder -->
  <rect x="340" y="190" width="200" height="90" fill="#fef3c7" rx="10" ry="10" stroke="#f59e0b" stroke-width="2"/>
  <rect x="340" y="190" width="200" height="26" fill="#f59e0b" rx="10" ry="10"/>
  <rect x="340" y="203" width="200" height="13" fill="#f59e0b"/>
  <text x="440" y="208" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Step 2: CreateFlightOrder</text>
  <text x="350" y="235" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#92400e">Input: FlightNumber (linked)</text>
  <text x="350" y="250" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#92400e">Input: Class = Business</text>
  <text x="350" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#16a34a" font-weight="600">Output: OrderID</text>
  <text x="350" y="278" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#16a34a" font-weight="600">Output: TotalPrice</text>

  <!-- Arrow from Step2 to Step3 -->
  <line x1="540" y1="235" x2="630" y2="150" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrOrange)"/>
  <rect x="545" y="170" width="80" height="22" fill="#fff7ed" rx="4" stroke="#f59e0b" stroke-width="1"/>
  <text x="585" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5" fill="#b45309" text-anchor="middle" font-weight="600">OrderID →</text>

  <!-- Step 3: Checkpoint -->
  <rect x="630" y="80" width="210" height="80" fill="#dcfce7" rx="10" ry="10" stroke="#16a34a" stroke-width="2"/>
  <rect x="630" y="80" width="210" height="26" fill="#16a34a" rx="10" ry="10"/>
  <rect x="630" y="93" width="210" height="13" fill="#16a34a"/>
  <text x="735" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Step 3: Checkpoint</text>
  <text x="640" y="125" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#166534">Verify: OrderID not null</text>
  <text x="640" y="140" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#166534">Verify: TotalPrice &gt; 0</text>
  <text x="640" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#166534">Verify: Status = Confirmed</text>

  <!-- Legend -->
  <rect x="50" y="320" width="800" height="60" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>
  <text x="70" y="342" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#475569" font-weight="700">Keterangan:</text>
  <line x1="70" y1="358" x2="110" y2="358" stroke="#6366f1" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="118" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">Output Step 1 → Input Step 2 (linked)</text>
  <line x1="370" y1="358" x2="410" y2="358" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="418" y="362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">Output Step 2 → Checkpoint (linked)</text>
  <rect x="620" y="349" width="12" height="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" rx="2"/>
  <text x="638" y="361" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" fill="#475569">Checkpoint = Validasi hasil</text>
</svg>
