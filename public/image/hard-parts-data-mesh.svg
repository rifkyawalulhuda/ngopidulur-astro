<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="Verdana, sans-serif">
  <rect width="900" height="550" fill="#f8f9fa"/>
  <text x="450" y="35" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">Data Mesh Architecture</text>
  <text x="450" y="58" font-size="12" text-anchor="middle" fill="#6c757d">Domain-oriented decentralized data ownership</text>

  <!-- Old approaches -->
  <rect x="50" y="90" width="380" height="140" rx="8" fill="#f8d7da" stroke="#dc3545" stroke-width="1"/>
  <text x="240" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#721c24">Traditional: Data Warehouse / Lake</text>
  <rect x="70" y="135" width="340" height="40" rx="5" fill="#ffffff" stroke="#dc3545" stroke-width="1"/>
  <text x="240" y="160" font-size="10" text-anchor="middle" fill="#721c24">Centralized team owns all data</text>
  <rect x="70" y="185" width="340" height="30" rx="5" fill="#ffffff" stroke="#dc3545" stroke-width="1"/>
  <text x="240" y="205" font-size="9" text-anchor="middle" fill="#721c24">Bottleneck · Slow · Doesn't scale</text>

  <!-- Arrow -->
  <line x1="430" y1="160" x2="470" y2="160" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="450" y="150" font-size="10" text-anchor="middle" fill="#495057">evolves to</text>

  <!-- Data Mesh -->
  <rect x="470" y="90" width="380" height="140" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="2"/>
  <text x="660" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#155724">Data Mesh</text>
  <rect x="490" y="135" width="160" height="40" rx="5" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="570" y="160" font-size="9" text-anchor="middle" fill="#155724">Domain A owns data</text>
  <rect x="660" y="135" width="160" height="40" rx="5" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="740" y="160" font-size="9" text-anchor="middle" fill="#155724">Domain B owns data</text>
  <rect x="490" y="185" width="330" height="30" rx="5" fill="#ffffff" stroke="#28a745" stroke-width="1"/>
  <text x="655" y="205" font-size="9" text-anchor="middle" fill="#155724">Data as Product · Self-serve · Federated governance</text>

  <!-- 4 Principles -->
  <text x="450" y="270" font-size="15" font-weight="bold" text-anchor="middle" fill="#212529">Four Principles of Data Mesh</text>

  <rect x="50" y="295" width="380" height="100" rx="8" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="240" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d6efd">1. Domain Ownership</text>
  <text x="240" y="342" font-size="10" text-anchor="middle" fill="#212529">Domain teams own their data end-to-end</text>
  <text x="240" y="360" font-size="10" text-anchor="middle" fill="#212529">Not a centralized data team</text>

  <rect x="450" y="295" width="400" height="100" rx="8" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
  <text x="650" y="320" font-size="12" font-weight="bold" text-anchor="middle" fill="#0d6efd">2. Data as a Product</text>
  <text x="650" y="342" font-size="10" text-anchor="middle" fill="#212529">Data treated as product with SLA</text>
  <text x="650" y="360" font-size="10" text-anchor="middle" fill="#212529">Discoverable, trustworthy, self-describing</text>

  <rect x="50" y="410" width="380" height="100" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="240" y="435" font-size="12" font-weight="bold" text-anchor="middle" fill="#155724">3. Self-Serve Infrastructure</text>
  <text x="240" y="457" font-size="10" text-anchor="middle" fill="#212529">Platform team provides tools</text>
  <text x="240" y="475" font-size="10" text-anchor="middle" fill="#212529">Domain teams build data products independently</text>

  <rect x="450" y="410" width="400" height="100" rx="8" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="650" y="435" font-size="12" font-weight="bold" text-anchor="middle" fill="#155724">4. Federated Governance</text>
  <text x="650" y="457" font-size="10" text-anchor="middle" fill="#212529">Global standards, local implementation</text>
  <text x="650" y="475" font-size="10" text-anchor="middle" fill="#212529">Interoperability between domains</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#495057"/>
    </marker>
  </defs>
</svg>
