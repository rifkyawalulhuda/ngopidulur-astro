  <text x="90" y="348" font-family="monospace" font-size="12.5" fill="#e6edf3">posts = Post.objects.</text>
  <text x="90" y="348" font-family="monospace" font-size="12.5" fill="#e6edf3">posts = Post.objects.</text>
