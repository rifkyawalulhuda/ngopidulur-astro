<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#ffffff" rx="12"/>
  <rect width="900" height="340" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="12"/>
  <rect x="0" y="0" width="900" height="44" fill="#4f46e5" rx="12"/>
  <rect x="0" y="22" width="900" height="22" fill="#4f46e5"/>
  <text x="450" y="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DevOps Capabilities — Continuous Everything</text>
  <!-- 6 boxes in circle flow -->
  <rect x="40" y="90" width="230" height="80" fill="#e0e7ff" rx="10" stroke="#6366f1" stroke-width="1.8"/>
  <text x="155" y="120" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="700">1. Continuous Business</text>
  <text x="155" y="137" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3730a3" text-anchor="middle" font-weight="700">Planning</text>
  <text x="155" y="155" font-family="Inter,Arial,sans-serif" font-size="9" fill="#6366f1" text-anchor="middle">roadmap, backlog, prioritasi</text>
  <rect x="40" y="200" width="230" height="80" fill="#dbeafe" rx="10" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="155" y="230" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">2. Continuous Integration</text>
  <text x="155" y="247" font-family="Inter,Arial,sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">&amp; Collaborative Dev</text>
  <text x="155" y="265" font-family="Inter,Arial,sans-serif" font-size="9" fill="#3b82f6" text-anchor="middle">build otomatis setiap commit</text>
  <rect x="335" y="90" width="230" height="80" fill="#dcfce7" rx="10" stroke="#16a34a" stroke-width="1.8"/>
  <text x="450" y="120" font-family="Inter,Arial,sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">3. Continuous Testing</text>
  <text x="450" y="155" font-family="Inter,Arial,sans-serif" font-size="9" fill="#15803d" text-anchor="middle">unit, integration, contract, E2E</text>
  <rect x="335" y="200" width="230" height="80" fill="#fef3c7" rx="10" stroke="#d97706" stroke-width="1.8"/>
  <text x="450" y="230" font-family="Inter,Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">4. Continuous Release</text>
  <text x="450" y="247" font-family="Inter,Arial,sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700">&amp; Deployment</text>
  <text x="450" y="265" font-family="Inter,Arial,sans-serif" font-size="9" fill="#b45309" text-anchor="middle">pipeline delivery otomatis</text>
  <rect x="630" y="90" width="230" height="80" fill="#fce7f3" rx="10" stroke="#db2777" stroke-width="1.8"/>
  <text x="745" y="120" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="700">5. Continuous</text>
  <text x="745" y="137" font-family="Inter,Arial,sans-serif" font-size="12" fill="#9d174d" text-anchor="middle" font-weight="700">Monitoring</text>
  <text x="745" y="155" font-family="Inter,Arial,sans-serif" font-size="9" fill="#db2777" text-anchor="middle">metrics, logs, alerts</text>
  <rect x="630" y="200" width="230" height="80" fill="#f3e8ff" rx="10" stroke="#9333ea" stroke-width="1.8"/>
  <text x="745" y="230" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">6. Continuous Customer</text>
  <text x="745" y="247" font-family="Inter,Arial,sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">Feedback &amp; Optimization</text>
  <text x="745" y="265" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9333ea" text-anchor="middle">loop feedback ke planning</text>
  <!-- Arrows -->
  <line x1="270" y1="130" x2="335" y2="130" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="565" y1="130" x2="630" y2="130" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="270" y1="240" x2="335" y2="240" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="565" y1="240" x2="630" y2="240" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Vertical arrows -->
  <line x1="155" y1="170" x2="155" y2="200" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="170" x2="450" y2="200" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="745" y1="170" x2="745" y2="200" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Feedback loop -->
  <path d="M 745 280 L 745 300 L 155 300 L 155 280" fill="none" stroke="#9333ea" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="450" y="315" font-family="Inter,Arial,sans-serif" font-size="9.5" fill="#6b21a8" text-anchor="middle" font-weight="600">feedback loop: monitoring → planning → iterasi berikutnya</text>
  <!-- Footer -->
  <text x="450" y="335" font-family="Inter,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Microservices from Theory to Practice (IBM Redbooks 2016)</text>
</svg>
