<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="pbg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#4a1a6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pbg2)"/>
  <text x="400" y="50" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">Architect Personalities</text>
  <text x="400" y="80" font-size="14" text-anchor="middle" fill="#a0a0a0">Three Types - Fundamentals Chapter 22</text>
  <!-- Control Freak -->
  <rect x="80" y="120" width="200" height="200" rx="10" fill="#e74c3c" opacity="0.9"/>
  <text x="180" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Control Freak</text>
  <text x="180" y="175" font-size="11" text-anchor="middle" fill="#fadbd8">Micro-manages everything</text>
  <rect x="100" y="190" width="160" height="30" rx="4" fill="#c0392b"/>
  <text x="180" y="210" font-size="10" text-anchor="middle" fill="#ffffff">Every decision needs approval</text>
  <rect x="100" y="230" width="160" height="30" rx="4" fill="#c0392b"/>
  <text x="180" y="250" font-size="10" text-anchor="middle" fill="#ffffff">Team doesn't grow</text>
  <rect x="100" y="270" width="160" height="30" rx="4" fill="#c0392b"/>
  <text x="180" y="290" font-size="10" text-anchor="middle" fill="#ffffff">Bottleneck on all decisions</text>
  <text x="180" y="315" font-size="11" text-anchor="middle" fill="#fadbd8">Result: Burnout, slow team</text>
  <!-- Armchair -->
  <rect x="300" y="120" width="200" height="200" rx="10" fill="#f39c12" opacity="0.9"/>
  <text x="400" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Armchair Architect</text>
  <text x="400" y="175" font-size="11" text-anchor="middle" fill="#fdebd0">Not hands-on</text>
  <rect x="320" y="190" width="160" height="30" rx="4" fill="#e67e22"/>
  <text x="400" y="210" font-size="10" text-anchor="middle" fill="#ffffff">Theoretical, not practical</text>
  <rect x="320" y="230" width="160" height="30" rx="4" fill="#e67e22"/>
  <text x="400" y="250" font-size="10" text-anchor="middle" fill="#ffffff">Rarely codes</text>
  <rect x="320" y="270" width="160" height="30" rx="4" fill="#e67e22"/>
  <text x="400" y="290" font-size="10" text-anchor="middle" fill="#ffffff">Loses credibility</text>
  <text x="400" y="315" font-size="11" text-anchor="middle" fill="#fdebd0">Result: Ivory tower, poor decisions</text>
  <!-- Effective -->
  <rect x="520" y="120" width="200" height="200" rx="10" fill="#2ecc71" opacity="0.9"/>
  <text x="620" y="150" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Effective Architect</text>
  <text x="620" y="175" font-size="11" text-anchor="middle" fill="#d5f5e3">Balanced approach</text>
  <rect x="540" y="190" width="160" height="30" rx="4" fill="#27ae60"/>
  <text x="620" y="210" font-size="10" text-anchor="middle" fill="#ffffff">Hands-on but not micro</text>
  <rect x="540" y="230" width="160" height="30" rx="4" fill="#27ae60"/>
  <text x="620" y="250" font-size="10" text-anchor="middle" fill="#ffffff">Guides and mentors</text>
  <rect x="540" y="270" width="160" height="30" rx="4" fill="#27ae60"/>
  <text x="620" y="290" font-size="10" text-anchor="middle" fill="#ffffff">Makes team better</text>
  <text x="620" y="315" font-size="11" text-anchor="middle" fill="#d5f5e3">Result: Growing team, good decisions</text>
  <!-- Key -->
  <rect x="150" y="350" width="500" height="60" rx="8" fill="#34495e" opacity="0.8"/>
  <text x="400" y="375" font-size="13" text-anchor="middle" fill="#ffffff">Goal: Be an Effective Architect</text>
  <text x="400" y="395" font-size="11" text-anchor="middle" fill="#bdc3c7">Balance hands-on with delegation | Make the team better, not yourself indispensable</text>
</svg>