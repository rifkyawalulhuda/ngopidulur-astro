<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e65c00"/>
      <stop offset="100%" style="stop-color:#f9d423"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a73e8"/>
      <stop offset="100%" style="stop-color:#4285f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#orange)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#orange)"/>

  <!-- Left: Code visualization -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="440" height="490" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="440" height="32" rx="10" fill="#161b22"/>
    <rect x="0" y="20" width="440" height="12" fill="#161b22"/>
    <circle cx="22" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="42" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="62" cy="16" r="5" fill="#27c93f"/>
    <text x="200" y="20" font-family="monospace" font-size="10" fill="#6e7681" text-anchor="middle">Python ML — scikit-learn</text>

    <!-- Code lines -->
    <text x="16" y="58" font-family="monospace" font-size="11" fill="#ff7b72">from</text>
    <text x="56" y="58" font-family="monospace" font-size="11" fill="#e6edf3"> sklearn.model_selection </text>
    <text x="56" y="58" font-family="monospace" font-size="11" fill="#ff7b72" dx="195">import</text>
    <text x="16" y="74" font-family="monospace" font-size="11" fill="#e6edf3">    train_test_split, cross_val_score</text>

    <text x="16" y="96" font-family="monospace" font-size="11" fill="#ff7b72">from</text>
    <text x="56" y="96" font-family="monospace" font-size="11" fill="#e6edf3"> sklearn.pipeline </text>
    <text x="56" y="96" font-family="monospace" font-size="11" fill="#ff7b72" dx="135">import</text>
    <text x="56" y="96" font-family="monospace" font-size="11" fill="#e6edf3" dx="200"> Pipeline</text>

    <text x="16" y="118" font-family="monospace" font-size="11" fill="#ff7b72">from</text>
    <text x="56" y="118" font-family="monospace" font-size="11" fill="#e6edf3"> sklearn.preprocessing </text>
    <text x="56" y="118" font-family="monospace" font-size="11" fill="#ff7b72" dx="175">import</text>
    <text x="16" y="134" font-family="monospace" font-size="11" fill="#e6edf3">    StandardScaler</text>

    <text x="16" y="156" font-family="monospace" font-size="11" fill="#3fb950"># Build pipeline</text>
    <text x="16" y="172" font-family="monospace" font-size="11" fill="#e6edf3">pipe = </text>
    <text x="16" y="172" font-family="monospace" font-size="11" fill="#d2a8ff" dx="54">Pipeline</text>
    <text x="16" y="172" font-family="monospace" font-size="11" fill="#e6edf3" dx="119">([</text>
    <text x="16" y="188" font-family="monospace" font-size="11" fill="#e6edf3">    (</text>
    <text x="16" y="188" font-family="monospace" font-size="11" fill="#a5d6ff" dx="32">'scaler'</text>
    <text x="16" y="188" font-family="monospace" font-size="11" fill="#e6edf3" dx="100">, </text>
    <text x="16" y="188" font-family="monospace" font-size="11" fill="#d2a8ff" dx="118">StandardScaler</text>
    <text x="16" y="188" font-family="monospace" font-size="11" fill="#e6edf3" dx="239">()),</text>
    <text x="16" y="204" font-family="monospace" font-size="11" fill="#e6edf3">    (</text>
    <text x="16" y="204" font-family="monospace" font-size="11" fill="#a5d6ff" dx="32">'svm'</text>
    <text x="16" y="204" font-family="monospace" font-size="11" fill="#e6edf3" dx="83">, </text>
    <text x="16" y="204" font-family="monospace" font-size="11" fill="#d2a8ff" dx="100">SVC</text>
    <text x="16" y="204" font-family="monospace" font-size="11" fill="#e6edf3" dx="130">())</text>
    <text x="16" y="220" font-family="monospace" font-size="11" fill="#e6edf3">])</text>

    <text x="16" y="244" font-family="monospace" font-size="11" fill="#3fb950"># Cross-validation</text>
    <text x="16" y="260" font-family="monospace" font-size="11" fill="#e6edf3">scores = </text>
    <text x="16" y="260" font-family="monospace" font-size="11" fill="#d2a8ff" dx="68">cross_val_score</text>
    <text x="16" y="260" font-family="monospace" font-size="11" fill="#e6edf3" dx="189">(pipe,</text>
    <text x="16" y="276" font-family="monospace" font-size="11" fill="#e6edf3">    X, y, cv=</text>
    <text x="16" y="276" font-family="monospace" font-size="11" fill="#79c0ff" dx="80">5</text>
    <text x="16" y="276" font-family="monospace" font-size="11" fill="#e6edf3" dx="88">)</text>

    <text x="16" y="300" font-family="monospace" font-size="11" fill="#3fb950"># Grid Search</text>
    <text x="16" y="316" font-family="monospace" font-size="11" fill="#e6edf3">param_grid = {</text>
    <text x="16" y="332" font-family="monospace" font-size="11" fill="#a5d6ff">    'svm__C'</text>
    <text x="16" y="332" font-family="monospace" font-size="11" fill="#e6edf3" dx="95">: [</text>
    <text x="16" y="332" font-family="monospace" font-size="11" fill="#79c0ff" dx="118">0.1, 1, 10</text>
    <text x="16" y="332" font-family="monospace" font-size="11" fill="#e6edf3" dx="218">],</text>
    <text x="16" y="348" font-family="monospace" font-size="11" fill="#a5d6ff">    'svm__gamma'</text>
    <text x="16" y="348" font-family="monospace" font-size="11" fill="#e6edf3" dx="110">: [</text>
    <text x="16" y="348" font-family="monospace" font-size="11" fill="#79c0ff" dx="135">0.01, 0.1</text>
    <text x="16" y="348" font-family="monospace" font-size="11" fill="#e6edf3" dx="223">]</text>
    <text x="16" y="364" font-family="monospace" font-size="11" fill="#e6edf3">}</text>

    <!-- Output section -->
    <rect x="0" y="390" width="440" height="100" rx="0" fill="#0a0f1a"/>
    <text x="16" y="410" font-family="monospace" font-size="10" fill="#3fb950">Output:</text>
    <text x="16" y="428" font-family="monospace" font-size="10" fill="#e6edf3">CV scores: [0.967 1.000 0.933 0.967 1.000]</text>
    <text x="16" y="444" font-family="monospace" font-size="10" fill="#e6edf3">Mean accuracy: 0.973 (+/- 0.024)</text>
    <text x="16" y="460" font-family="monospace" font-size="10" fill="#e6edf3">Best params: {'svm__C': 10, 'svm__gamma': 0.1}</text>
    <text x="16" y="476" font-family="monospace" font-size="10" fill="#ffa657">Test score: 0.979</text>
  </g>

  <!-- Right: Title block -->
  <text x="560" y="130" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681" letter-spacing="4">ANDREAS MULLER &amp; SARAH GUIDO</text>
  <text x="560" y="180" font-family="'Segoe UI', sans-serif" font-size="36" fill="#f0f6fc" font-weight="800" letter-spacing="-1">Introduction to</text>
  <text x="560" y="224" font-family="'Segoe UI', sans-serif" font-size="36" fill="url(#orange)" font-weight="800" letter-spacing="-1">Machine Learning</text>
  <text x="560" y="268" font-family="'Segoe UI', sans-serif" font-size="36" fill="url(#blue)" font-weight="800" letter-spacing="-1">with Python</text>
  <rect x="560" y="282" width="230" height="4" rx="2" fill="url(#orange)"/>

  <text x="560" y="316" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">O'Reilly — Muller &amp; Guido (2017)</text>
  <text x="560" y="338" font-family="'Segoe UI', sans-serif" font-size="14" fill="#8b949e">Panduan Lengkap Bahasa Indonesia</text>

  <!-- Topics pills -->
  <g transform="translate(560, 362)">
    <rect x="0" y="0" width="65" height="26" rx="13" fill="#1a1206"/>
    <text x="32" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ffa657" text-anchor="middle">scikit-learn</text>
    <rect x="77" y="0" width="50" height="26" rx="13" fill="#0d1a30"/>
    <text x="102" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4285f4" text-anchor="middle">KNN</text>
    <rect x="139" y="0" width="50" height="26" rx="13" fill="#0d1a30"/>
    <text x="164" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4285f4" text-anchor="middle">SVM</text>
    <rect x="201" y="0" width="80" height="26" rx="13" fill="#061a10"/>
    <text x="241" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#3fb950" text-anchor="middle">Random Forest</text>

    <rect x="0" y="36" width="115" height="26" rx="13" fill="#1a0612"/>
    <text x="57" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f87171" text-anchor="middle">Neural Networks</text>
    <rect x="127" y="36" width="75" height="26" rx="13" fill="#0d1a30"/>
    <text x="164" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#60a5fa" text-anchor="middle">Clustering</text>
    <rect x="214" y="36" width="60" height="26" rx="13" fill="#1a1206"/>
    <text x="244" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Pipeline</text>
  </g>

  <!-- Series list -->
  <g transform="translate(560, 460)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.1  Pengantar, scikit-learn, Iris, Overfitting/Underfitting</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.2  KNN, Linear Models, Decision Tree, Random Forest</text>
    <text x="0" y="36" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.3  SVM, Neural Networks, Probabilitas Prediksi</text>
    <text x="0" y="54" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.4  Unsupervised: PCA, NMF, t-SNE, Clustering, Feature Eng</text>
    <text x="0" y="72" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.5  Evaluasi, Grid Search, Pipeline, NLP/Teks</text>
  </g>

  <text x="570" y="600" font-family="'Segoe UI', sans-serif" font-size="12" fill="#30363d">ngopidulur.my.id</text>

  <!-- Glow -->
  <circle cx="1150" cy="100" r="100" fill="#e65c00" opacity="0.04"/>
</svg>
