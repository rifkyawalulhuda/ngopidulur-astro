<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c18"/>
      <stop offset="100%" style="stop-color:#0f1829"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285f4"/>
      <stop offset="100%" style="stop-color:#1a73e8"/>
    </linearGradient>
    <linearGradient id="multi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ea4335"/>
      <stop offset="33%" style="stop-color:#fbbc04"/>
      <stop offset="66%" style="stop-color:#34a853"/>
      <stop offset="100%" style="stop-color:#4285f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#multi)"/>
  <rect x="0" y="626" width="1200" height="4" fill="url(#multi)"/>

  <!-- Left: Prompt visualization -->
  <g transform="translate(55, 75)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="460" height="480" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect x="0" y="0" width="460" height="34" rx="10" fill="#161b22"/>
    <rect x="0" y="20" width="460" height="14" fill="#161b22"/>
    <circle cx="24" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="44" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="64" cy="17" r="5" fill="#27c93f"/>
    <text x="200" y="21" font-family="monospace" font-size="10" fill="#6e7681" text-anchor="middle">Gemini — Vertex AI</text>

    <!-- Prompt sections -->
    <rect x="16" y="50" width="428" height="24" rx="4" fill="#1f2d1a"/>
    <text x="24" y="66" font-family="monospace" font-size="11" fill="#4ade80">SYSTEM</text>
    <text x="88" y="66" font-family="monospace" font-size="11" fill="#e6edf3">You are a helpful assistant...</text>

    <rect x="16" y="84" width="428" height="24" rx="4" fill="#1a1f2d"/>
    <text x="24" y="100" font-family="monospace" font-size="11" fill="#60a5fa">CONTEXT</text>
    <text x="98" y="100" font-family="monospace" font-size="11" fill="#e6edf3">User is asking about...</text>

    <rect x="16" y="118" width="428" height="24" rx="4" fill="#2d1a1f"/>
    <text x="24" y="134" font-family="monospace" font-size="11" fill="#f87171">EXAMPLES</text>
    <text x="104" y="134" font-family="monospace" font-size="11" fill="#e6edf3">Input: "..." → Output: "..."</text>

    <rect x="16" y="152" width="428" height="24" rx="4" fill="#2d2a1a"/>
    <text x="24" y="168" font-family="monospace" font-size="11" fill="#fbbf24">PROMPT</text>
    <text x="92" y="168" font-family="monospace" font-size="11" fill="#e6edf3">Classify the following text...</text>

    <!-- Temperature slider -->
    <text x="16" y="206" font-family="monospace" font-size="10" fill="#6e7681">temperature</text>
    <rect x="16" y="212" width="200" height="6" rx="3" fill="#21262d"/>
    <rect x="16" y="212" width="60" height="6" rx="3" fill="#4285f4"/>
    <circle cx="76" cy="215" r="5" fill="#4285f4"/>
    <text x="230" y="221" font-family="monospace" font-size="10" fill="#4285f4">0.3</text>

    <text x="16" y="242" font-family="monospace" font-size="10" fill="#6e7681">top-p</text>
    <rect x="16" y="248" width="200" height="6" rx="3" fill="#21262d"/>
    <rect x="16" y="248" width="160" height="6" rx="3" fill="#34a853"/>
    <circle cx="176" cy="251" r="5" fill="#34a853"/>
    <text x="230" y="257" font-family="monospace" font-size="10" fill="#34a853">0.8</text>

    <!-- CoT visualization -->
    <text x="16" y="285" font-family="monospace" font-size="10" fill="#6e7681">Chain of Thought:</text>
    <rect x="16" y="292" width="428" height="16" rx="3" fill="#1a1a2e"/>
    <text x="24" y="304" font-family="monospace" font-size="10" fill="#a78bfa">Step 1: Identify the problem type</text>
    <rect x="16" y="314" width="428" height="16" rx="3" fill="#1a1a2e"/>
    <text x="24" y="326" font-family="monospace" font-size="10" fill="#a78bfa">Step 2: Gather relevant information</text>
    <rect x="16" y="336" width="428" height="16" rx="3" fill="#1a1a2e"/>
    <text x="24" y="348" font-family="monospace" font-size="10" fill="#a78bfa">Step 3: Apply reasoning...</text>
    <rect x="16" y="358" width="428" height="20" rx="3" fill="#0d2818"/>
    <text x="24" y="372" font-family="monospace" font-size="10" fill="#4ade80">Final Answer: [result]</text>

    <!-- ReAct -->
    <text x="16" y="400" font-family="monospace" font-size="10" fill="#6e7681">ReAct loop:</text>
    <text x="16" y="416" font-family="monospace" font-size="10" fill="#fbbf24">Thought → Action → Observation → Thought</text>
    <text x="16" y="432" font-family="monospace" font-size="10" fill="#6e7681">  Action: Search["current weather Tokyo"]</text>
    <text x="16" y="448" font-family="monospace" font-size="10" fill="#6e7681">  Obs: "Tokyo: 28°C, partly cloudy"</text>
    <text x="16" y="464" font-family="monospace" font-size="10" fill="#4ade80">  → Final: "Tokyo is 28°C today"</text>
  </g>

  <!-- Right: Title -->
  <text x="590" y="140" font-family="'Segoe UI', sans-serif" font-size="13" fill="#6e7681" letter-spacing="4">LEE BOONSTRA · GOOGLE</text>
  <text x="590" y="205" font-family="'Segoe UI', sans-serif" font-size="52" fill="#f0f6fc" font-weight="800" letter-spacing="-2">Prompt</text>
  <text x="590" y="263" font-family="'Segoe UI', sans-serif" font-size="52" fill="url(#blue)" font-weight="800" letter-spacing="-2">Engineering</text>
  <rect x="590" y="278" width="220" height="4" rx="2" fill="url(#multi)"/>

  <text x="590" y="318" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Whitepaper Google · September 2024</text>
  <text x="590" y="340" font-family="'Segoe UI', sans-serif" font-size="15" fill="#8b949e">Panduan Lengkap Bahasa Indonesia</text>

  <!-- Pills -->
  <g transform="translate(590, 368)">
    <rect x="0" y="0" width="100" height="26" rx="13" fill="#0d1a30"/>
    <text x="50" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4285f4" text-anchor="middle">Zero/Few-Shot</text>
    <rect x="112" y="0" width="80" height="26" rx="13" fill="#0a1f11"/>
    <text x="152" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#34a853" text-anchor="middle">Chain of Thought</text>
    <rect x="204" y="0" width="80" height="26" rx="13" fill="#1a0d2e"/>
    <text x="244" y="17" font-family="'Segoe UI', sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">Tree of Thoughts</text>
    <rect x="0" y="36" width="80" height="26" rx="13" fill="#2a1a00"/>
    <text x="40" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">ReAct</text>
    <rect x="92" y="36" width="100" height="26" rx="13" fill="#1a0a0a"/>
    <text x="142" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f87171" text-anchor="middle">Self-Consistency</text>
    <rect x="204" y="36" width="80" height="26" rx="13" fill="#0d1a0d"/>
    <text x="244" y="53" font-family="'Segoe UI', sans-serif" font-size="11" fill="#4ade80" text-anchor="middle">Code Prompts</text>
  </g>

  <g transform="translate(590, 470)">
    <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.1  Konfigurasi LLM, Zero/Few-Shot, System/Role Prompting</text>
    <text x="0" y="18" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.2  CoT, Self-Consistency, ToT, ReAct, APE, Code Prompting</text>
    <text x="0" y="36" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6e7681">Art.3  Best Practices, Multimodal, Hallucination, Injection</text>
  </g>

  <text x="590" y="600" font-family="'Segoe UI', sans-serif" font-size="12" fill="#30363d">ngopidulur.my.id</text>

  <!-- Corner glow -->
  <circle cx="1170" cy="80" r="100" fill="#4285f4" opacity="0.04"/>
  <circle cx="1170" cy="80" r="50" fill="#4285f4" opacity="0.04"/>
</svg>
